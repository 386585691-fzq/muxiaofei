<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>v114 · 路单记牌器</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" type="image/png" href="./icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "STHeiti", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    background-attachment: fixed;
    color: #e2e8f0;
    min-height: 100vh; padding: 10px;
    max-width: 600px; margin: 0 auto;
  }

  .now-time {
    text-align: right; font-size: 14px; color: #fbbf24;
    font-weight: 700; margin-bottom: 8px; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 20px rgba(251,191,36,.3);
  }

  .section-title { font-size: 12px; color: #94a3b8; margin: 10px 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 6px; font-weight: 600; letter-spacing: 1px; }
  .section-title span:first-child { white-space: nowrap; }
  #searchBox {
    flex: 1; max-width: 180px; background: rgba(255,255,255,.08); border: 1px solid rgba(251,191,36,.3); color: #fbbf24;
    padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; outline: none;
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    backdrop-filter: blur(10px);
  }
  #searchBox::placeholder { color: #64748b; }

  .current {
    background: rgba(30, 41, 59, .6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(251,191,36,.15);
    border-radius: 14px; padding: 8px 10px; margin-bottom: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .group-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .group-name-row label { font-size: 12px; color: #94a3b8; white-space: nowrap; font-weight: 600; }
  #groupName {
    flex: 1; background: rgba(250, 245, 224, .95); border: 2px solid #b8a87a; color: #1a1a1a;
    padding: 5px 10px; border-radius: 8px; font-size: 14px; font-weight: 900; outline: none;
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    box-shadow: 0 4px 15px rgba(184,168,122,.2);
  }
  #groupName::placeholder { color: #b8a87a; font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 6px; }
  .cell {
    background: linear-gradient(180deg, #fef9e7 0%, #f5e9c8 100%);
    border: 1px solid #d4c59a;
    border-radius: 6px;
    box-shadow: 0 2px 0 #a89060, 0 4px 10px rgba(0,0,0,.2), inset 0 1px 0 #fff;
    aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; color: #1a1a1a; cursor: pointer; user-select: none;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    transition: transform .1s;
    position: relative;
  }
  .cell-mark {
    position: absolute; top: 1px; right: 1px;
    width: 14px; height: 14px; border-radius: 50%;
    color: #fff; font-size: 10px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.45); line-height: 1;
  }
  .cell-mark.ok { background: #22c55e; }
  .cell-mark.bad { background: #ef4444; }
  .cell:active { transform: scale(.95); }
  .cell.empty { color: #c5b98a; font-size: 12px; text-shadow: none; }
  .cell.last { box-shadow: 0 2px 0 #a89060, 0 0 0 2px #fbbf24, 0 0 14px rgba(251,191,36,.5); }
  .cell.hu   { color: #dc2626; text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 10px rgba(220,38,38,.2); }
  .cell.long { color: #2563eb; text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 10px rgba(37,99,235,.2); }
  .cell.ru   { color: #d97706; text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 10px rgba(217,119,6,.2); }
  .cell.chu  { color: #16a34a; text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 10px rgba(22,163,74,.2); }

  .pick-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 5px; }
  .pbtn {
    padding: 9px 0; border-radius: 9px; border: 1px solid rgba(255,255,255,.1);
    font-size: 21px; font-weight: 900; cursor: pointer;
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    transition: all .15s;
    box-shadow: 0 3px 10px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .pbtn:active { transform: scale(0.95); }
  .pbtn-hu   { background: linear-gradient(180deg, #991b1b, #7f1d1d); color: #fecaca; }
  .pbtn-long { background: linear-gradient(180deg, #1e40af, #1e3a8a); color: #bfdbfe; }
  .pbtn-ru   { background: linear-gradient(180deg, #b45309, #854d0e); color: #fef08a; }
  .pbtn-chu  { background: linear-gradient(180deg, #15803d, #14532d); color: #bbf7d0; }

  .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .abtn {
    padding: 7px; border-radius: 9px; border: 1px solid rgba(255,255,255,.1);
    font-size: 12px; font-weight: 700; cursor: pointer;
    transition: all .15s;
    backdrop-filter: blur(10px);
  }
  .abtn:active { transform: scale(.97); }
  .abtn-undo { background: rgba(100,116,139,.3); color: #e2e8f0; }
  .abtn-done { background: linear-gradient(180deg, #059669, #047857); color: #d1fae5; }

  .history-item {
    background: rgba(30, 41, 59, .5);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 6px;
    box-shadow: 0 4px 15px rgba(0,0,0,.2);
  }
  .history-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .history-name { font-size: 17px; font-weight: 900; color: #fef3c7; font-family: "STHeiti", "Microsoft YaHei", sans-serif; }
  .history-count { font-size: 11px; color: #94a3b8; margin-left: 6px; font-weight: 400; }
  .history-del { background: none; border: none; color: #f87171; font-size: 12px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  .history-del:hover { background: rgba(248,113,113,.1); }
  .history-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
  .hcell {
    background: linear-gradient(180deg, #fef9e7 0%, #f5e9c8 100%);
    border: 1px solid #d4c59a;
    border-radius: 5px;
    box-shadow: 0 2px 0 #a89060;
    aspect-ratio: 1/1;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: #1a1a1a;
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    position: relative;
  }
  .hcell-mark {
    position: absolute; top: 0; right: 0;
    width: 12px; height: 12px; border-radius: 50%;
    color: #fff; font-size: 8px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .hcell-mark.ok { background: #22c55e; }
  .hcell-mark.bad { background: #ef4444; }
  .hcell.hu   { color: #dc2626; }
  .hcell.long { color: #2563eb; }
  .hcell.ru   { color: #d97706; }
  .hcell.chu  { color: #16a34a; }

  .empty-tip { color: #64748b; text-align: center; padding: 20px 0; font-size: 13px; }
  .clear-all {
    width: 100%; margin-top: 8px; padding: 10px;
    background: linear-gradient(180deg, #991b1b, #7f1d1d); color: #fecaca;
    border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 15px rgba(127,29,29,.3);
  }

  .tag {
    padding: 3px 8px; border-radius: 10px;
    background: #3a3a3a; color: #ccc;
    font-size: 11px; cursor: pointer; border: 1px solid #555;
    user-select: none;
  }
  .tag.active {
    background: #fbbf24; color: #1a1a1a; border-color: #fbbf24; font-weight: 700;
  }

  .mini-btn {
    padding: 3px 8px; border-radius: 10px; border: 1px solid #555;
    background: #3a3a3a; color: #aaa; font-size: 11px; cursor: pointer;
  }
  .mini-btn.on { background: #fbbf24; color: #1a1a1a; border-color: #fbbf24; font-weight: 700; }

  /* ===== 新增：每组画像徽章 & 胜率表 ===== */
  .dist-bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; margin: 3px 0; }
  .dist-hu { background: #dc2626; } .dist-long { background: #2563eb; } .dist-ru { background: #d97706; } .dist-chu { background: #16a34a; }
  .profile-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
  .profile-tag { background: rgba(168,85,247,.15); color: #d8b4fe; padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 600; }
  .rate-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 4px; }
  .rate-table th { background: rgba(251,191,36,.12); color: #fbbf24; padding: 5px 4px; font-weight: 700; text-align: left; }
  .rate-table td { padding: 5px 4px; border-top: 1px solid rgba(255,255,255,.06); vertical-align: middle; }
  .rate-table tr { cursor: pointer; }
  .rate-table tr:hover td { background: rgba(251,191,36,.05); }
  .rate-num { font-variant-numeric: tabular-nums; }

#nameSuggest .suggest-item{ padding:6px 10px; color:#fef3c7; font-size:14px; cursor:pointer; border-bottom:1px solid rgba(251,191,36,.12); font-weight:700; }
#nameSuggest .suggest-item:hover, #nameSuggest .suggest-item.active{ background:rgba(251,191,36,.15); color:#facc15; }

#aiHint .aihint-warn{ background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.4); color:#fecaca; border-radius:8px; padding:5px 8px; font-size:12px; font-weight:700; margin-bottom:3px; }
#aiHint .aihint-ok{ background:rgba(148,163,184,.08); border:1px solid rgba(148,163,184,.25); color:#cbd5e1; border-radius:8px; padding:4px 8px; font-size:11px; margin-bottom:3px; }

.pbtn.top1{ outline:2px solid #fbbf24; box-shadow:0 0 10px rgba(251,191,36,.55); }
.pbtn.top2{ outline:1px solid rgba(251,191,36,.45); }

  .navbtn{flex:1;padding:8px 0;border-radius:8px;background:rgba(251,191,36,.12);color:#fbbf24;font-size:13px;font-weight:700;border:1px solid rgba(251,191,36,.25);cursor:pointer;font-family:inherit;}
  .tbtn{padding:5px 10px;border-radius:6px;background:rgba(251,191,36,.08);color:#fbbf24;font-size:12px;font-weight:700;border:1px solid rgba(251,191,36,.25);cursor:pointer;font-family:inherit;}
  .tbtn.on{background:rgba(251,191,36,.35);border-color:#fbbf24;}
  .navbtn:active{background:rgba(251,191,36,.35);}
  #topNav{position:sticky;top:0;z-index:50;display:flex;gap:6px;background:rgba(15,23,42,.95);backdrop-filter:blur(10px);padding:6px 8px;border-bottom:1px solid rgba(251,191,36,.2);}

  .page{display:none;}
  .page.active{display:block;}
</style>
</head>
<body>
<div id="updateBar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9997;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#0f172a;text-align:center;padding:9px;font-size:13px;font-weight:900;cursor:pointer;" onclick="location.reload()">🔄 发现新版本 <span id="updBarVer"></span>，点这里立即更新</div>
<!-- 密码锁 -->
<div id="lockScreen" style="position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e1b4b);z-index:9999;display:none;align-items:center;justify-content:center;">
  <div style="background:rgba(30,41,59,.8);backdrop-filter:blur(20px);border:1px solid rgba(251,191,36,.2);border-radius:16px;padding:30px;width:300px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);">
    <div style="font-size:24px;font-weight:900;color:#fbbf24;margin-bottom:20px;">路单记牌器</div>
    <input id="lockPwd" type="password" placeholder="请输入密码" style="width:100%;padding:12px;border-radius:10px;border:2px solid rgba(251,191,36,.3);background:rgba(255,255,255,.08);color:#fbbf24;font-size:18px;font-weight:700;text-align:center;outline:none;margin-bottom:12px;">
    <div id="lockMsg" style="color:#ef4444;font-size:12px;margin-bottom:10px;min-height:16px;"></div>
    <button id="lockBtn" style="width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(180deg,#d97706,#b45309);color:#fef08a;font-size:16px;font-weight:900;cursor:pointer;">进 入</button>
    <div id="lockReset" style="font-size:11px;color:#64748b;margin-top:10px;text-align:center;cursor:pointer;">忘记密码？点此重置本机密码</div>
    <div style="font-size:11px;color:#64748b;margin-top:12px;" id="lockTip"></div>
  </div>
</div>
<div id="loginBar" style="display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-bottom:4px;padding:0 2px;">
  <span id="loginState" style="font-size:11px;color:#94a3b8;"></span>
  <button id="loginBtn" onclick="showLoginModal()" style="padding:4px 10px;border-radius:6px;background:rgba(251,191,36,.12);color:#fbbf24;font-size:11px;font-weight:700;border:1px solid rgba(251,191,36,.3);cursor:pointer;font-family:inherit;">登录</button>
  <button id="updateBtn" onclick="forcePageUpdate()" title="检查新版本并刷新页面" style="padding:4px 10px;border-radius:6px;background:rgba(52,211,153,.12);color:#34d399;font-size:11px;font-weight:700;border:1px solid rgba(52,211,153,.3);cursor:pointer;font-family:inherit;">🔄 更新 <span id="updVer"></span></button>
</div>
<div id="loginModal" style="position:fixed;inset:0;background:rgba(2,6,23,.75);z-index:9998;display:none;align-items:center;justify-content:center;">
  <div style="background:rgba(30,41,59,.97);border:1px solid rgba(251,191,36,.25);border-radius:16px;padding:24px;width:300px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);">
    <div style="font-size:19px;font-weight:900;color:#fbbf24;margin-bottom:14px;">账号登录</div>
    <input id="loginPhone" type="text" placeholder="手机号（11位，1开头）" maxlength="11" style="width:100%;padding:12px;border-radius:10px;border:2px solid rgba(251,191,36,.3);background:rgba(255,255,255,.08);color:#fbbf24;font-size:15px;font-weight:700;text-align:center;outline:none;margin-bottom:10px;box-sizing:border-box;font-family:inherit;">
    <input id="loginCode" type="text" placeholder="验证码" maxlength="6" style="width:100%;padding:12px;border-radius:10px;border:2px solid rgba(251,191,36,.3);background:rgba(255,255,255,.08);color:#fbbf24;font-size:15px;font-weight:700;text-align:center;outline:none;margin-bottom:6px;box-sizing:border-box;font-family:inherit;">
    <div style="font-size:10px;color:#64748b;margin-bottom:10px;">🔧 测试版：验证码固定 <span style="color:#fbbf24;font-weight:700;">123456</span>（正式版接短信后变真验证码）</div>
    <button id="loginOk" onclick="doLogin()" style="width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(180deg,#d97706,#b45309);color:#fef08a;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;">登 录</button>
    <button id="loginCancel" onclick="hideLoginModal()" style="width:100%;padding:9px;border-radius:10px;border:1px solid rgba(148,163,184,.3);background:transparent;color:#94a3b8;font-size:13px;cursor:pointer;margin-top:8px;font-family:inherit;">取 消</button>
  </div>
</div>
<div id="topNav">
  <button class="navbtn active" data-page="record">📝 记录</button>
  <button class="navbtn" data-page="ai">🎯 AI关注</button>
  <button class="navbtn" data-page="analyze">📊 分析</button>
  <button class="navbtn" data-page="cloud">☁️ 云端分析</button>
  <button class="navbtn" data-page="history">📚 历史</button>
  <select id="acctSel" style="margin-left:6px;padding:4px 8px;border-radius:6px;background:#1e293b;color:#e2e8f0;font-size:11px;border:1px solid #334155;max-width:110px;" title="切换账号"></select>
</div>

<div class="current page active" id="page-record">
  <div class="group-name-row" id="sec-ai">
    <label>组名</label>
    <input id="groupName" type="text" placeholder="点下面选，或自己打，多个名字用逗号隔开" maxlength="20" style="flex:1;min-width:0;">
    <span id="curFrameBadge"></span>
    <button id="groupNameQuery" style="padding:6px 12px;border-radius:8px;background:rgba(251,191,36,.15);color:#fbbf24;font-size:12px;font-weight:700;border:1px solid rgba(251,191,36,.35);cursor:pointer;white-space:nowrap;">查询</button>
    <button id="recordRefresh" onclick="recordRefresh()" style="padding:6px 12px;border-radius:8px;background:rgba(52,211,153,.15);color:#34d399;font-size:12px;font-weight:700;border:1px solid rgba(52,211,153,.35);cursor:pointer;white-space:nowrap;">🔄 刷新</button>
    <div id="nameSuggest" style="display:none;position:relative;background:#1e293b;border:1px solid rgba(251,191,36,.4);border-radius:8px;margin-top:4px;max-height:210px;overflow-y:auto;z-index:20;"></div>
    <div id="aiHint" style="display:none;margin-top:4px;line-height:1.5;"></div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
    <span style="font-size:10px;color:#888;">快捷选名</span><span style="font-size:9px;color:#6b7280;margin-left:8px;">v114</span>
    <button id="toggleNameBar" style="padding:1px 6px;border-radius:6px;background:#3a3a3a;color:#aaa;font-size:10px;border:1px solid #555;cursor:pointer;">展开 ▶</button>
  </div>
  <div id="nameBar" style="display:none;flex-wrap:wrap;gap:4px;margin-bottom:6px;max-height:150px;overflow-y:auto;"></div>
  <div class="grid" id="grid"></div>
  <div class="pick-btns">
    <button class="pbtn pbtn-hu" data-s="hu">虎</button>
    <button class="pbtn pbtn-long" data-s="long">龙</button>
    <button class="pbtn pbtn-ru" data-s="ru">入</button>
    <button class="pbtn pbtn-chu" data-s="chu">出</button>
  </div>
  <div class="action-row">
    <button class="abtn abtn-undo" id="undoBtn">撤销</button>
    <button class="abtn abtn-done" id="doneBtn">完成本组并开新组</button>
  </div>
  <div id="liveHint" style="margin-top:5px;"></div>
</div>




<div class="page" id="page-ai">
  <div style="font-size:12px;color:#fbbf24;font-weight:700;margin-bottom:6px;">🎯 AI关注 · 四门规律（从数据学习）</div>
<div style="display:flex;gap:4px;align-items:center;">
  <input id="aiNameInput" type="text" placeholder="输入人名（如 顺顺、牡丹），查看这个人的规律" maxlength="20" style="flex:1;min-width:0;padding:9px 10px;border-radius:8px;border:1px solid rgba(251,191,36,.3);background:rgba(255,255,255,.08);color:#fbbf24;font-size:14px;font-weight:700;outline:none;box-sizing:border-box;font-family:inherit;">
  <button id="aiQuery" style="padding:6px 12px;border-radius:8px;background:rgba(251,191,36,.15);color:#fbbf24;font-size:12px;font-weight:700;border:1px solid rgba(251,191,36,.35);cursor:pointer;white-space:nowrap;">查询</button>
  </div>
  <div id="aiTimeBar" style="display:flex;gap:4px;margin:6px 0;flex-wrap:wrap;">
    <button class="tbtn on" data-tf="all">全部</button>
    <button class="tbtn" data-tf="day">今天</button>
    <button class="tbtn" data-tf="yday">昨天</button>
    <button class="tbtn" data-tf="week">本周</button>
    <button class="tbtn" data-tf="month">本月</button>
    <button class="tbtn" data-tf="year">今年</button>
  </div>
  <div id="rtBar" style="display:flex;align-items:center;gap:6px;margin:2px 0 6px;">
    <button id="rtBtn" onclick="toggleRT()" style="padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.4);">🔴 实时监控中</button>
    <span id="rtStatus" style="font-size:10px;color:#64748b;">自动抓云端新登记·每60秒</span>
  </div>
  <div id="aiViewBar" style="margin:6px 0 4px;"></div>
  <div id="aiNameSuggest" style="display:none;position:absolute;background:#1e293b;border:1px solid rgba(251,191,36,.4);border-radius:8px;max-height:200px;overflow-y:auto;z-index:40;min-width:160px;"></div>
  <div id="aiFocusBody" style="margin-top:6px;"></div>
  <div id="aiFocusList" style="margin-top:8px;"></div>
</div>
<div class="page" id="page-analyze">
  <div id="analyzeBody"></div>
</div>
<div class="page" id="page-cloud">
  <div id="cloudSection" style="margin-bottom:8px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:12px;color:#34d399;font-weight:700;">云端分析 · 实时热度/胜率</span>

  function acctLabel(a){ a = a || curAccount; if (a === 'main') return 'AA（主账号）'; if (a === '13828947776') return 'BB'; if (a === '15024484009') return 'CC'; return a; }
  function acctDefaultPwd(){ if (curAccount === 'main' || curAccount === '13828947776') return 'aa123123'; if (curAccount === '15024484009') return 'qq123123'; return null; }
  // ===== 账号登录（测试版：手机号 + 固定验证码 123456） =====

  // 暴露到 window（HTML onclick 需要全局访问）

  // 版本号：从页面标题自动提取，填到更新按钮/更新提示条（以后只改标题即可同步版本）
  try {

  // 顶部"🔄 更新"按钮：先触发 Service Worker 检查更新，再刷新页面
  window.forcePageUpdate = function(){

      if ('serviceWorker' in navigator && navigator.serviceWorker.controller){
        navigator.serviceWorker.getRegistration().then(function(reg){ if (reg) reg.update(); }).catch(function(){});

  };
  // PWA：注册 Service Worker（离线缓存 + 添加到主屏幕成 App）+ 新版本检测
  if ('serviceWorker' in navigator){
      startRT(); // 实时监控默认开（AI关注页自动抓云端新登记）

  navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){

          if (nw.state === 'installed' && navigator.serviceWorker.controller){
            var ub = document.getElementById('updateBar');

        });
      });

  }
  // 页面加载后更新登录状态
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', updateLoginUI);
  else updateLoginUI();
  // 密码锁：解锁后更新登录UI
  var _ol = window.onload;

  // 密码锁逻辑
  var __locked = true;  // 锁屏未解锁：暂停重活（渲染/云端分析），解锁后才跑（输入密码不卡）
  var __unlockHooks = [];

    __locked = false;

    __unlockHooks = [];
  }
  function checkLock(){
    try { if (localStorage.getItem('road_session_v1') !== 'v99'){ try { localStorage.removeItem(LOGIN_KEY); } catch(e){} try { localStorage.setItem('road_session_v1', 'v99'); } catch(e){} } } catch(e){}
    var savedPwd = localStorage.getItem(acctPwdKey());
    var _dp = acctDefaultPwd();
    if (_dp) savedPwd = _dp;
    var lock = document.getElementById('lockScreen');

    var msg = document.getElementById('lockMsg');

      // 第一次使用，设置密码
      tip.textContent = '首次使用 ' + acctLabel() + '，请设置密码';
      document.getElementById('lockBtn').onclick = function(){
        var p1 = pwdInput.value.trim();
        if (p1.length < 4){ msg.textContent = '密码至少4位'; return; }
        localStorage.setItem(acctPwdKey(), p1);
        lock.style.display = 'none';
        __unlockGo();
      };
    } else {
      tip.textContent = acctLabel() + ' 的密码';
      document.getElementById('lockBtn').onclick = function(){
        if (pwdInput.value === savedPwd){
          lock.style.display = 'none';
          __unlockGo();
        } else {
          msg.textContent = '密码错误';
        }
      };
    }
    pwdInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter') document.getElementById('lockBtn').click();
    });
    var rs = document.getElementById('lockReset');
    if (rs) rs.onclick = function(){
      if (confirm('重置 ' + acctLabel() + ' 的本机密码？重置后需重新设置')){ try { localStorage.removeItem(acctPwdKey()); } catch(e){} location.reload(); }
    };
    lock.style.display = 'flex';
  }
  checkLock();

  const STORE_KEY = 'road_groups_v2';
  const CUR_KEY = 'road_cur_v1';  // 录手即时小写：当前组快照（数据不丢 + 不卡）
  const IMPORTED_FLAG = 'imported_v1';
  const SYMBOLS = { hu:'虎', long:'龙', ru:'入', chu:'出' };
  const NEXT = { hu:'long', long:'ru', ru:'chu', chu:null };
  const COLS = 6;

  // 折叠当前记录区的人名列表
  document.getElementById('toggleNameBar').addEventListener('click', function(){
    const bar = document.getElementById('nameBar');
    const show = bar.style.display === 'none';
    bar.style.display = show ? 'flex' : 'none';
    this.textContent = show ? '收起 ▼' : '展开 ▶';
    if (show && typeof renderNameBar === 'function') renderNameBar();
  });



  // ===== 页面切换：5 个独立页面（记录/AI关注/分析/云端分析/历史） =====
  function switchPage(p){
    document.querySelectorAll('.page').forEach(function(x){ x.classList.remove('active'); });
    document.querySelectorAll('.navbtn').forEach(function(x){ x.classList.remove('active'); });
    var el = document.getElementById('page-' + p);

      renderAIPage();
      // 点AI关注即静默同步云端最新数据（5秒内不重复拉）

        _lastAiSync = nowMs;
        if (typeof fetchCloudNew === 'function') fetchCloudNew();

    if (p === 'cloud'){

    }
    if (p === 'history'){ renderTags(); renderHistory(); }
    window.scrollTo(0,0);
  }
  document.querySelectorAll('.navbtn').forEach(function(b){

  });
  document.querySelectorAll('#cloudTimeBar .tbtn').forEach(function(b){
    b.addEventListener('click', function(){
      cloudTimeFilter = b.dataset.tf;
      document.querySelectorAll('#cloudTimeBar .tbtn').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      cloudAnalyze(true);
    });
  });

  // AI关注页：全局平均 + 个人规律 + 关注列表
  var aiTimeFilter = 'all';
  var _lastAiSync = 0;
  var cloudTimeFilter = 'all';
  function parseTime(ts){
    if (ts == null || ts === '') return null;
    if (typeof ts === 'number' || /^\d{10,}$/.test(String(ts).trim())){
      var dt = new Date(Number(ts));
      if (isNaN(dt.getTime())) return null;
      return {y:dt.getFullYear(), m:dt.getMonth()+1, d:dt.getDate()};
    }
    var mm = String(ts).trim().match(/^(\d{1,2})-(\d{1,2})/);
    if (mm){
      var now = new Date();
      return {y:now.getFullYear(), m:+mm[1], d:+mm[2]};
    }
    return null;
  }
  function timeFilterGroups(groups){
    if (!aiTimeFilter || aiTimeFilter === 'all') return groups || [];
    var now = new Date();
    var cy = now.getFullYear(), cm = now.getMonth()+1, cd = now.getDate();
    var wd = now.getDay(); if (wd === 0) wd = 7;
    var monday = new Date(cy, cm-1, cd - (wd-1));
    return (groups||[]).filter(function(g){
      var t = parseTime(g && g.time);
      if (!t) return false;
      if (aiTimeFilter === 'day') return t.m === cm && t.d === cd;
      if (aiTimeFilter === 'yday'){
        var yd = new Date(cy, cm-1, cd-1);
        return t.y === yd.getFullYear() && t.m === yd.getMonth()+1 && t.d === yd.getDate();
      }
      if (aiTimeFilter === 'week'){
        var d0 = new Date(t.y, t.m-1, t.d);
        return d0 >= monday && d0 <= now;
      }
      if (aiTimeFilter === 'month') return t.m === cm;
      if (aiTimeFilter === 'year') return t.y === cy;
      return true;
    });
  }
    // 逗号组名拆分：一局多人各自独立统计（四门规律/框架借用共用）
  function splitNames(nm){ return String(nm).split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean); }

  // AI 关注 · 四门规律（用传入的组数据学习）
  function renderDoorPatterns(groups){
    var html = '';
    var DOOR_NAME = { hu:'虎', long:'龙', ru:'入', chu:'出' };
    var doorsArr = ['hu','long','ru','chu'];
    var doorColor = { hu:'#dc2626', long:'#2563eb', ru:'#16a34a', chu:'#64748b' };

        // 1, function(bn){ if(box) box.innerHTML = '<div style="color:#34d399;font-size:12px;padding:12px;text-align:center;">正在从云端拉取数据计算…（已拉 ' + bn + ' 批，首次约10秒）</div>'; }) 全局四门基准（从全部数据学习）
        var gTotal = {hu:0,long:0,ru:0,chu:0,all:0};
        groups.forEach(function(g){
          if (!g || !g.list) return;
          g.list.forEach(function(x){ if (gTotal[x] !== undefined){ gTotal[x]++; gTotal.all++; } });
        });
        var gp = {};
        doorsArr.forEach(function(x){ gp[x] = gTotal.all ? Math.round(gTotal[x]/gTotal.all*100) : 25; });
        // 2) 每人四门分布 + 近15手
        var ds = {};
        var near = {};
        groups.forEach(function(g){
          if (!g || !g.name || !g.list) return;
          var nms = splitNames(g.name);
          nms.forEach(function(nm){
            var s = ds[nm] || (ds[nm] = {hu:0,long:0,ru:0,chu:0,total:0,groups:0});
            s.groups++;
            g.list.forEach(function(x){ if (s[x] !== undefined) s[x]++; s.total++; });
            var arr = near[nm] || (near[nm] = []);
            g.list.forEach(function(x){ arr.push(x); });
            if (arr.length > 15) arr.splice(0, arr.length - 15);
          });
        });
        // 3) 学习规律（个人 vs 全局基准 + 专走三门 + 近期动态）
        var focus = [];
        Object.keys(ds).forEach(function(n){
          var s = ds[n];
          if (s.total < 8) return;
          var tags = [];
          var p = {};
          doorsArr.forEach(function(x){ p[x] = Math.round(s[x]/s.total*100); });
          // 专走三门：某门一次没走，其他三门都走（用户观察：一直龙虎出不走入）
          doorsArr.forEach(function(x){
            if (s[x] === 0){
              var others = doorsArr.filter(function(y){ return s[y] > 0; });
              if (others.length === 3) tags.push({t:'⚠️专走'+others.map(function(y){return DOOR_NAME[y];}).join('')+'留'+DOOR_NAME[x]+'·疑似诱单', c:'#f87171'});
              else if (gp[x] > 10) tags.push({t:'从不出'+DOOR_NAME[x]+'门', c:'#f87171'});
            }
          });
          // 四留一：某门占比极低(<全局一半 且 <12%)
          doorsArr.forEach(function(x){ if (s[x] > 0 && p[x] < 12 && p[x] < gp[x]/2) tags.push({t:DOOR_NAME[x]+'门极少'+p[x]+'%(平均'+gp[x]+'%)', c:'#fbbf24'}); });
          // 单边主导：某门比全局平均多出>=20%
          doorsArr.forEach(function(x){ if (p[x] - gp[x] >= 20) tags.push({t:DOOR_NAME[x]+'门偏多+'+ (p[x]-gp[x]) +'%(平均'+gp[x]+'%)', c:'#4ade80'}); });
          // 两门集中：主走两门>=85%
          var sp = doorsArr.slice().sort(function(a,b){ return p[b]-p[a]; });
          if (p[sp[0]]+p[sp[1]] >= 85) tags.push({t:'主走'+DOOR_NAME[sp[0]]+DOOR_NAME[sp[1]]+'门'+String(p[sp[0]]+p[sp[1]])+'%', c:'#38bdf8'});
          // 专走两门：top2>=85% 且另外两门合计<=10%（一直只跑2门）
          var sp2 = doorsArr.slice().sort(function(a,b){ return p[b]-p[a]; });
          var oth2 = doorsArr.filter(function(x){ return x!==sp2[0] && x!==sp2[1]; });
          if (s.total >= 12 && p[sp2[0]]+p[sp2[1]] >= 85 && (s[oth2[0]]+s[oth2[1]]) <= s.total*0.10){
            tags.push({t:'专走'+DOOR_NAME[sp2[0]]+DOOR_NAME[sp2[1]]+' · 从不出'+DOOR_NAME[oth2[0]]+DOOR_NAME[oth2[1]], c:'#fb923c'});
          }
          // 近15手专走两门（近期一直只跑2门）
          var arr = near[n] || [];
          if (arr.length >= 10){
            var tc = {hu:0,long:0,ru:0,chu:0};
            arr.forEach(function(x){ if (tc[x]!==undefined) tc[x]++; });
            var ttot = arr.length;
            var tp = {};
            doorsArr.forEach(function(x){ tp[x] = Math.round(tc[x]/ttot*100); });
            var tsp = doorsArr.slice().sort(function(a,b){ return tp[b]-tp[a]; });
            var toth = doorsArr.filter(function(x){ return x!==tsp[0] && x!==tsp[1]; });
            if (tp[tsp[0]]+tp[tsp[1]] >= 85 && (tc[toth[0]]+tc[toth[1]]) <= ttot*0.10){
              tags.push({t:'近15手专走'+DOOR_NAME[tsp[0]]+DOOR_NAME[tsp[1]]+' · 从不出'+DOOR_NAME[toth[0]]+DOOR_NAME[toth[1]], c:'#fb923c'});
            }
          }
          // 走过即停：某门开头走完、后半场不再出（用户观察：走了入后续不再入）
          var allLst = [];
          groups.forEach(function(g){
            if (!g || !g.list) return;
            if (splitNames(g.name).indexOf(n) < 0) return;
            allLst = allLst.concat(g.list);
          });
          if (allLst.length >= 10){
            var half = Math.ceil(allLst.length/2);
            var head = allLst.slice(0, half);
            var tail2 = allLst.slice(half);
            doorsArr.forEach(function(x){
              if (head.indexOf(x) >= 0 && tail2.indexOf(x) < 0) tags.push({t:'走过即停：'+DOOR_NAME[x]+'开头走完，后半不再出', c:'#fb923c'});
            });
            // 后半场只跑2门到结束
            if (tail2.length >= 6){
              var tc3 = {hu:0,long:0,ru:0,chu:0};
              tail2.forEach(function(x){ if (tc3[x]!==undefined) tc3[x]++; });
              var alive2 = doorsArr.filter(function(x){ return tc3[x] > 0; });
              if (alive2.length === 2) tags.push({t:'后半场只跑'+DOOR_NAME[alive2[0]]+DOOR_NAME[alive2[1]]+'到结束', c:'#fbbf24'});

  // ===== 连对规律：开头连对 + 后段全单蹦（心理诱单） =====
  function calcLurePattern(groups){
    var DRN = {hu:'虎',long:'龙',ru:'入',chu:'出'};
    var out = [];
    (groups || []).forEach(function(g){
      var lst = g.list || [];
      if (lst.length < 6) return;
      if (lst[0] === undefined || lst[0] !== lst[1]) return;
      var hasMorePair = false;
      for (var i=2; i<lst.length; i++){
        if (lst[i] === lst[i-1]){ hasMorePair = true; break; }
      }
      if (hasMorePair) return;
      out.push({name: g.name || '', pair: DRN[lst[0]] + DRN[lst[0]], len: lst.length, tail: lst.length - 2});
    });
    return out;
  }

  function renderGrid(){
    const g = $('grid');
    const cur = state.current;
    const marks = state.currentMarks || [];
    const N = 12;
    let html = '';
    for (let i=0; i<N; i++){
      const s = cur[i];
      const isLast = i === cur.length - 1;
      const m = marks[i];
      let inner = '';
      if (s){
        inner = SYMBOLS[s];
        if (m === 1 || m === 0) inner += `<span class="cell-mark ${m?'ok':'bad'}">${m?'✓':'×'}</span>`;
      } else {
        inner = (i+1);
      }
      html += `<div class="cell ${s||'empty'}${isLast?' last':''}" data-idx="${i}">${inner}</div>`;
    }
    g.innerHTML = html;
    g.querySelectorAll('.cell').forEach(c => {
      c.addEventListener('click', () => {
        const idx = parseInt(c.dataset.idx);
        if (idx >= cur.length) return;
        const s = cur[idx];
        const nxt = NEXT[s];
        if (nxt){
          cur[idx] = nxt;
          // 同步该手对错：用前idx手预测这一手
          var pr = predictMain(cur.slice(0, idx), getFiltered());
          state.currentMarks[idx] = pr.top.indexOf(nxt) >= 0 ? 1 : 0;
        } else {
          cur.splice(idx, 1);
          if (state.currentMarks && state.currentMarks.length) state.currentMarks.splice(idx, 1);
        }
        save(); renderLight(); updateRecommend();
      });
    });
  }

  function parseNames(str){

    const todayStr = (now.getMonth()+1) + '-' + pad(now.getDate());
    const yest = new Date(); yest.setDate(yest.getDate()-1);
    const yestStr = (yest.getMonth()+1) + '-' + pad(yest.getDate());

    if (!all.length){

      all = state.groups.filter(g => g.time && g.time.startsWith(base));

  // ===== 统计学习AI大脑（第二信号源）：马尔可夫转移 + 条件概率 + 位置分布 =====
  function statBrain(curArr, filtered, agg){
    var KEYS = ['hu','long','ru','chu'];
    var s = {hu:0,long:0,ru:0,chu:0};
    if (!filtered.length) return s;
    // 全局字符频率（用作平滑先验，避免样本少时零概率）
    var prior, priorT;
    if (agg){ prior = agg.pr; priorT = agg.prT; }
    else {
      prior = {hu:0,long:0,ru:0,chu:0}; priorT = 0;
      filtered.forEach(function(g){ g.list.forEach(function(x){ prior[x]++; priorT++; }); });
    }
    // 一阶马尔可夫：P(下一手 | 当前最后一手)，拉普拉斯平滑 + 先验混合
    if (curArr.length >= 1){
      var last = curArr[curArr.length-1];
      var tr, trT = 0;
      if (agg){ tr = agg.t1[last] || {hu:0,long:0,ru:0,chu:0}; KEYS.forEach(function(k){ trT += tr[k]||0; }); }
      else {
        tr = {hu:0,long:0,ru:0,chu:0};
        filtered.forEach(function(g){
          for (var i=0;i<g.list.length-1;i++){
            if (g.list[i] === last){ tr[g.list[i+1]]++; trT++; }
          }
        });
      }
      var a1 = 2;
      KEYS.forEach(function(k){
        s[k] += (tr[k] + a1*(prior[k]+1)/(priorT+4)) / (trT + a1);
      });
    }
    // 二阶马尔可夫：P(下一手 | 最近两手)，权重加倍
    if (curArr.length >= 2){
      var last2 = curArr.slice(-2);
      var tr2, tr2T = 0;
      if (agg){ tr2 = agg.t2[last2[0]+'|'+last2[1]] || {hu:0,long:0,ru:0,chu:0}; KEYS.forEach(function(k){ tr2T += tr2[k]||0; }); }
      else {
        tr2 = {hu:0,long:0,ru:0,chu:0};
        filtered.forEach(function(g){
          for (var i=0;i<g.list.length-2;i++){
            if (g.list[i]===last2[0] && g.list[i+1]===last2[1]){ tr2[g.list[i+2]]++; tr2T++; }
          }
        });
      }
      var a2 = 1.5;
      KEYS.forEach(function(k){
        s[k] += 2 * (tr2[k] + a2*(prior[k]+1)/(priorT+4)) / (tr2T + a2);
      });
    }
    // 位置分布：当前第 N 手位置上，历史上各符号出现频率
    var pos = curArr.length;
    var pc, pcT = 0;
    if (agg){ pc = agg.pos[pos] || {hu:0,long:0,ru:0,chu:0}; KEYS.forEach(function(k){ pcT += pc[k]||0; }); }
    else {
      pc = {hu:0,long:0,ru:0,chu:0};
      filtered.forEach(function(g){ if (g.list.length > pos){ pc[g.list[pos]]++; pcT++; } });
    }
    if (pcT > 0){
      KEYS.forEach(function(k){ s[k] += (pc[k] + 0.5) / (pcT + 2); });
    }
    return s;
  }

  function predictTop2(curArr, filtered){
    if (!filtered.length) return []; // 只学这个人，没数据不瞎猜
    var score = {hu:0, long:0, ru:0, chu:0};
    var now = new Date().getTime();
    function parseT(g){
      if (!g.time) return now - 7*24*3600*1000;
      var parts = g.time.split(' ');
      var d = parts[0].split('-');
      var y = 2026, mo = parseInt(d[0])-1, da = parseInt(d[1]);
      var h=0, mi=0;
      if (parts[1]){ var hm=parts[1].split(':'); h=parseInt(hm[0]); mi=parseInt(hm[1]); }
      return new Date(y,mo,da,h,mi).getTime();
    }
    function buildAgg(fg){
      var A = { g1:{}, g2:{}, g3:{}, g4:{}, c2:{}, c3:{}, pos:{}, gF:{hu:0,long:0,ru:0,chu:0}, pr:{hu:0,long:0,ru:0,chu:0}, prT:0, t1:{}, t2:{} };
      fg.forEach(function(g, gi){
        var L = g.list.length;
        for (var i=0;i<L;i++){
          var x = g.list[i], w = wg(g, gi, i);
          A.gF[x] += w; A.pr[x]++; A.prT++;
          (A.pos[i] = A.pos[i] || {hu:0,long:0,ru:0,chu:0})[x] += w;
          if (i>=1){
            var a = g.list[i-1];
            (A.g1[a] = A.g1[a] || {hu:0,long:0,ru:0,chu:0})[x] += w;
            (A.t1[a] = A.t1[a] || {hu:0,long:0,ru:0,chu:0})[x]++;
            if (i>=2 && g.list[i-1]===g.list[i-2]){
              (A.c2[a] = A.c2[a] || {hu:0,long:0,ru:0,chu:0})[x] += w;
            }
            if (i>=3 && g.list[i-1]===g.list[i-2] && g.list[i-2]===g.list[i-3]){
              (A.c3[a] = A.c3[a] || {hu:0,long:0,ru:0,chu:0})[x] += w;
            }
          }
          if (i>=2){
            var k2 = g.list[i-2] + '|' + g.list[i-1];
            (A.g2[k2] = A.g2[k2] || {hu:0,long:0,ru:0,chu:0})[x] += w;
            (A.t2[k2] = A.t2[k2] || {hu:0,long:0,ru:0,chu:0})[x]++;
          }
          if (i>=3){
            var k3 = g.list[i-3] + '|' + g.list[i-2] + '|' + g.list[i-1];
            (A.g3[k3] = A.g3[k3] || {hu:0,long:0,ru:0,chu:0})[x] += w;
          }
          if (i>=4){
            var k4 = g.list[i-4] + '|' + g.list[i-3] + '|' + g.list[i-2] + '|' + g.list[i-1];
            (A.g4[k4] = A.g4[k4] || {hu:0,long:0,ru:0,chu:0})[x] += w;
          }
        }
      });
      return A;
    }
    var tk = '';
    for (var ti=0; ti<filtered.length; ti++) tk += '|' + (filtered[ti].time||'') + ':' + (filtered[ti].list||[]).length;
    var tc = window.__ptTimes || (window.__ptTimes = {});
    var times, agg;
    if (tc[tk] && tc[tk].n === filtered.length){ times = tc[tk].t; agg = tc[tk].agg; }
    else {
      times = filtered.map(parseT);
      agg = buildAgg(filtered);
      tc[tk] = { n: filtered.length, t: times, agg: agg };
    }
    var maxT = Math.max.apply(null, times);
    // 时间加权（增强版）：越新的组权重越高；老数据快速衰减，避免淹没新习惯
    function w(i){
      var diffH = (maxT - times[i]) / 3600000;
      if (diffH <= 12) return 2.4 - (diffH/12)*0.8;      // 12小时内 2.4 → 1.6
      if (diffH <= 48) return 1.6 - (diffH-12)/60;        // 12-48小时 1.6 → 1.0
      return Math.max(0.12, 1.0 - (diffH-48)/100);        // 48小时后快速衰减，下限0.12
    }
    // 组内位置加权：同一条路单里越靠后的手数（越接近当前状态）权重越高
    function posW(g, pos){
      var L = g.list.length;
      if (L <= 1 || pos <= 0) return 1;
      if (pos >= L-1) return 1.5;
      return 1 + 0.5 * pos / (L-1);
    }
    function wg(g, gi, pos){ return w(gi) * posW(g, pos); }
    // 前缀匹配
    var pC = {hu:0,long:0,ru:0,chu:0};
    filtered.forEach(function(g, gi){
      var ok = true;
      for (var i=0;i<curArr.length;i++){ if(g.list[i]!==curArr[i]){ok=false;break;} }
      if (ok && g.list.length>curArr.length) pC[g.list[curArr.length]] += wg(g, gi, curArr.length);
    });
    var pT = pC.hu+pC.long+pC.ru+pC.chu;
    if (pT>=1) ['hu','long','ru','chu'].forEach(function(k){ score[k]+=pC[k]*3; });
    // 上一手（1-gram）
    if (curArr.length>=1){
      var last1 = curArr[curArr.length-1];
      var c1 = agg.g1[last1] || {hu:0,long:0,ru:0,chu:0};
      ['hu','long','ru','chu'].forEach(function(k){ score[k]+=c1[k]*1.5; });
    }
    // 位置统计
    var pos = curArr.length;
    var pc = agg.pos[pos] || {hu:0,long:0,ru:0,chu:0};
    ['hu','long','ru','chu'].forEach(function(k){ score[k] += pc[k]; });
    // 连出2个后规律
    if (curArr.length>=2 && curArr[curArr.length-1]===curArr[curArr.length-2]){
      var last = curArr[curArr.length-1];
      var cc = agg.c2[last] || {hu:0,long:0,ru:0,chu:0};
      var cont = cc[last] || 0;
      var revT = (cc.hu||0)+(cc.long||0)+(cc.ru||0)+(cc.chu||0) - cont;
      if (cont + revT > 0){
        if (cont >= revT) score[last] += cont * 2;
        else ['hu','long','ru','chu'].forEach(function(k){ if(k!==last) score[k] += (cc[k]||0) * 2; });
      } else {
        ['hu','long','ru','chu'].forEach(function(k){ if(k!==last) score[k]+=0.5; });
      }
    }
    // 2-gram
    if (curArr.length>=2){
      var last2 = curArr.slice(-2);
      var c2 = agg.g2[last2[0] + '|' + last2[1]] || {hu:0,long:0,ru:0,chu:0};
      var t2 = (c2.hu||0)+(c2.long||0)+(c2.ru||0)+(c2.chu||0);
      if (t2>=1) ['hu','long','ru','chu'].forEach(function(k){ score[k]+=(c2[k]||0)*4; });
    }
    // 3-gram
    if (curArr.length>=3){
      var last3 = curArr.slice(-3);
      var c3 = agg.g3[last3[0] + '|' + last3[1] + '|' + last3[2]] || {hu:0,long:0,ru:0,chu:0};
      var t3 = (c3.hu||0)+(c3.long||0)+(c3.ru||0)+(c3.chu||0);
      if (t3>=1) ['hu','long','ru','chu'].forEach(function(k){ score[k]+=(c3[k]||0)*6; });
    }
    // 4-gram
    if (curArr.length>=4){
      var last4 = curArr.slice(-4);
      var c4 = agg.g4[last4[0] + '|' + last4[1] + '|' + last4[2] + '|' + last4[3]] || {hu:0,long:0,ru:0,chu:0};
      var t4 = (c4.hu||0)+(c4.long||0)+(c4.ru||0)+(c4.chu||0);
      if (t4>=1) ['hu','long','ru','chu'].forEach(function(k){ score[k]+=(c4[k]||0)*8; });
    }
    // 冷热指数
    ['hu','long','ru','chu'].forEach(function(k){
      var lastIdx = -1;
      for(var i=curArr.length-1;i>=0;i--){ if(curArr[i]===k){ lastIdx=i; break; } }
      var gap = lastIdx === -1 ? curArr.length : (curArr.length - 1 - lastIdx);
      if (gap >= 3) score[k] += gap * 0.3;
    });
    // 物极必反
    if (curArr.length>=3){
      var last = curArr[curArr.length-1];
      var streak = 1;
      for(var i=curArr.length-2;i>=0;i--){ if(curArr[i]===last) streak++; else break; }
      if (streak >= 3){
        score[last] -= streak * 1;

  function predictMain(curArr, filtered){

      (top2 || []).forEach(function(k){ if (merged.indexOf(k) < 0) merged.push(k); });
      if (merged.length < 3 && sp.top3) sp.top3.forEach(function(k){ if (merged.indexOf(k) < 0) merged.push(k); });
      return { top: merged.slice(0,3), main: merged[0] };

  function backfillMarks(){
    var changed = false;
    state.groups.forEach(function(g){
      var L = (g.list || []).length;
      if (g.marks && g.marks.length === L && g.marks.indexOf(-1) < 0) return;
      var st = {hu:0,long:0,ru:0,chu:0};
      (g.list || []).forEach(function(x){ if (st[x] !== undefined) st[x]++; });
      var ks = Object.keys(st).sort(function(a,b){ return st[b]-st[a]; }).slice(0,3);
      var marks = [];
      for (var i=0; i<L; i++){
        marks.push(ks.indexOf(g.list[i]) >= 0 ? 1 : 0);
      }
      g.marks = marks;
      changed = true;
    });
    if (changed){ save(); render(); }

         activeTag = '';
         $('searchBox').value = el.dataset.n;
         sug.style.display = 'none'; sug.innerHTML = '';
         render();
       });
     });
   });
   // 点击别处收起搜索联想
   document.addEventListener('click', function(e){
     var sug = $('searchSuggest');
     var inp = $('searchBox');
     if (sug.style.display === 'block' && !sug.contains(e.target) && e.target !== inp){ sug.style.display = 'none'; }
   });

      var sgTimer = null;
    var _lastPicked = '';   // 最近一次点选的名字：点选后直接打字自动替换旧名
    function _dropOldName(inp){
      if (_lastPicked && inp.value.indexOf(_lastPicked) === 0 && inp.value.length > _lastPicked.length){
        inp.value = inp.value.slice(_lastPicked.length);
      }
      _lastPicked = '';
    }
    $('groupName').addEventListener('input', function(e){
      if (e.isComposing) return;
      _dropOldName(this);
      clearTimeout(sgTimer);
      sgTimer = setTimeout(function(){ renderLiveHint(); renderSuggest(); updateAIHint(); }, 500);
    });
    $('groupName').addEventListener('compositionend', function(){
      _dropOldName(this);
      clearTimeout(sgTimer);
      renderLiveHint(); renderSuggest(); updateAIHint();
    });
    // 失焦时记下当前单名字：下一次输入自动替换旧名（手打A用完换B也不粘）
    $('groupName').addEventListener('blur', function(){
      var v = this.value;
      if (v && v.indexOf(',') < 0) _lastPicked = v;
    });

  $('clearAllBtn').addEventListener('click', () => {
    if (!confirm('清空所有历史和当前记录？')) return;
    state.groups = [];
    state.current = [];
    save(); render();
  });

  // 云端分析面板：展开时计算一次，刷新按钮可重新拉云端重算
  var cloudRendered = false;
  function showCloudPanel(){
    var c = $('cloudContent');
    var show = c.style.display === 'none';
    c.style.display = show ? 'block' : 'none';
    $('toggleCloud').textContent = show ? '收起 ▼' : '展开 ▶';
    if (show) cloudAnalyze(c && c.innerHTML && c.innerHTML.indexOf('AI胜率预测') >= 0);
  }
  $('toggleCloud').addEventListener('click', showCloudPanel);
   // 云端分析面板的默认展开已移到 _boot（解锁后）执行
  $('cloudRefresh').addEventListener('click', function(){ cloudAnalyze(false); });

  // 导出备份
  $('exportBtn').addEventListener('click', () => {
    const SYM2CODE = { '虎':'hu', '龙':'long', '入':'ru', '出':'chu' };
    let lines = [];
    state.groups.forEach(g => {
      const chars = g.list.map(s => SYMBOLS[s]).join('');
      lines.push([g.name, g.time || '', chars].join('|'));
    });
    const text = lines.join('\n');
    navigator.clipboard.writeText(text).then(() => {
      alert('已复制到剪贴板，共' + state.groups.length + '组。\n\n把这段文字存到微信备忘录/记事本里，换设备时用"导入恢复"粘回来。');
    }).catch(() => {
      prompt('复制以下文字存好：', text);
    });
  });

  // 导入恢复
  $('importBtn').addEventListener('click', () => {
    const text = prompt('粘贴之前导出的备份文字：');
    if (!text || !text.trim()) return;
    const CODE2SYM = { hu:'虎', long:'龙', ru:'入', chu:'出' };
    const SYM2CODE = { '虎':'hu', '龙':'long', '入':'ru', '出':'chu' };
    const newGroups = [];
    text.trim().split('\n').forEach(line => {
      const parts = line.split('|');
      if (parts.length < 3) return;
      const name = parts[0];
      const time = parts[1];
      const chars = parts[2];
      const list = [];
      for (const ch of chars){
        if (SYM2CODE[ch]) list.push(SYM2CODE[ch]);
      }
      if (list.length) newGroups.push({ name, time, list });
    });
    if (!newGroups.length){ alert('没识别到有效数据'); return; }
    if (!confirm('将导入' + newGroups.length + '组，和现有数据合并。继续？')) return;
    state.groups = state.groups.concat(newGroups);
    state.groupNum = state.groups.length + 1;
    save(); render(); backfillMarks();
    alert('导入成功，共' + newGroups.length + '组');
  });

  // 键盘快捷键
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const k = e.key.toLowerCase();
    if (k === 'h' || k === 'j'){ pushSymbol('hu'); }
    else if (k === 'l'){ pushSymbol('long'); }
    else if (k === 'r'){ pushSymbol('ru'); }
    else if (k === 'c'){ pushSymbol('chu'); }
    else if (k === 'z'){ state.current.pop(); if (state.currentMarks && state.currentMarks.length) state.currentMarks.pop(); save(); render(); }
    else if (k === 'enter'){
      if (state.current.length){
        const now = new Date();
        const pad = n => String(n).padStart(2,'0');
        const timeStr = (now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
        state.groups.push({ name: currentName(), list: state.current.slice(), time: timeStr, marks: (state.currentMarks||[]).slice() });
        state.current = [];
        state.currentMarks = [];
        state.groupNum++;
        // 保留人名不清空
        save(); render(); backfillMarks();
      }
    }
  });

  function _boot(){
    // 第一步：界面骨架秒出（网格/组名栏/历史60组）
    renderGrid();
    renderNameBar();
    renderHistory();
    // 第二步：重活分批延迟（人名标签→提示/推荐→补对错），点进入不卡
    setTimeout(function(){ renderTags(); }, 60);
    setTimeout(function(){ renderLiveHint(); updateRecommend(); }, 150);
    setTimeout(function(){ backfillMarks(); }, 250);
    // 云端分析展开（解锁后600ms才计算）
    setTimeout(function(){ try{ var cc = $('cloudContent'); if (cc && cc.style.display === 'none') showCloudPanel(); }catch(e){} }, 600);
    // 自动云端去重（解锁后2.5s静默跑，重复不再积累；删除量大时后台分批进行不卡界面）
    setTimeout(function(){ try{ if (typeof window.cloudDedupe === 'function') window.cloudDedupe(true); }catch(e){} }, 2500);
  }
  if (__locked){ __unlockHooks.push(_boot); } else { _boot(); }

  // 实时时钟
  function tick(){
    const n = new Date();
    const pad = x => String(x).padStart(2,'0');
    var t = $('nowTime');
    if (t) t.textContent = (n.getMonth()+1) + '-' + pad(n.getDate()) + ' ' + pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
