<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>路单记牌器</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" type="image/png" href="./icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "STHeiti", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    background-attachment: fixed;
    color: #e2e8f0;
    min-height: 100vh; padding: 10px;
    max-width: 600px; margin: 0 auto;
  }

  .now-time {
    text-align: right; font-size: 14px; color: #fbbf24;
    font-weight: 700; margin-bottom: 8px; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 20px rgba(251,191,36,.3);
  }

  .section-title { font-size: 12px; color: #94a3b8; margin: 10px 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 6px; font-weight: 600; letter-spacing: 1px; }
  .section-title span:first-child { white-space: nowrap; }
  #searchBox {
    flex: 1; max-width: 180px; background: rgba(255,255,255,.08); border: 1px solid rgba(251,191,36,.3); color: #fbbf24;
    padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; outline: none;
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    backdrop-filter: blur(10px);
  }
  #searchBox::placeholder { color: #64748b; }

  .current {
    background: rgba(30, 41, 59, .6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(251,191,36,.15);
    border-radius: 16px; padding: 12px 14px; margin-bottom: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .group-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .group-name-row label { font-size: 13px; color: #94a3b8; white-space: nowrap; font-weight: 600; }
  #groupName {
    flex: 1; background: rgba(250, 245, 224, .95); border: 2px solid #b8a87a; color: #1a1a1a;
    padding: 8px 12px; border-radius: 10px; font-size: 17px; font-weight: 900; outline: none;
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    box-shadow: 0 4px 15px rgba(184,168,122,.2);
  }
  #groupName::placeholder { color: #b8a87a; font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 10px; }
  .cell {
    background: linear-gradient(180deg, #fef9e7 0%, #f5e9c8 100%);
    border: 1px solid #d4c59a;
    border-radius: 8px;
    box-shadow: 0 3px 0 #a89060, 0 6px 12px rgba(0,0,0,.2), inset 0 1px 0 #fff;
    aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 900; color: #1a1a1a; cursor: pointer; user-select: none;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    transition: transform .1s;
    position: relative;
  }
  .cell-mark {
    position: absolute; top: 2px; right: 2px;
    width: 17px; height: 17px; border-radius: 50%;
    color: #fff; font-size: 12px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.45); line-height: 1;
  }
  .cell-mark.ok { background: #22c55e; }
  .cell-mark.bad { background: #ef4444; }
  .cell:active { transform: scale(.95); }
  .cell.empty { color: #c5b98a; font-size: 14px; text-shadow: none; }
  .cell.last { box-shadow: 0 3px 0 #a89060, 0 0 0 3px #fbbf24, 0 0 20px rgba(251,191,36,.5); }
  .cell.hu   { color: #dc2626; text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 10px rgba(220,38,38,.2); }
  .cell.long { color: #2563eb; text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 10px rgba(37,99,235,.2); }
  .cell.ru   { color: #d97706; text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 10px rgba(217,119,6,.2); }
  .cell.chu  { color: #16a34a; text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 10px rgba(22,163,74,.2); }

  .pick-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .pbtn {
    padding: 15px 0; border-radius: 12px; border: 1px solid rgba(255,255,255,.1);
    font-size: 28px; font-weight: 900; cursor: pointer;
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    transition: all .15s;
    box-shadow: 0 4px 15px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .pbtn:active { transform: scale(0.95); }
  .pbtn-hu   { background: linear-gradient(180deg, #991b1b, #7f1d1d); color: #fecaca; }
  .pbtn-long { background: linear-gradient(180deg, #1e40af, #1e3a8a); color: #bfdbfe; }
  .pbtn-ru   { background: linear-gradient(180deg, #b45309, #854d0e); color: #fef08a; }
  .pbtn-chu  { background: linear-gradient(180deg, #15803d, #14532d); color: #bbf7d0; }

  .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .abtn {
    padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1);
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: all .15s;
    backdrop-filter: blur(10px);
  }
  .abtn:active { transform: scale(.97); }
  .abtn-undo { background: rgba(100,116,139,.3); color: #e2e8f0; }
  .abtn-done { background: linear-gradient(180deg, #059669, #047857); color: #d1fae5; }

  .history-item {
    background: rgba(30, 41, 59, .5);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 6px;
    box-shadow: 0 4px 15px rgba(0,0,0,.2);
  }
  .history-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .history-name { font-size: 17px; font-weight: 900; color: #fef3c7; font-family: "STHeiti", "Microsoft YaHei", sans-serif; }
  .history-count { font-size: 11px; color: #94a3b8; margin-left: 6px; font-weight: 400; }
  .history-del { background: none; border: none; color: #f87171; font-size: 12px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  .history-del:hover { background: rgba(248,113,113,.1); }
  .history-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
  .hcell {
    background: linear-gradient(180deg, #fef9e7 0%, #f5e9c8 100%);
    border: 1px solid #d4c59a;
    border-radius: 5px;
    box-shadow: 0 2px 0 #a89060;
    aspect-ratio: 1/1;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: #1a1a1a;
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    position: relative;
  }
  .hcell-mark {
    position: absolute; top: 0; right: 0;
    width: 12px; height: 12px; border-radius: 50%;
    color: #fff; font-size: 8px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .hcell-mark.ok { background: #22c55e; }
  .hcell-mark.bad { background: #ef4444; }
  .hcell.hu   { color: #dc2626; }
  .hcell.long { color: #2563eb; }
  .hcell.ru   { color: #d97706; }
  .hcell.chu  { color: #16a34a; }

  .empty-tip { color: #64748b; text-align: center; padding: 20px 0; font-size: 13px; }
  .clear-all {
    width: 100%; margin-top: 8px; padding: 10px;
    background: linear-gradient(180deg, #991b1b, #7f1d1d); color: #fecaca;
    border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 15px rgba(127,29,29,.3);
  }

  .tag {
    padding: 3px 8px; border-radius: 10px;
    background: #3a3a3a; color: #ccc;
    font-size: 11px; cursor: pointer; border: 1px solid #555;
    user-select: none;
  }
  .tag.active {
    background: #fbbf24; color: #1a1a1a; border-color: #fbbf24; font-weight: 700;
  }

  .mini-btn {
    padding: 3px 8px; border-radius: 10px; border: 1px solid #555;
    background: #3a3a3a; color: #aaa; font-size: 11px; cursor: pointer;
  }
  .mini-btn.on { background: #fbbf24; color: #1a1a1a; border-color: #fbbf24; font-weight: 700; }

  /* ===== 新增：每组画像徽章 & 胜率表 ===== */
  .dist-bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; margin: 3px 0; }
  .dist-hu { background: #dc2626; } .dist-long { background: #2563eb; } .dist-ru { background: #d97706; } .dist-chu { background: #16a34a; }
  .profile-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
  .profile-tag { background: rgba(168,85,247,.15); color: #d8b4fe; padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 600; }
  .rate-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 4px; }
  .rate-table th { background: rgba(251,191,36,.12); color: #fbbf24; padding: 5px 4px; font-weight: 700; text-align: left; }
  .rate-table td { padding: 5px 4px; border-top: 1px solid rgba(255,255,255,.06); vertical-align: middle; }
  .rate-table tr { cursor: pointer; }
  .rate-table tr:hover td { background: rgba(251,191,36,.05); }
  .rate-num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<!-- 密码锁 -->
<div id="lockScreen" style="position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e1b4b);z-index:9999;display:none;align-items:center;justify-content:center;">
  <div style="background:rgba(30,41,59,.8);backdrop-filter:blur(20px);border:1px solid rgba(251,191,36,.2);border-radius:16px;padding:30px;width:300px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);">
    <div style="font-size:24px;font-weight:900;color:#fbbf24;margin-bottom:20px;">路单记牌器</div>
    <input id="lockPwd" type="password" placeholder="请输入密码" style="width:100%;padding:12px;border-radius:10px;border:2px solid rgba(251,191,36,.3);background:rgba(255,255,255,.08);color:#fbbf24;font-size:18px;font-weight:700;text-align:center;outline:none;margin-bottom:12px;">
    <div id="lockMsg" style="color:#ef4444;font-size:12px;margin-bottom:10px;min-height:16px;"></div>
    <button id="lockBtn" style="width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(180deg,#d97706,#b45309);color:#fef08a;font-size:16px;font-weight:900;cursor:pointer;">进 入</button>
    <div style="font-size:11px;color:#64748b;margin-top:12px;" id="lockTip"></div>
  </div>
</div>
<div class="current">
  <div class="group-name-row">
    <label>组名</label>
    <input id="groupName" type="text" placeholder="点下面选，或自己打，多个名字用逗号隔开" maxlength="20">
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
    <span style="font-size:11px;color:#888;">快捷选名</span>
    <button id="toggleNameBar" style="padding:2px 8px;border-radius:8px;background:#3a3a3a;color:#aaa;font-size:11px;border:1px solid #555;cursor:pointer;">展开 ▶</button>
  </div>
  <div id="nameBar" style="display:none;flex-wrap:wrap;gap:4px;margin-bottom:10px;max-height:150px;overflow-y:auto;"></div>
  <div class="grid" id="grid"></div>
  <div class="pick-btns">
    <button class="pbtn pbtn-hu" data-s="hu">虎</button>
    <button class="pbtn pbtn-long" data-s="long">龙</button>
    <button class="pbtn pbtn-ru" data-s="ru">入</button>
    <button class="pbtn pbtn-chu" data-s="chu">出</button>
  </div>
  <div class="action-row">
    <button class="abtn abtn-undo" id="undoBtn">撤销</button>
    <button class="abtn abtn-done" id="doneBtn">完成本组并开新组</button>
  </div>
  <div id="liveHint" style="margin-top:8px;"></div>
</div>



<div class="section-title">
  <button id="toggleHistory" style="padding:2px 10px;border-radius:8px;background:rgba(251,191,36,.15);color:#fbbf24;font-size:12px;border:1px solid rgba(251,191,36,.3);cursor:pointer;font-weight:700;">历史组 ▶</button>
  <button id="toggleTags" style="padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.08);color:#94a3b8;font-size:11px;border:1px solid rgba(255,255,255,.1);cursor:pointer;">人名列表 ▶</button>
  <input id="searchBox" type="text" placeholder="搜组名...">
</div>
<div id="historyContent" style="display:none;">
<div id="tagBar" style="display:none;flex-wrap:wrap;gap:4px;margin-bottom:8px;max-height:180px;overflow-y:auto;"></div>
<div id="rateSection" style="margin-bottom:8px;">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <span style="font-size:12px;color:#fbbf24;font-weight:700;">各组画像 / 胜率表</span>
    <button id="toggleRate" style="padding:2px 8px;border-radius:8px;background:rgba(251,191,36,.15);color:#fbbf24;font-size:11px;border:1px solid rgba(251,191,36,.3);cursor:pointer;">展开 ▶</button>
  </div>
  <div id="rateContent" style="display:none;margin-top:4px;background:rgba(30,41,59,.5);border:1px solid rgba(168,85,247,.25);border-radius:10px;padding:8px;max-height:440px;overflow-y:auto;"></div>
</div>
<div id="historyList"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;">
  <button class="action-btn undo" id="exportBtn">导出备份</button>
  <button class="action-btn undo" id="importBtn">导入恢复</button>
</div>
<button class="clear-all" id="clearAllBtn">清空全部历史</button>
</div>

<script>
(function(){
  const PWD_KEY = 'road_pwd_v1';
  // 密码锁逻辑
  function checkLock(){
    var savedPwd = localStorage.getItem(PWD_KEY);
    var lock = document.getElementById('lockScreen');
    var pwdInput = document.getElementById('lockPwd');
    var msg = document.getElementById('lockMsg');
    var tip = document.getElementById('lockTip');
    if (!savedPwd){
      // 第一次使用，设置密码
      tip.textContent = '首次使用，请设置密码';
      document.getElementById('lockBtn').onclick = function(){
        var p1 = pwdInput.value.trim();
        if (p1.length < 4){ msg.textContent = '密码至少4位'; return; }
        localStorage.setItem(PWD_KEY, p1);
        lock.style.display = 'none';
      };
    } else {
      tip.textContent = '';
      document.getElementById('lockBtn').onclick = function(){
        if (pwdInput.value === savedPwd){
          lock.style.display = 'none';
        } else {
          msg.textContent = '密码错误';
        }
      };
    }
    pwdInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter') document.getElementById('lockBtn').click();
    });
    lock.style.display = 'flex';
  }
  checkLock();

  const STORE_KEY = 'road_groups_v2';
  const IMPORTED_FLAG = 'imported_v1';
  const SYMBOLS = { hu:'虎', long:'龙', ru:'入', chu:'出' };
  const NEXT = { hu:'long', long:'ru', ru:'chu', chu:null };
  const COLS = 6;

  // 折叠当前记录区的人名列表
  document.getElementById('toggleNameBar').addEventListener('click', function(){
    const bar = document.getElementById('nameBar');
    const show = bar.style.display === 'none';
    bar.style.display = show ? 'flex' : 'none';
    this.textContent = show ? '收起 ▼' : '展开 ▶';
  });

  // 折叠历史组的人名列表
  document.getElementById('toggleHistory').addEventListener('click', function(){
    var c = document.getElementById('historyContent');
    var b = document.getElementById('toggleHistory');
    if (c.style.display === 'none'){
      c.style.display = 'block';
      b.textContent = '历史组 ▼';
    } else {
      c.style.display = 'none';
      b.textContent = '历史组 ▶';
    }
  });

  document.getElementById('toggleTags').addEventListener('click', function(){
    const bar = document.getElementById('tagBar');
    const show = bar.style.display === 'none';
    bar.style.display = show ? 'flex' : 'none';
    this.textContent = show ? '人名列表 ▼' : '人名列表 ▶';
  });

  // ===== 从你Excel导入的历史数据 =====
  const INITIAL_GROUPS = [
    { name: '888', list: ['chu','ru','ru','long','chu','hu','hu','long','chu','chu','hu','chu'] },
    { name: '合兴', list: ['chu','hu','long','ru','long','chu','ru','chu','hu','ru','long','chu'] },
    { name: '牡丹', list: ['ru','hu','hu','ru','chu','hu','ru','chu','ru','ru','long','ru'] },
    { name: '牡丹', list: ['hu','ru','long','long','hu','ru','hu','ru','long','long','long','chu'] },
    { name: '牡丹', list: ['hu','hu','chu','long','ru','hu','long','long','hu','hu','hu','chu'] },
    { name: '牡丹', list: ['hu','ru','chu','ru','chu','ru','hu','chu','chu','hu','chu','long'] },
    { name: '义不容辞', list: ['long','chu','ru','ru','hu','hu','long','chu','hu','ru','chu','ru','hu'] },
    { name: '义不容辞', list: ['long','ru','ru','ru','chu','ru','ru','hu','ru','hu','hu','long'] },
    { name: '依依', list: ['hu','long','ru','ru','hu','chu','chu','chu','long','ru','long','hu'] },
    { name: '依依', list: ['hu','chu','ru','ru','ru','long','hu','hu','chu','chu','ru','chu'] },
    { name: '@', list: ['ru','long','ru','hu','long','long','long','ru','ru','long','hu','hu'] },
    { name: '必胜', list: ['chu','hu','chu','ru','ru','long','hu','chu','chu','hu','hu','long'] },
    { name: '发发朋友圈', list: ['hu','chu','hu','long','hu','hu','ru','long','long','long','ru','chu'] },
    { name: '123', list: ['chu','hu','long','ru','long','chu','long','chu','hu','chu','hu','chu'] },
    { name: '123', list: ['long','ru','hu','hu','hu','chu','ru','hu','long','chu','chu','chu'] },
    { name: '123', list: ['ru','long','long','chu','long','hu','ru','chu','chu','long','ru','ru'] },
    { name: '95公分', list: ['long','hu','chu','long','hu','chu','chu','ru','hu','chu','ru','chu'] },
    { name: '95公分', list: ['ru','chu','ru','hu','hu','chu','long','chu','hu','hu','long','ru'] },
    { name: '多彩多亿', list: ['ru','chu','ru','ru','chu','chu','chu','chu','ru','ru','long','ru'] },
    { name: '可乐', list: ['hu','hu','chu','long','hu','chu','ru','long'] },
    { name: '可乐', list: ['chu','chu','hu','chu','long','chu','ru','chu','long','long','chu','long'] },
  ];

  // ===== GitHub 云同步（手机电脑任意网络共用一份数据，不再依赖本机服务） =====
  var GH_USER = '386585691-fzq';
  var GH_REPO = 'muxiaofei';
  var GH_FILE = 'road_groups_data.json';
  var GH_TOKEN = localStorage.getItem('road_gh_token') || '';
  var CLOUD = !!GH_TOKEN; // 配置了钥匙才云同步
  var cloudTimer = null;
  var ghSha = null; // 云端文件版本号

  // UTF-8 <-> base64（GitHub contents API 需要）
  function b64Encode(str){
    try { return btoa(unescape(encodeURIComponent(str))); } catch(e){ return btoa(String.fromCharCode.apply(null, new TextEncoder().encode(str))); }
  }
  function b64Decode(b64){
    try { return decodeURIComponent(escape(atob(b64))); } catch(e){ return new TextDecoder().decode(Uint8Array.from(atob(b64), function(c){ return c.charCodeAt(0); })); }
  }
  // 合并去重：按 人名+牌路 合并两份数据，谁的数据都不丢
  function mergeGroups(a, b){
    var seen = {}; var out = [];
    (a || []).concat(b || []).forEach(function(g){
      if (!g) return;
      var k = (g.name || '') + '|' + JSON.stringify(g.list || []);
      if (!seen[k]) { seen[k] = 1; out.push(g); }
    });
    return out;
  }
  function ghGet(){
    return fetch('https://api.github.com/repos/' + GH_USER + '/' + GH_REPO + '/contents/' + GH_FILE, {
      headers: { 'Authorization': 'Bearer ' + GH_TOKEN, 'Accept': 'application/vnd.github.v3+json' }
    }).then(function(r){
      if (r.status === 404) return null; // 云端还没有文件
      if (!r.ok) throw new Error('gh get ' + r.status);
      return r.json();
    });
  }
  function ghPut(content, sha){
    return fetch('https://api.github.com/repos/' + GH_USER + '/' + GH_REPO + '/contents/' + GH_FILE, {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + GH_TOKEN, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
      body: JSON.stringify({ message: '记牌器同步', content: b64Encode(content), sha: sha || undefined })
    }).then(function(r){ if (!r.ok) throw new Error('gh put ' + r.status); return r.json(); });
  }

  function load(){
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const o = JSON.parse(raw);
        return {
          groups: o.groups || [],
          current: o.current || [],
          gameName: o.gameName || '路单',
          groupNum: o.groupNum || 1,
          updatedAt: o.updatedAt || 0
        };
      }
    } catch(e){}
    return { groups: [], current: [], gameName: '路单', groupNum: 1, updatedAt: 0 };
  }
  function save(){
    state.updatedAt = Date.now();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
    pushCloud();
  }
  // 本地落盘（拉云端后使用，不触发推送）

      ghGet().then(function(meta){

        if (meta && meta.content){
          try { remote = JSON.parse(b64Decode(meta.content)); } catch(e){}

        if (remote && remote.groups && remote.groups.length){
          state.groups = mergeGroups(remote.groups, state.groups);
          state.groupNum = state.groups.length + 1;
          state.updatedAt = Math.max(state.updatedAt || 0, remote.updatedAt || 0);
        }
        ghSha = (meta && meta.sha) || ghSha;

  // ===== 统计学习AI大脑（第二信号源）：马尔可夫转移 + 条件概率 + 位置分布 =====
  function statBrain(curArr, filtered){
    var KEYS = ['hu','long','ru','chu'];
    var s = {hu:0,long:0,ru:0,chu:0};
    if (!filtered.length) return s;
    // 全局字符频率（用作平滑先验，避免样本少时零概率）
    var prior = {hu:0,long:0,ru:0,chu:0}, priorT = 0;
    filtered.forEach(function(g){ g.list.forEach(function(x){ prior[x]++; priorT++; }); });
    // 一阶马尔可夫：P(下一手 | 当前最后一手)，拉普拉斯平滑 + 先验混合
    if (curArr.length >= 1){
      var last = curArr[curArr.length-1];
      var tr = {hu:0,long:0,ru:0,chu:0}, trT = 0;
      filtered.forEach(function(g){
        for (var i=0;i<g.list.length-1;i++){
          if (g.list[i] === last){ tr[g.list[i+1]]++; trT++; }
        }
      });
      var a1 = 2;
      KEYS.forEach(function(k){
        s[k] += (tr[k] + a1*(prior[k]+1)/(priorT+4)) / (trT + a1);
      });
    }
    // 二阶马尔可夫：P(下一手 | 最近两手)，权重加倍
    if (curArr.length >= 2){
      var last2 = curArr.slice(-2);
      var tr2 = {hu:0,long:0,ru:0,chu:0}, tr2T = 0;
      filtered.forEach(function(g){
        for (var i=0;i<g.list.length-2;i++){
          if (g.list[i]===last2[0] && g.list[i+1]===last2[1]){ tr2[g.list[i+2]]++; tr2T++; }
        }
      });
      var a2 = 1.5;
      KEYS.forEach(function(k){
        s[k] += 2 * (tr2[k] + a2*(prior[k]+1)/(priorT+4)) / (tr2T + a2);
      });
    }
    // 位置分布：当前第 N 手位置上，历史上各符号出现频率
    var pos = curArr.length;
    var pc = {hu:0,long:0,ru:0,chu:0}, pcT = 0;
    filtered.forEach(function(g){ if (g.list.length > pos){ pc[g.list[pos]]++; pcT++; } });
    if (pcT > 0){
      KEYS.forEach(function(k){ s[k] += (pc[k] + 0.5) / (pcT + 2); });
    }
    return s;
  }

  function predictTop2(curArr, filtered){
    if (!filtered.length) return []; // 只学这个人，没数据不瞎猜
    var score = {hu:0, long:0, ru:0, chu:0};
    var now = new Date().getTime();
    function parseT(g){
      if (!g.time) return now - 7*24*3600*1000;
      var parts = g.time.split(' ');
      var d = parts[0].split('-');
      var y = 2026, mo = parseInt(d[0])-1, da = parseInt(d[1]);
      var h=0, mi=0;
      if (parts[1]){ var hm=parts[1].split(':'); h=parseInt(hm[0]); mi=parseInt(hm[1]); }
      return new Date(y,mo,da,h,mi).getTime();
    }
    var times = filtered.map(parseT);
    var maxT = Math.max.apply(null, times);
    // 时间加权（增强版）：越新的组权重越高；老数据快速衰减，避免淹没新习惯
    function w(i){
      var diffH = (maxT - times[i]) / 3600000;
      if (diffH <= 12) return 2.4 - (diffH/12)*0.8;      // 12小时内 2.4 → 1.6
      if (diffH <= 48) return 1.6 - (diffH-12)/60;        // 12-48小时 1.6 → 1.0
      return Math.max(0.12, 1.0 - (diffH-48)/100);        // 48小时后快速衰减，下限0.12
    }
    // 组内位置加权：同一条路单里越靠后的手数（越接近当前状态）权重越高
    function posW(g, pos){
      var L = g.list.length;
      if (L <= 1 || pos <= 0) return 1;
      if (pos >= L-1) return 1.5;
      return 1 + 0.5 * pos / (L-1);
    }
    function wg(g, gi, pos){ return w(gi) * posW(g, pos); }
    // 前缀匹配
    var pC = {hu:0,long:0,ru:0,chu:0};
    filtered.forEach(function(g, gi){
      var ok = true;
      for (var i=0;i<curArr.length;i++){ if(g.list[i]!==curArr[i]){ok=false;break;} }
      if (ok && g.list.length>curArr.length) pC[g.list[curArr.length]] += wg(g, gi, curArr.length);
    });
    var pT = pC.hu+pC.long+pC.ru+pC.chu;
    if (pT>=1) ['hu','long','ru','chu'].forEach(function(k){ score[k]+=pC[k]*3; });
    // 上一手（1-gram）
    if (curArr.length>=1){
      var last1 = curArr[curArr.length-1];
      var c1 = {hu:0,long:0,ru:0,chu:0};
      filtered.forEach(function(g, gi){ for(var i=0;i<g.list.length-1;i++){ if(g.list[i]===last1) c1[g.list[i+1]] += wg(g, gi, i+1); } });
      ['hu','long','ru','chu'].forEach(function(k){ score[k]+=c1[k]*1.5; });
    }
    // 位置统计
    var pos = curArr.length;
    filtered.forEach(function(g, gi){ if(g.list.length>pos) score[g.list[pos]] += wg(g, gi, pos); });
    // 连出2个后规律
    if (curArr.length>=2 && curArr[curArr.length-1]===curArr[curArr.length-2]){
      var last = curArr[curArr.length-1];
      var cont = 0, rev = {hu:0,long:0,ru:0,chu:0}, revT = 0;
      filtered.forEach(function(g, gi){
        for (var i=1;i<g.list.length-1;i++){
          if (g.list[i]===last && g.list[i-1]===last){
            if (g.list[i+1]===last) cont += wg(g, gi, i+1);
            else { rev[g.list[i+1]] += wg(g, gi, i+1); revT += wg(g, gi, i+1); }
          }
        }
      });
      if (cont + revT > 0){
        if (cont >= revT) score[last] += cont * 2;
        else ['hu','long','ru','chu'].forEach(function(k){ if(k!==last) score[k] += rev[k] * 2; });
      } else {
        ['hu','long','ru','chu'].forEach(function(k){ if(k!==last) score[k]+=0.5; });
      }
    }
    // 2-gram
    if (curArr.length>=2){
      var last2 = curArr.slice(-2);
      var c2 = {hu:0,long:0,ru:0,chu:0};
      filtered.forEach(function(g, gi){
        for(var i=0;i<g.list.length-2;i++){
          if(g.list[i]===last2[0] && g.list[i+1]===last2[1]) c2[g.list[i+2]] += wg(g, gi, i+2);
        }
      });
      var t2 = c2.hu+c2.long+c2.ru+c2.chu;
      if (t2>=1) ['hu','long','ru','chu'].forEach(function(k){ score[k]+=c2[k]*4; });
    }
    // 3-gram
    if (curArr.length>=3){
      var last3 = curArr.slice(-3);
      var c3 = {hu:0,long:0,ru:0,chu:0};
      filtered.forEach(function(g, gi){
        for(var i=0;i<g.list.length-3;i++){
          if(g.list[i]===last3[0] && g.list[i+1]===last3[1] && g.list[i+2]===last3[2]) c3[g.list[i+3]] += wg(g, gi, i+3);
        }
      });
      var t3 = c3.hu+c3.long+c3.ru+c3.chu;
      if (t3>=1) ['hu','long','ru','chu'].forEach(function(k){ score[k]+=c3[k]*6; });
    }
    // 4-gram
    if (curArr.length>=4){
      var last4 = curArr.slice(-4);
      var c4 = {hu:0,long:0,ru:0,chu:0};
      filtered.forEach(function(g, gi){
        for(var i=0;i<g.list.length-4;i++){
          if(g.list[i]===last4[0] && g.list[i+1]===last4[1] && g.list[i+2]===last4[2] && g.list[i+3]===last4[3]) c4[g.list[i+4]] += wg(g, gi, i+4);
        }
      });
      var t4 = c4.hu+c4.long+c4.ru+c4.chu;
      if (t4>=1) ['hu','long','ru','chu'].forEach(function(k){ score[k]+=c4[k]*8; });
    }
    // 冷热指数
    ['hu','long','ru','chu'].forEach(function(k){
      var lastIdx = -1;
      for(var i=curArr.length-1;i>=0;i--){ if(curArr[i]===k){ lastIdx=i; break; } }
      var gap = lastIdx === -1 ? curArr.length : (curArr.length - 1 - lastIdx);
      if (gap >= 3) score[k] += gap * 0.3;
    });
    // 物极必反
    if (curArr.length>=3){
      var last = curArr[curArr.length-1];
      var streak = 1;
      for(var i=curArr.length-2;i>=0;i--){ if(curArr[i]===last) streak++; else break; }
      if (streak >= 3){
        score[last] -= streak * 1;
        ['hu','long','ru','chu'].forEach(function(k){ if(k!==last) score[k] += streak * 0.5; });
      }
    }
    // 交替模式
    if (curArr.length>=3 && curArr[curArr.length-1]!==curArr[curArr.length-2] && curArr[curArr.length-2]===curArr[curArr.length-3]){
      var next = curArr[curArr.length-2];
      score[next] += 1.5;
    }
    // 连出3个后规律
    if (curArr.length>=3 && curArr[curArr.length-1]===curArr[curArr.length-2] && curArr[curArr.length-2]===curArr[curArr.length-3]){
      var last3s = curArr[curArr.length-1];
      var cont3 = 0, rev3 = {hu:0,long:0,ru:0,chu:0}, rev3T = 0;
      filtered.forEach(function(g, gi){
        for (var i=2;i<g.list.length-1;i++){
          if (g.list[i]===last3s && g.list[i-1]===last3s && g.list[i-2]===last3s){
            if (g.list[i+1]===last3s) cont3 += wg(g, gi, i+1);
            else { rev3[g.list[i+1]] += wg(g, gi, i+1); rev3T += wg(g, gi, i+1); }
          }
        }
      });
      if (cont3 + rev3T > 0){
        if (cont3 >= rev3T) score[last3s] += cont3 * 1.5;
        else ['hu','long','ru','chu'].forEach(function(k){ if(k!==last3s) score[k] += rev3[k] * 1.5; });
      }
    }
    // 全局频率
    var cG = {hu:0,long:0,ru:0,chu:0};
    filtered.forEach(function(g, gi){ g.list.forEach(function(s, idx){cG[s]+=wg(g, gi, idx);}); });
    var tG = cG.hu+cG.long+cG.ru+cG.chu;
    if (tG>0) ['hu','long','ru','chu'].forEach(function(k){ score[k]+=cG[k]/tG*2; });
    // 统计学习AI大脑融合（主导信号）：马尔可夫+条件概率+位置分布归一化后加权
    var sb = statBrain(curArr, filtered);
    var sbT = sb.hu + sb.long + sb.ru + sb.chu;
    if (sbT > 0){
      ['hu','long','ru','chu'].forEach(function(k){ score[k] += sb[k] / sbT * 6; });
    }
    // 自学习自信调制（learnAdj 真实参与预测）：
    // 最近常对 → learnAdj>1 → 放大第一名领先优势（更坚定）
    // 最近常错 → learnAdj<1 → 拉平候选差距（更保守）
    var adj = state.learnAdj || 1.0;
    if (adj !== 1.0){
      var maxKey = 'hu', maxV = score.hu;
      ['long','ru','chu'].forEach(function(k){ if(score[k]>maxV){maxV=score[k];maxKey=k;} });
      ['hu','long','ru','chu'].forEach(function(k){
        if (k !== maxKey) score[k] += (maxV - score[k]) * (1 - adj);
      });
    }
    return Object.keys(score).sort(function(a,b){return score[b]-score[a];}).slice(0,3);
  }
  function renderLiveHint(){

    const yestStr = (yest.getMonth()+1) + '-' + pad(yest.getDate());

    let html = `<div style="background:#2b2b2b;border-radius:6px;padding:8px 10px;font-size:12px;color:#ccc;">

    // 智能预测：直接调用predictTop2，和点牌判断完全一致

    if (sorted.length){
      var curStr = cur.map(function(k){ return {hu:'虎',long:'龙',ru:'入',chu:'出'}[k]; }).join('');

      function cell(k, rank){

        return '<div style="padding:6px 0;border-radius:4px;text-align:center;background:'+bg+';color:'+fg+';'+sh+'">'
          + '<div style="font-size:18px;font-weight:900;line-height:1.1;">'+m[0]+'</div>'
          + '</div>';
      }
      var nowSec = new Date().toLocaleTimeString();
      var adjTxt = '· 学习加权×' + (state.learnAdj||1.0).toFixed(2) + (state.learnAdj >= 1 ? ' 越用越准' : ' 状态谨慎');
      html += '<div style="background:linear-gradient(135deg,#1a0a2e,#0f172a);border:1px solid #a855f7;border-radius:6px;padding:5px 6px;margin-bottom:6px;">'
        + '<div style="font-size:11px;color:#c084fc;font-weight:700;margin-bottom:3px;">'+prefixLabel+' <span style="font-size:10px;color:#888;font-weight:400;">准确率'+(state.accuracy.total?Math.round(state.accuracy.correct/state.accuracy.total*100):0)+'% ('+state.accuracy.correct+'/'+state.accuracy.total+') · 学了'+filtered.length+'组</span><span style="font-size:10px;color:#a78bfa;font-weight:600;">'+adjTxt+'</span> <span style="font-size:10px;color:#888;font-weight:400;">['+nowSec+']</span></div>'
      var sb2 = statBrain(cur, filtered);
      var sbT2 = sb2.hu + sb2.long + sb2.ru + sb2.chu;
      if (sbT2 > 0){
        var pctOf = function(k){ return Math.round(sb2[k]/sbT2*100); };
        var bestK = 'hu', bestV = sb2.hu;
        ['long','ru','chu'].forEach(function(k){ if (sb2[k]>bestV){bestV=sb2[k];bestK=k;} });
        html += '<div style="font-size:10px;color:#93c5fd;font-weight:600;margin:3px 0;">统计AI大脑：虎'+pctOf('hu')+'% 龙'+pctOf('long')+'% 入'+pctOf('ru')+'% 出'+pctOf('chu')+'% · 主推【'+{hu:'虎',long:'龙',ru:'入',chu:'出'}[bestK]+'】</div>';

    }
    // 人物习惯画像（AI自动学习总结）
    var totalAll = hu+long+ru+chu;
    if (totalAll > 10){
      var habits = [];
      // 1. 最爱出什么
      var freq = {hu:hu, long:long, ru:ru, chu:chu};
      var topChar = 'hu', topFreq = hu;
      ['hu','long','ru','chu'].forEach(function(k){ if(freq[k]>topFreq){topFreq=freq[k];topChar=k;} });
      var SYM_NAME = {hu:'虎',long:'龙',ru:'入',chu:'出'};
      habits.push('最爱走「'+SYM_NAME[topChar]+'」('+Math.round(topFreq/totalAll*100)+'%)');

      filtered.forEach(function(g){
        for(var i=1;i<g.list.length;i++){
          if(g.list[i]===g.list[i-1]) cont2++;
          else rev2++;
        }
      });
      var contPct = Math.round(cont2/(cont2+rev2)*100);
      if (contPct > 60) habits.push('喜欢连出('+contPct+'%延续)');
      else if (contPct < 40) habits.push('喜欢反转('+(100-contPct)+'%变向)');
      else habits.push('连出反转差不多('+contPct+'%延续)');
      // 3. 交替模式
      var alt = 0, altTotal = 0;
      filtered.forEach(function(g){
        for(var i=2;i<g.list.length;i++){
          altTotal++;
          if(g.list[i]!==g.list[i-1] && g.list[i-1]===g.list[i-2]) alt++;
        }
      });
      if (altTotal > 5 && alt/altTotal > 0.4) habits.push('爱走交替路');
      // 4. 物极必反：连出3个后反转概率
      var after3cont = 0, after3rev = 0;
      filtered.forEach(function(g){
        for(var i=3;i<g.list.length;i++){
          if(g.list[i-1]===g.list[i-2] && g.list[i-2]===g.list[i-3]){
            if(g.list[i]===g.list[i-1]) after3cont++;
            else after3rev++;
          }
        }
      });
      if (after3cont+after3rev > 0){
        var revPct = Math.round(after3rev/(after3cont+after3rev)*100);
        if (revPct > 60) habits.push('连3个后爱反('+revPct+'%)');
        else habits.push('连3个后常续('+(100-revPct)+'%)');
      }
      // 5. 冷热：龙出完爱出什么
      var afterLong = {hu:0,long:0,ru:0,chu:0}, afterLongT = 0;
      filtered.forEach(function(g){
        for(var i=0;i<g.list.length-1;i++){
          if(g.list[i]==='long'){ afterLong[g.list[i+1]]++; afterLongT++; }
        }
      });
      if (afterLongT > 3){
        var topAfterLong = 'hu', topV = afterLong.hu;
        ['hu','long','ru','chu'].forEach(function(k){ if(afterLong[k]>topV){topV=afterLong[k];topAfterLong=k;} });
        habits.push('龙后爱接「'+SYM_NAME[topAfterLong]+'」');
      }
      html += '<div style="background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.2);border-radius:8px;padding:8px 10px;margin-bottom:6px;">'
        + '<div style="font-size:11px;color:#c084fc;font-weight:700;margin-bottom:5px;">AI人物画像 · '+filtered.length+'组数据学习</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:4px;">'
        + habits.map(function(h){ return '<span style="background:rgba(168,85,247,.15);color:#d8b4fe;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600;">'+h+'</span>'; }).join('')
        + '</div></div>';
    }
    const matches = filtered;
    function prefixScore(g){
      if (!cur.length) return 0;
      let n = 0;
      for (let i=0; i<Math.min(cur.length, g.list.length); i++){
        if (g.list[i] === cur[i]) n++; else break;
      }
      return n;
    }
    matches.sort((a,b) => {
      var sa = prefixScore(a), sb = prefixScore(b);
      if (sa !== sb) return sb - sa;
      // 相同匹配度，时间最新的排前面
      var ta = a.time || '', tb = b.time || '';
      return tb > ta ? 1 : (tb < ta ? -1 : 0);
    });
    // 每组单独一块，最新在上，用麻将牌格子显示
    for (let i = 0; i < matches.length; i++){
      const g = matches[i];
      const rows = Math.ceil(g.list.length / COLS);
      const score = prefixScore(g);
      const isMatch = cur.length && score >= cur.length;
      let gridHtml = '';
      for (let r = 0; r < rows; r++){
        const startNum = r*COLS + 1;
        const endNum = Math.min((r+1)*COLS, g.list.length);
        gridHtml += `<div style="display:grid;grid-template-columns:20px repeat(6,1fr) 20px;gap:2px;align-items:center;margin-bottom:2px;">
          <span style="font-size:10px;color:#888;text-align:center;">${startNum}</span>`;
        for (let c = 0; c < COLS; c++){
          const idx = r*COLS + c;
          if (idx < g.list.length){
            const s = g.list[idx];
            const gm = (g.marks || [])[idx];
            const gmHtml = (gm === 1 || gm === 0) ? `<span class="hcell-mark ${gm?'ok':'bad'}" style="width:9px;height:9px;font-size:6px;">${gm?'✓':'×'}</span>` : '';
            gridHtml += `<div class="hcell ${s}" style="font-size:14px;">${SYMBOLS[s]}${gmHtml}</div>`;
          } else {
            gridHtml += `<div style="aspect-ratio:1/1;"></div>`;
          }
        }
        gridHtml += `<span style="font-size:10px;color:#888;text-align:center;">${endNum}</span></div>`;
      }
      html += `<div style="border-top:1px solid ${isMatch?'#4ade80':'#444'};padding-top:4px;margin-top:4px;${isMatch?'background:#1a3a2a;border-radius:6px;padding:6px 8px;':''}">
        <div style="color:#888;font-size:11px;margin-bottom:2px;">${g.time || ''}${isMatch?' <span style="color:#4ade80;font-weight:700;">✓ 同走势</span>':''}</div>
        ${gridHtml}
      </div>`;
    }
    html += '</div>';
    box.innerHTML = html;
    bindMiniBtns();
  }

  // ===== 新增：每组画像 =====
  function groupProfile(g){
    var c = {hu:0,long:0,ru:0,chu:0};
    g.list.forEach(function(s){ c[s]++; });
    var total = g.list.length;
    var top = 'hu', topV = c.hu;
    ['long','ru','chu'].forEach(function(k){ if(c[k]>topV){topV=c[k];top=k;} });
    var tags = [];
    if (total > 0) tags.push('主' + SYMBOLS[top] + Math.round(topV/total*100) + '%');
    var cont2 = 0, rev2 = 0;
    for (var i=1;i<total;i++){ if(g.list[i]===g.list[i-1]) cont2++; else rev2++; }
    if (cont2+rev2 > 0){
      var cp = Math.round(cont2/(cont2+rev2)*100);
      tags.push(cp>=60 ? '连出'+cp+'%' : (cp<=40 ? '爱反转'+(100-cp)+'%' : '连反均'+cp+'%'));
    }
    var a3c = 0, a3r = 0;
    for (var i=3;i<total;i++){
      if (g.list[i-1]===g.list[i-2] && g.list[i-2]===g.list[i-3]){
        if (g.list[i]===g.list[i-1]) a3c++; else a3r++;
      }
    }
    if (a3c+a3r >= 2) tags.push('3连反' + Math.round(a3r/(a3c+a3r)*100) + '%');
    return {c:c, total:total, top:top, topPct: total?Math.round(topV/total*100):0, tags:tags};
  }

  // ===== 新增：人名胜率（留一手验证：只学该人其他组，逐手预测本组） =====
  function personRate(name){
    var groups = state.groups.filter(function(g){ return g.name === name; });
    if (!groups.length) return null;
    var hit = 0, total = 0;
    groups.forEach(function(g, gi){
      var others = groups.filter(function(_, j){ return j !== gi; });
      if (!others.length) return;
      var cur = [];
      for (var i=0;i<g.list.length;i++){
        var sorted = predictTop2(cur, others);
        if (sorted.length){ total++; if (sorted.indexOf(g.list[i]) >= 0) hit++; }
        cur.push(g.list[i]);
      }
    });
    return { hit: hit, total: total, rate: total ? Math.round(hit/total*100) : 0 };
  }

  // ===== 新增：渲染胜率表 =====
  function renderRate(){
    var box = $('rateContent');
    var names = [];
    state.groups.forEach(function(g){ if (names.indexOf(g.name) < 0) names.push(g.name); });
    var rows = names.map(function(n){
      var gs = state.groups.filter(function(g){ return g.name === n; });
      var c = {hu:0,long:0,ru:0,chu:0};
      gs.forEach(function(g){ g.list.forEach(function(s){ c[s]++; }); });
      var hands = gs.reduce(function(a,g){ return a + g.list.length; }, 0);
      var top = 'hu', tv = c.hu;
      ['long','ru','chu'].forEach(function(k){ if(c[k]>tv){tv=c[k];top=k;} });
      var rate = personRate(n);
      return { name:n, groups:gs.length, hands:hands, c:c, top:top, topPct: hands?Math.round(tv/hands*100):0, rate:rate };
    });
    rows.sort(function(a,b){ return (b.rate?b.rate.rate:0) - (a.rate?a.rate.rate:0) || b.hands - a.hands; }); // 按AI胜率降序，同胜率按手数
    var html = '<table class="rate-table"><tr><th>人名</th><th>组数</th><th>手数</th><th style="width:110px;">虎/龙/入/出 占比</th><th>主力路</th><th>AI胜率</th></tr>';
    rows.forEach(function(r){
      var pct = function(k){ return r.hands ? Math.round(r.c[k]/r.hands*100) : 0; };
      var huP = pct('hu'), loP = pct('long'), ruP = pct('ru'), chP = pct('chu');
      var dist = '<div class="dist-bar"><span class="dist-hu" style="width:'+huP+'%"></span><span class="dist-long" style="width:'+loP+'%"></span><span class="dist-ru" style="width:'+ruP+'%"></span><span class="dist-chu" style="width:'+chP+'%"></span></div>'
        + '<div style="font-size:9px;color:#94a3b8;">虎'+huP+' 龙'+loP+' 入'+ruP+' 出'+chP+'</div>';
      var rateTxt = r.rate ? '<span style="color:'+(r.rate.rate>=50?'#4ade80':'#f87171')+';font-weight:700;">'+r.rate.rate+'%</span> <span style="font-size:9px;color:#64748b;">('+r.rate.hit+'/'+r.rate.total+')</span>' : '<span style="color:#64748b;">-</span>';
      html += '<tr data-name="'+escapeHtml(r.name)+'">'
        + '<td style="color:#fef3c7;font-weight:700;">'+escapeHtml(r.name)+'</td>'
        + '<td>'+r.groups+'</td><td>'+r.hands+'</td><td>'+dist+'</td>'
        + '<td style="color:#fbbf24;font-weight:700;">'+SYMBOLS[r.top]+r.topPct+'%</td>'
        + '<td class="rate-num">'+rateTxt+'</td></tr>';
    });
    html += '</table>'
      + '<div style="font-size:10px;color:#64748b;margin-top:6px;">AI胜率 = 只学该人其他组、逐手预测本组下一手的命中率（留一手验证，不偷看本组）。点击某行可只看该人。</div>';
    box.innerHTML = html;
    box.querySelectorAll('tr[data-name]').forEach(function(tr){
      tr.addEventListener('click', function(){
        activeTag = tr.dataset.name;
        searchQuery = '';
        $('searchBox').value = '';
        $('rateContent').style.display = 'none';
        $('toggleRate').textContent = '展开 ▶';
        render();
      });
    });
  }

  function render(){
    renderGrid();
    renderNameBar();
    renderTags();
    renderLiveHint();
    renderHistory();
  }

  // 公共：记录一手牌（点按钮或键盘），同时把AI预测对错记到 currentMarks
  function pushSymbol(s){
    var filtered = getFiltered();
    var top3 = predictTop2(state.current, filtered);
    var mark = -1;
    if (top3.length){
      state.accuracy.total++;
      var hit = top3.indexOf(s) >= 0;
      if (hit) state.accuracy.correct++;
      mark = hit ? 1 : 0;
      state.predictHistory.push(hit ? 1 : 0);
      if (state.predictHistory.length > 12) state.predictHistory.shift();
      // 自学习：对了稍微提高学习系数，错了稍微降低，范围0.7~1.3
      if (hit) state.learnAdj = Math.min(1.3, (state.learnAdj||1.0) * 1.02);
      else state.learnAdj = Math.max(0.7, (state.learnAdj||1.0) * 0.98);
    }
    state.current.push(s);
    if (!state.currentMarks) state.currentMarks = [];
    state.currentMarks.push(mark);
    save(); render();
  }

  // 补记：给没有对错记录的旧组，用当前AI模型逐手复盘补算（留一手：用前i手预测第i手，不偷看答案）
  function backfillMarks(){
    if (state._backfilled) return;
    state._backfilled = true;
    var changed = false;
    state.groups.forEach(function(g){
      if (g.marks && g.marks.length >= g.list.length) return;
      var marks = [];
      for (var i=0; i<g.list.length; i++){
        if (i === 0){ marks.push(-1); continue; } // 第一手无前缀无法预测
        var prefix = g.list.slice(0, i);
        var filtered = state.groups.filter(function(x){ return x.name === g.name && x !== g; });
        if (!filtered.length) filtered = state.groups.filter(function(x){ return x !== g; }); // 无同名人历史时用全局
        var top3 = predictTop2(prefix, filtered);
        if (!top3.length){ marks.push(-1); continue; }
        marks.push(top3.indexOf(g.list[i]) >= 0 ? 1 : 0);
      }
      g.marks = marks;
      changed = true;
    });
    if (changed){ save(); render(); }
  }

  document.querySelectorAll('.pbtn').forEach(b => {
    b.addEventListener('click', () => {
      pushSymbol(b.dataset.s);
    });
  });


  $('undoBtn').addEventListener('click', () => {
    state.current.pop();
    if (state.currentMarks && state.currentMarks.length) state.currentMarks.pop();
    save(); render();
  });

  $('doneBtn').addEventListener('click', () => {
    if (!state.current.length){ alert('当前组还没填任何字'); return; }
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const timeStr = (now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
    state.groups.push({ name: currentName(), list: state.current.slice(), time: timeStr, marks: (state.currentMarks||[]).slice() });
    state.current = [];
    state.currentMarks = [];
    state.groupNum++;
    // 保留人名不清空，方便连续记录同一个人
    save(); render();
  });

  $('searchBox').addEventListener('input', e => {
    searchQuery = e.target.value;
    activeTag = '';
    render();
  });

  $('groupName').addEventListener('input', () => {
    renderLiveHint();
  });

  $('clearAllBtn').addEventListener('click', () => {
    if (!confirm('清空所有历史和当前记录？')) return;
    state.groups = [];
    state.current = [];
    save(); render();
  });

  // 画像/胜率表展开收起
  $('toggleRate').addEventListener('click', function(){
    var c = $('rateContent');
    var show = c.style.display === 'none';
    c.style.display = show ? 'block' : 'none';
    this.textContent = show ? '收起 ▼' : '展开 ▶';
    if (show) renderRate();
  });

  // 导出备份
  $('exportBtn').addEventListener('click', () => {
    const SYM2CODE = { '虎':'hu', '龙':'long', '入':'ru', '出':'chu' };
    let lines = [];
    state.groups.forEach(g => {
      const chars = g.list.map(s => SYMBOLS[s]).join('');
      lines.push([g.name, g.time || '', chars].join('|'));
    });
    const text = lines.join('\n');
    navigator.clipboard.writeText(text).then(() => {
      alert('已复制到剪贴板，共' + state.groups.length + '组。\n\n把这段文字存到微信备忘录/记事本里，换设备时用"导入恢复"粘回来。');
    }).catch(() => {
      prompt('复制以下文字存好：', text);
    });
  });

  // 导入恢复
  $('importBtn').addEventListener('click', () => {
    const text = prompt('粘贴之前导出的备份文字：');
    if (!text || !text.trim()) return;
    const CODE2SYM = { hu:'虎', long:'龙', ru:'入', chu:'出' };
    const SYM2CODE = { '虎':'hu', '龙':'long', '入':'ru', '出':'chu' };
    const newGroups = [];
    text.trim().split('\n').forEach(line => {
      const parts = line.split('|');
      if (parts.length < 3) return;
      const name = parts[0];
      const time = parts[1];
      const chars = parts[2];
      const list = [];
      for (const ch of chars){
        if (SYM2CODE[ch]) list.push(SYM2CODE[ch]);
      }
      if (list.length) newGroups.push({ name, time, list });
    });
    if (!newGroups.length){ alert('没识别到有效数据'); return; }
    if (!confirm('将导入' + newGroups.length + '组，和现有数据合并。继续？')) return;
    state.groups = state.groups.concat(newGroups);
    state.groupNum = state.groups.length + 1;
    save(); render();
    alert('导入成功，共' + newGroups.length + '组');
  });

  // 键盘快捷键
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const k = e.key.toLowerCase();
    if (k === 'h' || k === 'j'){ pushSymbol('hu'); }
    else if (k === 'l'){ pushSymbol('long'); }
    else if (k === 'r'){ pushSymbol('ru'); }
    else if (k === 'c'){ pushSymbol('chu'); }
    else if (k === 'z'){ state.current.pop(); if (state.currentMarks && state.currentMarks.length) state.currentMarks.pop(); save(); render(); }
    else if (k === 'enter'){
      if (state.current.length){
        const now = new Date();
        const pad = n => String(n).padStart(2,'0');
        const timeStr = (now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
        state.groups.push({ name: currentName(), list: state.current.slice(), time: timeStr, marks: (state.currentMarks||[]).slice() });
        state.current = [];
        state.currentMarks = [];
        state.groupNum++;
        // 保留人名不清空
        save(); render();
      }
    }
  });

  backfillMarks();
  render();

  // 实时时钟
  function tick(){
    const n = new Date();
    const pad = x => String(x).padStart(2,'0');
    $('nowTime').textContent = (n.getMonth()+1) + '-' + pad(n.getDate()) + ' ' + pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
