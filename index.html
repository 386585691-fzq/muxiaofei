<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUXIAOFEI 数据看板</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0f1115;color:#e8e8e8;font-family:-apple-system,"Microsoft YaHei",sans-serif;min-height:100vh}
  header{position:sticky;top:0;background:#161a22;border-bottom:1px solid #262c38;padding:12px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;z-index:10}
  h1{font-size:20px;letter-spacing:1px}
  h1 b{color:#ffd24d}
  #meta{font-size:12px;color:#9aa4b2}
  #status{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:20px;background:#1c2733;color:#8fb7e8}
  #status.ok{background:#14261a;color:#6fcf8f}
  #status.err{background:#2a1515;color:#ff8f8f}
  button,input{background:#1d232e;border:1px solid #303a49;color:#e8e8e8;border-radius:8px;padding:6px 12px;font-size:13px}
  button{cursor:pointer}
  button:hover{background:#263041}
  #search{width:160px}
  main{padding:16px 18px;max-width:1100px;margin:0 auto}
  .cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .card{background:#161a22;border:1px solid #262c38;border-radius:12px;padding:10px 16px;min-width:110px}
  .card .n{font-size:22px;font-weight:700;color:#ffd24d}
  .card .l{font-size:12px;color:#9aa4b2;margin-top:2px}
  .card.online .n{color:#6fcf8f}
  h2{font-size:15px;color:#c9d2dd;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
  h2:before{content:'';width:4px;height:14px;background:#ffd24d;border-radius:2px}
  #persons{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .pchip{background:#1b2029;border:1px solid #2a3140;border-radius:20px;padding:5px 12px;font-size:12px;color:#cfd6e0}
  .pchip b{color:#ffd24d;font-size:13px}
  .pchip i{color:#7d8796;font-style:normal;margin-left:4px}
  .row{display:flex;align-items:center;gap:10px;background:#151922;border:1px solid #242b38;border-radius:10px;padding:9px 12px;margin-bottom:7px}
  .row .tm{font-size:11px;color:#7d8796;min-width:88px}
  .row .nm{font-size:14px;color:#ffd24d;min-width:70px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .tiles{display:flex;gap:3px;flex-wrap:wrap}
  .tile{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff}
  .row .cnt{font-size:11px;color:#7d8796;margin-left:auto;white-space:nowrap}
  .empty{color:#7d8796;text-align:center;padding:30px 0;font-size:13px}
  footer{text-align:center;color:#5c6674;font-size:11px;padding:20px 0 30px}
</style>
</head>
<body>
<header>
  <h1>MUXIAOFEI <b>数据看板</b></h1>
  <div id="meta"></div>
  <div id="status">连接中…</div>
  <button id="refreshBtn">刷新</button>
  <input id="search" placeholder="搜人名…">
</header>
<main>
  <div class="cards">
    <div class="card"><div class="n" id="cGroups">–</div><div class="l">总组数</div></div>
    <div class="card"><div class="n" id="cTiles">–</div><div class="l">总格数</div></div>
    <div class="card"><div class="n" id="cPersons">–</div><div class="l">人数</div></div>
    <div class="card online"><div class="n" id="cCloud">☁</div><div class="l">云端在线</div></div>
  </div>
  <h2>每人统计</h2>
  <div id="persons"></div>
  <h2>全部记录（最新在前）</h2>
  <div id="list"></div>
  <div class="empty" id="empty" style="display:none">暂无数据</div>
</main>
<footer>MUXIAOFEI · 数据直连云端数据库 · 每 60 秒自动刷新</footer>
<script>
  var CLOUD_URL = 'https://rnembqlwqwwionyuilpy.supabase.co';
  var CLOUD_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJuZW1icWx3cXd3aW9ueXVpbHB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0Nzk4NjcsImV4cCI6MjEwNzA1NTg2N30.3Gu8OhnZlLo_HMiU91ZerU8i_eklAO2oIfK3TCcC5NY';
  var COLORS = {虎:'#b03a2e', 龙:'#2456a6', 入:'#c8862a', 出:'#2e8b57'};
  var allRows = [];
  function parseTiles(t){
    if(Array.isArray(t)) return t;
    try{ var a = JSON.parse(t); return Array.isArray(a) ? a : []; }catch(e){ return []; }
  }
  function fmt(t){
    if(!t) return '–';
    var d = new Date(t);
    function p(n){ return (n<10?'0':'')+n; }
    return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  async function fetchAll(){
    var all = [], offset = 0;
    for(;;){
      var r = await fetch(CLOUD_URL + '/rest/v1/jipai?select=name,time,tiles&order=time.desc&limit=1000&offset=' + offset, {
        headers: { apikey: CLOUD_KEY, Authorization: 'Bearer ' + CLOUD_KEY }
      });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      var rows = await r.json();
      all = all.concat(rows);
      if(rows.length < 1000) break;
      offset += 1000;
    }
    return all;
  }
  function render(){
    var q = (document.getElementById('search').value || '').trim().toLowerCase();
    var rows = allRows.filter(function(r){ return !q || (r.name || '').toLowerCase().indexOf(q) >= 0; });
    var totalTiles = 0, names = {}, byName = {};
    allRows.forEach(function(r){
      var t = parseTiles(r.tiles);
      totalTiles += t.length;
      var n = (r.name || '(未命名)').trim();
      names[n] = 1;
      if(!byName[n]) byName[n] = {c:0, t:0};
      byName[n].c++; byName[n].t += t.length;
    });
    document.getElementById('cGroups').textContent = allRows.length;
    document.getElementById('cTiles').textContent = totalTiles;
    document.getElementById('cPersons').textContent = Object.keys(names).length;
    var today = new Date();
    document.getElementById('meta').textContent = '更新于 ' + today.getMonth() + '-' + today.getDate() + ' ' + today.getHours() + ':' + today.getMinutes();
    var ps = Object.keys(byName).map(function(n){ return {n:n, c:byName[n].c, t:byName[n].t}; })
      .sort(function(a,b){ return b.c - a.c; });
    document.getElementById('persons').innerHTML = ps.map(function(p){
      return '<span class="pchip"><b>'+esc(p.n)+'</b><i>'+p.c+' 组 · '+p.t+' 格</i></span>';
    }).join('');
    var listEl = document.getElementById('list');
    var emptyEl = document.getElementById('empty');
    if(!rows.length){ listEl.innerHTML = ''; emptyEl.style.display = ''; return; }
    emptyEl.style.display = 'none';
    listEl.innerHTML = rows.map(function(r){
      var t = parseTiles(r.tiles);
      var cnt = {虎:0,龙:0,入:0,出:0};
      t.forEach(function(ch){ if(cnt[ch] !== undefined) cnt[ch]++; });
      var tilesHtml = t.map(function(ch){
        var bg = COLORS[ch] || '#555';
        return '<span class="tile" style="background:'+bg+'">'+esc(ch)+'</span>';
      }).join('');
      var cntHtml = ['虎','龙','入','出'].map(function(k){
        return (cnt[k] ? k+cnt[k] : '');
      }).filter(Boolean).join(' ');
      return '<div class="row"><span class="tm">'+fmt(r.time)+'</span><span class="nm">'+esc(r.name||'(未命名)')+'</span><span class="tiles">'+tilesHtml+'</span><span class="cnt">'+cntHtml+'</span></div>';
    }).join('');
  }
  async function load(){
    var st = document.getElementById('status');
    st.className = ''; st.textContent = '连接中…';
    try{
      allRows = await fetchAll();
      render();
      st.className = 'ok'; st.textContent = '☁ 已连接云端 · ' + allRows.length + ' 组';
    }catch(e){
      st.className = 'err'; st.textContent = '云端连接失败，请检查网络';
    }
  }
  document.getElementById('refreshBtn').addEventListener('click', load);
  document.getElementById('search').addEventListener('input', render);
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
