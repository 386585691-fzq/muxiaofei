  // ===== 新增：云端分析面板（直接拉 Supabase 全量数据，独立计算，不依赖本地 state） =====
  function cloudAnalyze(){
    var box = $('cloudContent');
    box.innerHTML = '<div style="color:#34d399;font-size:12px;padding:12px;text-align:center;">正在从云端拉取数据计算…（首次约10秒，请稍候）</div>';
    sbFetchAll(function(err, rows){
      if (err){
        var lc = state.groups.length;
        box.innerHTML = '<div style="color:#f87171;font-size:12px;padding:12px;text-align:center;">⚠️ 云端拉取失败（网络慢/超时）<br><br>点右上角「刷新」重试' + (lc > 0 ? '<br><br><button id="cloudLocalBtn" style="padding:8px 16px;border-radius:8px;background:rgba(52,211,153,.15);color:#34d399;font-size:12px;font-weight:700;border:1px solid rgba(52,211,153,.4);cursor:pointer;">先看本地分析（本机 '+lc+' 组）</button>' : '') + '</div>';
        var lb = document.getElementById('cloudLocalBtn');
        if (lb) lb.addEventListener('click', function(){ renderCloudFromLocal(); });
        return;
      }
      if (!rows || !rows.length){ box.innerHTML = '<div style="color:#64748b;font-size:12px;padding:12px;text-align:center;">云端暂无数据</div>'; return; }
      var groups = rows.map(function(r){
        var list = r.list;
        if (typeof list === 'string'){ try{ list = JSON.parse(list); }catch(e){ list = []; } }
        if (!Array.isArray(list)) list = [];
        return { name: r.name || '', time: r.time || '', list: list };
      });
      // 过滤老批次（9月旧数据 / 无时间的老名单）
      var OLD = ['888','123','95公分','@','义不容辞','依依','发发朋友圈','可乐','合兴','多彩多亿','必胜','牡丹'];
      groups = groups.filter(function(g){
        var t = String(g.time || '');
        if (t.indexOf('9-') === 0) return false;
        if (!t && OLD.indexOf(g.name) >= 0) return false;
        return g.name && g.list.length;
      });
      // 每日记录量（日期补零归一）
      function normDay(d){ var p = d.split('-'); if (p.length === 2) return p[0].padStart(2,'0') + '-' + p[1].padStart(2,'0'); return d; }
      var dayMap = {};
      groups.forEach(function(g){
        var d = normDay(String(g.time || '').split(' ')[0]);
        if (d) dayMap[d] = (dayMap[d] || 0) + 1;
      });
      // 人名聚合
      var nm = {};
      groups.forEach(function(g){
        if (!nm[g.name]) nm[g.name] = { name: g.name, groups: 0, hands: 0, days: {} };
        var m = nm[g.name]; m.groups++; m.hands += g.list.length;
        var d = normDay(String(g.time || '').split(' ')[0]);
        if (d) m.days[d] = (m.days[d] || 0) + 1;
      });
      // 近7天边界（含今天往前7天）
      var today = new Date();
      function dkey(off){ var t = new Date(today); t.setDate(today.getDate() - off); return String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0'); }
      var seven = {};
      for (var i = 0; i < 7; i++) seven[dkey(i)] = 1;
      Object.keys(nm).forEach(function(n){
        var m = nm[n]; m.last7 = 0;
        Object.keys(m.days).forEach(function(d){ if (seven[d]) m.last7 += m.days[d]; });
      });
      var names = Object.keys(nm);
      // AI胜率（独立留一手验证：只学该人其他组逐手预测本组）
      function calcRate(name){
        var gs = groups.filter(function(g){ return g.name === name; });
        if (gs.length < 2) return null;
        var hit = 0, total = 0;
        gs.forEach(function(g, gi){
          var others = gs.filter(function(_, j){ return j !== gi; });
          var cur = [];
          for (var k = 0; k < g.list.length; k++){
            var sorted = predictTop2(cur, others);
            if (sorted.length){ total++; if (sorted.indexOf(g.list[k]) >= 0) hit++; }
            cur.push(g.list[k]);
          }
        });
        return { hit: hit, total: total, rate: total ? Math.round(hit/total*100) : 0 };
      }
      // 分片计算，避免卡 UI
      var rates = {}, idx = 0;
      function step(){
        var t0 = Date.now();
        while (idx < names.length && Date.now() - t0 < 60){ rates[names[idx]] = calcRate(names[idx]); idx++; }
        if (idx < names.length){ setTimeout(step, 0); return; }
        renderCloud(rates);
      }
      function renderCloud(rates){
        var html = '';
        // 每日记录量
        var days = Object.keys(dayMap).sort();
        html += '<div style="font-size:11px;color:#34d399;font-weight:700;margin-bottom:4px;">每日记录量</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">';
        days.forEach(function(d){ html += '<span style="background:rgba(52,211,153,.12);color:#a7f3d0;padding:2px 7px;border-radius:6px;font-size:10px;">' + d + ' · ' + dayMap[d] + '组</span>'; });
        html += '</div>';
        // 热度榜 TOP15（按记录组数）
        var hot = Object.keys(nm).map(function(n){ return nm[n]; }).sort(function(a,b){ return b.groups - a.groups || b.hands - a.hands; }).slice(0, 15);
        html += '<div style="font-size:11px;color:#34d399;font-weight:700;margin-bottom:4px;">热度榜 TOP15（记录最多的）</div>';
        html += '<table class="rate-table" style="font-size:11px;"><tr><th>人名</th><th>组</th><th>手</th><th>AI胜率</th><th>近7天+</th></tr>';
        hot.forEach(function(m){
          var r = rates[m.name];
          var rTxt = r && r.total >= 10 ? '<span style="color:' + (r.rate>=80?'#4ade80':r.rate>=70?'#fbbf24':'#f87171') + ';font-weight:700;">' + r.rate + '%</span>' : (r ? '<span style="color:#94a3b8;">' + r.rate + '%</span>' : '<span style="color:#64748b;">-</span>');
          html += '<tr><td style="color:#fef3c7;font-weight:700;">' + escapeHtml(m.name) + '</td><td>' + m.groups + '</td><td>' + m.hands + '</td><td>' + rTxt + '</td><td style="color:' + (m.last7>0?'#34d399':'#64748b') + ';">' + m.last7 + '</td></tr>';
        });
        html += '</table>';
        // AI胜率榜 TOP10（≥3组且≥20手）
        var rateTop = Object.keys(nm).map(function(n){ return { name: n, m: nm[n], r: rates[n] }; }).filter(function(x){ return x.r && x.m.groups >= 3 && x.r.total >= 20; }).sort(function(a,b){ return b.r.rate - a.r.rate || b.m.hands - a.m.hands; }).slice(0, 10);
        if (rateTop.length){
          html += '<div style="font-size:11px;color:#34d399;font-weight:700;margin:8px 0 4px;">AI胜率榜 TOP10（≥3组）</div>';
          html += '<table class="rate-table" style="font-size:11px;"><tr><th>人名</th><th>组</th><th>手</th><th>AI胜率</th></tr>';
          rateTop.forEach(function(x){
            var col = x.r.rate>=80?'#4ade80':x.r.rate>=70?'#fbbf24':'#f87171';
            html += '<tr><td style="color:#fef3c7;font-weight:700;">' + escapeHtml(x.name) + '</td><td>' + x.m.groups + '</td><td>' + x.m.hands + '</td><td style="color:' + col + ';font-weight:700;">' + x.r.rate + '% (' + x.r.hit + '/' + x.r.total + ')</td></tr>';
          });
          html += '</table>';
        }
        
                      html += '<div style="font-size:9px;color:#64748b;margin-top:6px;">AI胜率=留一手验证（只学该人其他组逐手预测本组）。热度+胜率仅供参考，随机事件无确定规律。数据源：Supabase 云端 ' + groups.length + ' 组 · ' + names.length + ' 个人名</div>';
        box.innerHTML = html;
      }
      setTimeout(step, 0);
    });
  }
  // 本地降级分析（云端拉取失败时，用本机数据先看）
  function renderCloudFromLocal(){
    var box = $('cloudContent');
    var groups = (state.groups || []).filter(function(g){ return g && g.name && (g.list||[]).length; }).map(function(g){ return { name: g.name, time: g.time || '', list: g.list }; });
    if (!groups.length){ box.innerHTML = '<div style="color:#64748b;font-size:12px;padding:12px;text-align:center;">本地暂无数据，先在「记录」页登记</div>'; return; }
    var dayMap = {};
    groups.forEach(function(g){ var dd = String(g.time || '').split(' ')[0]; if (dd) dayMap[dd] = (dayMap[dd] || 0) + 1; });
    var nm = {};
    groups.forEach(function(g){
      if (!nm[g.name]) nm[g.name] = { name: g.name, groups: 0, hands: 0 };
      nm[g.name].groups++; nm[g.name].hands += g.list.length;
    });
    function calcRate(name){
      var gs = groups.filter(function(g){ return g.name === name; });
      if (gs.length < 2) return null;
      var hit = 0, total = 0;
      gs.forEach(function(g, gi){
        var others = gs.filter(function(_, j){ return j !== gi; });
        var cur = [];
        for (var kk = 0; kk < g.list.length; kk++){
          var sorted = predictTop2(cur, others);
          if (sorted.length){ total++; if (sorted.indexOf(g.list[kk]) >= 0) hit++; }
          cur.push(g.list[kk]);
        }
      });
      return { hit: hit, total: total, rate: total ? Math.round(hit/total*100) : 0 };
    }
    var names = Object.keys(nm);
    var rates = {};
    names.forEach(function(n){ rates[n] = calcRate(n); });
    var html = '<div style="font-size:12px;color:#34d399;font-weight:700;margin-bottom:4px;">本地降级分析（云端暂时拉不到，先用本机数据）</div>';
    var days = Object.keys(dayMap).sort();
    html += '<div style="font-size:11px;color:#34d399;font-weight:700;margin-bottom:4px;">每日记录量</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">';
    days.forEach(function(dd){ html += '<span style="background:rgba(52,211,153,.12);color:#a7f3d0;padding:2px 7px;border-radius:6px;font-size:10px;">' + dd + ' · ' + dayMap[dd] + '组</span>'; });
    html += '</div>';
    var hot = names.map(function(n){ return nm[n]; }).sort(function(a,b){ return b.groups - a.groups || b.hands - a.hands; }).slice(0, 15);
    html += '<div style="font-size:11px;color:#34d399;font-weight:700;margin-bottom:4px;">热度榜 TOP15（本机）</div>';
    html += '<table class="rate-table" style="font-size:11px;"><tr><th>人名</th><th>组</th><th>手</th><th>AI胜率</th></tr>';
    hot.forEach(function(m){
      var r = rates[m.name];
      var rTxt = r && r.total >= 10 ? '<span style="color:' + (r.rate>=80?'#4ade80':r.rate>=70?'#fbbf24':'#f87171') + ';font-weight:700;">' + r.rate + '%</span>' : (r ? '<span style="color:#94a3b8;">' + r.rate + '%</span>' : '<span style="color:#64748b;">-</span>');
      html += '<tr><td style="color:#fef3c7;font-weight:700;">' + escapeHtml(m.name) + '</td><td>' + m.groups + '</td><td>' + m.hands + '</td><td>' + rTxt + '</td></tr>';
    });
    html += '</table>';
    html += '<div style="font-size:9px;color:#64748b;margin-top:6px;">数据源：本机本地 ' + groups.length + ' 组 · ' + names.length + ' 人名。云端恢复后点右上角刷新可看全量</div>';
    box.innerHTML = html;
  }


  function render(){
    renderGrid();
    renderNameBar();
    renderTags();
    renderLiveHint();
    renderHistory();
    updateRecommend();
  }

  // 记录时高亮AI推荐的门（主推+次推），让你看到推荐依据
  function updateRecommend(){
    document.querySelectorAll('.pbtn').forEach(function(b){ b.classList.remove('top1','top2'); });
    const filtered = getFiltered();
    const top = predictTop2(state.current, filtered);
    if (!top.length) return;
    const map = {hu:'.pbtn-hu', long:'.pbtn-long', ru:'.pbtn-ru', chu:'.pbtn-chu'};
    const b1 = document.querySelector(map[top[0]]);
    if (b1) b1.classList.add('top1');
    if (top.length > 1){
      const b2 = document.querySelector(map[top[1]]);
      if (b2) b2.classList.add('top2');
    }
  }

  // 公共：记录一手牌（点按钮或键盘），同时把AI预测对错记到 currentMarks
  function pushSymbol(s){
    if (state.current.length >= 12){ alert('本组已满 12 格，先点「保存本组」开新组'); return; }
    // 对错标记在完成本组后按“整组热门3门”统一计算，记录时先不标
    state.current.push(s);
    if (!state.currentMarks) state.currentMarks = [];
    state.currentMarks.push(-1);
    save(); render();
    updateAIHint();
  }

  // 打对错：推荐3门=整组热门3门。开热门✓，开冷门×（热门=该组出现最多的3门）
  function backfillMarks(){
    if (state._markV2) return;
    state._markV2 = true;
    var changed = false;
    state.groups.forEach(function(g){
      var st = {hu:0,long:0,ru:0,chu:0};
      (g.list || []).forEach(function(x){ if (st[x] !== undefined) st[x]++; });
      var ks = Object.keys(st).sort(function(a,b){ return st[b]-st[a]; }).slice(0,3);
      var marks = [];
      for (var i=0; i<g.list.length; i++){
        marks.push(ks.indexOf(g.list[i]) >= 0 ? 1 : 0);
      }
      g.marks = marks;
      changed = true;
    });
    if (changed){ save(); render(); }
  }

  document.querySelectorAll('.pbtn').forEach(b => {
    b.addEventListener('click', () => {
      pushSymbol(b.dataset.s);
    });
  });

  // 手动输入：中文（虎龙入出）/拼音（hu long ru chu）/字母（h l r c），支持整行一次添加
  
  
  


  $('undoBtn').addEventListener('click', () => {
    state.current.pop();
    if (state.currentMarks && state.currentMarks.length) state.currentMarks.pop();
    save(); render();
  });

  $('doneBtn').addEventListener('click', () => {
    if (!state.current.length){ alert('当前组还没填任何字'); return; }
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const timeStr = (now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
    state.groups.push({ name: currentName(), list: state.current.slice(), time: timeStr, marks: (state.currentMarks||[]).slice() });
    state.current = [];
    state.currentMarks = [];
    state.groupNum++;
    // 保留人名不清空，方便连续记录同一个人
    save(); render();
  });

   $('searchBox').addEventListener('input', e => {
    searchQuery = e.target.value;
    activeTag = '';
    render();
     // 人名联想：输一个字跳出匹配人名
     var sug = $('searchSuggest');
     var q = e.target.value.trim();
     if (!q){ sug.style.display = 'none'; sug.innerHTML = ''; return; }
     var names = [];
     state.groups.forEach(function(g){ if (g.name && names.indexOf(g.name) < 0) names.push(g.name); });
     var hits = names.filter(function(n){ return n.indexOf(q) >= 0; }).slice(0, 10);
     if (!hits.length){ sug.style.display = 'none'; sug.innerHTML = ''; return; }
     sug.innerHTML = hits.map(function(n){
       return '<div class="suggest-item" data-n="' + n.replace(/"/g,'&quot;') + '">' + n.replace(/</g,'&lt;') + '</div>';
     }).join('');
     sug.style.display = 'block';
     sug.querySelectorAll('.suggest-item').forEach(function(el){
       el.addEventListener('click', function(){
         searchQuery = el.dataset.n;
         activeTag = '';
         $('searchBox').value = el.dataset.n;
         sug.style.display = 'none'; sug.innerHTML = '';
         render();
       });
     });
   });
   // 点击别处收起搜索联想
   document.addEventListener('click', function(e){
     var sug = $('searchSuggest');
     var inp = $('searchBox');
     if (sug.style.display === 'block' && !sug.contains(e.target) && e.target !== inp){ sug.style.display = 'none'; }
   });

  $('groupName').addEventListener('input', () => {
    renderLiveHint();
    renderSuggest();
    updateAIHint();
  });

  $('clearAllBtn').addEventListener('click', () => {
    if (!confirm('清空所有历史和当前记录？')) return;
    state.groups = [];
    state.current = [];
    save(); render();
  });

  // 云端分析面板：展开时计算一次，刷新按钮可重新拉云端重算
  var cloudRendered = false;
  function showCloudPanel(){
    var c = $('cloudContent');
    var show = c.style.display === 'none';
    c.style.display = show ? 'block' : 'none';
    $('toggleCloud').textContent = show ? '收起 ▼' : '展开 ▶';
    if (show) cloudAnalyze(); // 每次展开都重新拉取计算（保证最新）
  }
  $('toggleCloud').addEventListener('click', showCloudPanel);
   // 默认展开云端分析面板（AI关注直接可见）
   setTimeout(function(){ try{ var cc = $('cloudContent'); if (cc && cc.style.display === 'none') showCloudPanel(); }catch(e){} }, 600);
  $('cloudRefresh').addEventListener('click', function(){ cloudAnalyze(); });

  // 导出备份
  $('exportBtn').addEventListener('click', () => {
    const SYM2CODE = { '虎':'hu', '龙':'long', '入':'ru', '出':'chu' };
    let lines = [];
    state.groups.forEach(g => {
      const chars = g.list.map(s => SYMBOLS[s]).join('');
      lines.push([g.name, g.time || '', chars].join('|'));
    });
    const text = lines.join('\n');
    navigator.clipboard.writeText(text).then(() => {
      alert('已复制到剪贴板，共' + state.groups.length + '组。\n\n把这段文字存到微信备忘录/记事本里，换设备时用"导入恢复"粘回来。');
    }).catch(() => {
      prompt('复制以下文字存好：', text);
    });
  });

  // 导入恢复
  $('importBtn').addEventListener('click', () => {
    const text = prompt('粘贴之前导出的备份文字：');
    if (!text || !text.trim()) return;
    const CODE2SYM = { hu:'虎', long:'龙', ru:'入', chu:'出' };
    const SYM2CODE = { '虎':'hu', '龙':'long', '入':'ru', '出':'chu' };
    const newGroups = [];
    text.trim().split('\n').forEach(line => {
      const parts = line.split('|');
      if (parts.length < 3) return;
      const name = parts[0];
      const time = parts[1];
      const chars = parts[2];
      const list = [];
      for (const ch of chars){
        if (SYM2CODE[ch]) list.push(SYM2CODE[ch]);
      }
      if (list.length) newGroups.push({ name, time, list });
    });
    if (!newGroups.length){ alert('没识别到有效数据'); return; }
    if (!confirm('将导入' + newGroups.length + '组，和现有数据合并。继续？')) return;
    state.groups = state.groups.concat(newGroups);
    state.groupNum = state.groups.length + 1;
    save(); render();
    alert('导入成功，共' + newGroups.length + '组');
  });

  // 键盘快捷键
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const k = e.key.toLowerCase();
    if (k === 'h' || k === 'j'){ pushSymbol('hu'); }
    else if (k === 'l'){ pushSymbol('long'); }
    else if (k === 'r'){ pushSymbol('ru'); }
    else if (k === 'c'){ pushSymbol('chu'); }
    else if (k === 'z'){ state.current.pop(); if (state.currentMarks && state.currentMarks.length) state.currentMarks.pop(); save(); render(); }
    else if (k === 'enter'){
      if (state.current.length){
        const now = new Date();
        const pad = n => String(n).padStart(2,'0');
        const timeStr = (now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
        state.groups.push({ name: currentName(), list: state.current.slice(), time: timeStr, marks: (state.currentMarks||[]).slice() });
        state.current = [];
        state.currentMarks = [];
        state.groupNum++;
        // 保留人名不清空
        save(); render();
      }
    }
  });

  backfillMarks();
  render();

  // 实时时钟
  function tick(){
    const n = new Date();
    const pad = x => String(x).padStart(2,'0');
    var t = $('nowTime');
    if (t) t.textContent = (n.getMonth()+1) + '-' + pad(n.getDate()) + ' ' + pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
