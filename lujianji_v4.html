<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>路单记牌器</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="./icon.png">
<link rel="icon" type="image/png" href="./icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "STHeiti", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    background-attachment: fixed;
    color: #e2e8f0;
    min-height: 100vh; padding: 10px;
    max-width: 600px; margin: 0 auto;
  }

  .now-time {
    text-align: right; font-size: 14px; color: #fbbf24;
    font-weight: 700; margin-bottom: 8px; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 20px rgba(251,191,36,.3);
  }

  .section-title { font-size: 12px; color: #94a3b8; margin: 10px 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 6px; font-weight: 600; letter-spacing: 1px; }
  .section-title span:first-child { white-space: nowrap; }
  #searchBox {
    flex: 1; max-width: 180px; background: rgba(255,255,255,.08); border: 1px solid rgba(251,191,36,.3); color: #fbbf24;
    padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; outline: none;
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    backdrop-filter: blur(10px);
  }
  #searchBox::placeholder { color: #64748b; }

  .current {
    background: rgba(30, 41, 59, .6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(251,191,36,.15);
    border-radius: 14px; padding: 8px 10px; margin-bottom: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .group-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .group-name-row label { font-size: 12px; color: #94a3b8; white-space: nowrap; font-weight: 600; }
  #groupName {
    flex: 1; background: rgba(250, 245, 224, .95); border: 2px solid #b8a87a; color: #1a1a1a;
    padding: 5px 10px; border-radius: 8px; font-size: 14px; font-weight: 900; outline: none;
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    box-shadow: 0 4px 15px rgba(184,168,122,.2);
  }
  #groupName::placeholder { color: #b8a87a; font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 6px; }
  .cell {
    background: linear-gradient(180deg, #fef9e7 0%, #f5e9c8 100%);
    border: 1px solid #d4c59a;
    border-radius: 6px;
    box-shadow: 0 2px 0 #a89060, 0 4px 10px rgba(0,0,0,.2), inset 0 1px 0 #fff;
    aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 900; color: #1a1a1a; cursor: pointer; user-select: none;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    transition: transform .1s;
    position: relative;
  }
  .cell-mark {
    position: absolute; top: 1px; right: 1px;
    width: 14px; height: 14px; border-radius: 50%;
    color: #fff; font-size: 10px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.45); line-height: 1;
  }
  .cell-mark.ok { background: #22c55e; }
  .cell-mark.bad { background: #ef4444; }
  .cell:active { transform: scale(.95); }
  .cell.empty { color: #c5b98a; font-size: 12px; text-shadow: none; }
  .cell.last { box-shadow: 0 2px 0 #a89060, 0 0 0 2px #fbbf24, 0 0 14px rgba(251,191,36,.5); }
  .cell.hu   { color: #dc2626; text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 10px rgba(220,38,38,.2); }
  .cell.long { color: #2563eb; text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 10px rgba(37,99,235,.2); }
  .cell.ru   { color: #d97706; text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 10px rgba(217,119,6,.2); }
  .cell.chu  { color: #16a34a; text-shadow: 0 1px 0 rgba(255,255,255,.6), 0 0 10px rgba(22,163,74,.2); }

  .pick-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 5px; }
  .pbtn {
    padding: 9px 0; border-radius: 9px; border: 1px solid rgba(255,255,255,.1);
    font-size: 21px; font-weight: 900; cursor: pointer;
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    transition: all .15s;
    box-shadow: 0 3px 10px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.1);
  }
  .pbtn:active { transform: scale(0.95); }
  .pbtn-hu   { background: linear-gradient(180deg, #991b1b, #7f1d1d); color: #fecaca; }
  .pbtn-long { background: linear-gradient(180deg, #1e40af, #1e3a8a); color: #bfdbfe; }
  .pbtn-ru   { background: linear-gradient(180deg, #b45309, #854d0e); color: #fef08a; }
  .pbtn-chu  { background: linear-gradient(180deg, #15803d, #14532d); color: #bbf7d0; }

  .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .abtn {
    padding: 7px; border-radius: 9px; border: 1px solid rgba(255,255,255,.1);
    font-size: 12px; font-weight: 700; cursor: pointer;
    transition: all .15s;
    backdrop-filter: blur(10px);
  }
  .abtn:active { transform: scale(.97); }
  .abtn-undo { background: rgba(100,116,139,.3); color: #e2e8f0; }
  .abtn-done { background: linear-gradient(180deg, #059669, #047857); color: #d1fae5; }

  .history-item {
    background: rgba(30, 41, 59, .5);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 6px;
    box-shadow: 0 4px 15px rgba(0,0,0,.2);
  }
  .history-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .history-name { font-size: 17px; font-weight: 900; color: #fef3c7; font-family: "STHeiti", "Microsoft YaHei", sans-serif; }
  .history-count { font-size: 11px; color: #94a3b8; margin-left: 6px; font-weight: 400; }
  .history-del { background: none; border: none; color: #f87171; font-size: 12px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  .history-del:hover { background: rgba(248,113,113,.1); }
  .history-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
  .hcell {
    background: linear-gradient(180deg, #fef9e7 0%, #f5e9c8 100%);
    border: 1px solid #d4c59a;
    border-radius: 5px;
    box-shadow: 0 2px 0 #a89060;
    aspect-ratio: 1/1;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 900; color: #1a1a1a;
    font-family: "STHeiti", "Microsoft YaHei", sans-serif;
    position: relative;
  }
  .hcell-mark {
    position: absolute; top: 0; right: 0;
    width: 12px; height: 12px; border-radius: 50%;
    color: #fff; font-size: 8px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .hcell-mark.ok { background: #22c55e; }
  .hcell-mark.bad { background: #ef4444; }
  .hcell.hu   { color: #dc2626; }
  .hcell.long { color: #2563eb; }
  .hcell.ru   { color: #d97706; }
  .hcell.chu  { color: #16a34a; }

  .empty-tip { color: #64748b; text-align: center; padding: 20px 0; font-size: 13px; }
  .clear-all {
    width: 100%; margin-top: 8px; padding: 10px;
    background: linear-gradient(180deg, #991b1b, #7f1d1d); color: #fecaca;
    border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 15px rgba(127,29,29,.3);
  }

  .tag {
    padding: 3px 8px; border-radius: 10px;
    background: #3a3a3a; color: #ccc;
    font-size: 11px; cursor: pointer; border: 1px solid #555;
    user-select: none;
  }
  .tag.active {
    background: #fbbf24; color: #1a1a1a; border-color: #fbbf24; font-weight: 700;
  }

  .mini-btn {
    padding: 3px 8px; border-radius: 10px; border: 1px solid #555;
    background: #3a3a3a; color: #aaa; font-size: 11px; cursor: pointer;
  }
  .mini-btn.on { background: #fbbf24; color: #1a1a1a; border-color: #fbbf24; font-weight: 700; }

  /* ===== 新增：每组画像徽章 & 胜率表 ===== */
  .dist-bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; margin: 3px 0; }
  .dist-hu { background: #dc2626; } .dist-long { background: #2563eb; } .dist-ru { background: #d97706; } .dist-chu { background: #16a34a; }
  .profile-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
  .profile-tag { background: rgba(168,85,247,.15); color: #d8b4fe; padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 600; }
  .rate-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 4px; }
  .rate-table th { background: rgba(251,191,36,.12); color: #fbbf24; padding: 5px 4px; font-weight: 700; text-align: left; }
  .rate-table td { padding: 5px 4px; border-top: 1px solid rgba(255,255,255,.06); vertical-align: middle; }
  .rate-table tr { cursor: pointer; }
  .rate-table tr:hover td { background: rgba(251,191,36,.05); }
  .rate-num { font-variant-numeric: tabular-nums; }

#nameSuggest .suggest-item{ padding:6px 10px; color:#fef3c7; font-size:14px; cursor:pointer; border-bottom:1px solid rgba(251,191,36,.12); font-weight:700; }
#nameSuggest .suggest-item:hover, #nameSuggest .suggest-item.active{ background:rgba(251,191,36,.15); color:#facc15; }

#aiHint .aihint-warn{ background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.4); color:#fecaca; border-radius:8px; padding:5px 8px; font-size:12px; font-weight:700; margin-bottom:3px; }
#aiHint .aihint-ok{ background:rgba(148,163,184,.08); border:1px solid rgba(148,163,184,.25); color:#cbd5e1; border-radius:8px; padding:4px 8px; font-size:11px; margin-bottom:3px; }

.pbtn.top1{ outline:2px solid #fbbf24; box-shadow:0 0 10px rgba(251,191,36,.55); }
.pbtn.top2{ outline:1px solid rgba(251,191,36,.45); }

  .navbtn{flex:1;padding:8px 0;border-radius:8px;background:rgba(251,191,36,.12);color:#fbbf24;font-size:13px;font-weight:700;border:1px solid rgba(251,191,36,.25);cursor:pointer;font-family:inherit;}
  .tbtn{padding:5px 10px;border-radius:6px;background:rgba(251,191,36,.08);color:#fbbf24;font-size:12px;font-weight:700;border:1px solid rgba(251,191,36,.25);cursor:pointer;font-family:inherit;}
  .tbtn.on{background:rgba(251,191,36,.35);border-color:#fbbf24;}
  .navbtn:active{background:rgba(251,191,36,.35);}
  #topNav{position:sticky;top:0;z-index:50;display:flex;gap:6px;background:rgba(15,23,42,.95);backdrop-filter:blur(10px);padding:6px 8px;border-bottom:1px solid rgba(251,191,36,.2);}

  .page{display:none;}
  .page.active{display:block;}
</style>
</head>
<body>
<div id="updateBar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9997;background:linear-gradient(90deg,#fbbf24,#f59e0b);color:#0f172a;text-align:center;padding:9px;font-size:13px;font-weight:900;cursor:pointer;" onclick="location.reload()">🔄 发现新版本，点这里立即更新</div>
<!-- 密码锁 -->
<div id="lockScreen" style="position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#1e1b4b);z-index:9999;display:none;align-items:center;justify-content:center;">
  <div style="background:rgba(30,41,59,.8);backdrop-filter:blur(20px);border:1px solid rgba(251,191,36,.2);border-radius:16px;padding:30px;width:300px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);">
    <div style="font-size:24px;font-weight:900;color:#fbbf24;margin-bottom:20px;">路单记牌器</div>
    <input id="lockPwd" type="password" placeholder="请输入密码" style="width:100%;padding:12px;border-radius:10px;border:2px solid rgba(251,191,36,.3);background:rgba(255,255,255,.08);color:#fbbf24;font-size:18px;font-weight:700;text-align:center;outline:none;margin-bottom:12px;">
    <div id="lockMsg" style="color:#ef4444;font-size:12px;margin-bottom:10px;min-height:16px;"></div>
    <button id="lockBtn" style="width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(180deg,#d97706,#b45309);color:#fef08a;font-size:16px;font-weight:900;cursor:pointer;">进 入</button>
    <div style="font-size:11px;color:#64748b;margin-top:12px;" id="lockTip"></div>
  </div>
</div>
<div id="loginBar" style="display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-bottom:4px;padding:0 2px;">
  <span id="loginState" style="font-size:11px;color:#94a3b8;"></span>
  <button id="loginBtn" onclick="showLoginModal()" style="padding:4px 10px;border-radius:6px;background:rgba(251,191,36,.12);color:#fbbf24;font-size:11px;font-weight:700;border:1px solid rgba(251,191,36,.3);cursor:pointer;font-family:inherit;">登录</button>
</div>
<div id="loginModal" style="position:fixed;inset:0;background:rgba(2,6,23,.75);z-index:9998;display:none;align-items:center;justify-content:center;">
  <div style="background:rgba(30,41,59,.97);border:1px solid rgba(251,191,36,.25);border-radius:16px;padding:24px;width:300px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);">
    <div style="font-size:19px;font-weight:900;color:#fbbf24;margin-bottom:14px;">账号登录</div>
    <input id="loginPhone" type="text" placeholder="手机号（11位，1开头）" maxlength="11" style="width:100%;padding:12px;border-radius:10px;border:2px solid rgba(251,191,36,.3);background:rgba(255,255,255,.08);color:#fbbf24;font-size:15px;font-weight:700;text-align:center;outline:none;margin-bottom:10px;box-sizing:border-box;font-family:inherit;">
    <input id="loginCode" type="text" placeholder="验证码" maxlength="6" style="width:100%;padding:12px;border-radius:10px;border:2px solid rgba(251,191,36,.3);background:rgba(255,255,255,.08);color:#fbbf24;font-size:15px;font-weight:700;text-align:center;outline:none;margin-bottom:6px;box-sizing:border-box;font-family:inherit;">
    <div style="font-size:10px;color:#64748b;margin-bottom:10px;">🔧 测试版：验证码固定 <span style="color:#fbbf24;font-weight:700;">123456</span>（正式版接短信后变真验证码）</div>
    <button id="loginOk" onclick="doLogin()" style="width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(180deg,#d97706,#b45309);color:#fef08a;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;">登 录</button>
    <button id="loginCancel" onclick="hideLoginModal()" style="width:100%;padding:9px;border-radius:10px;border:1px solid rgba(148,163,184,.3);background:transparent;color:#94a3b8;font-size:13px;cursor:pointer;margin-top:8px;font-family:inherit;">取 消</button>
  </div>
</div>
<div id="topNav">
  <button class="navbtn active" data-page="record">📝 记录</button>
  <button class="navbtn" data-page="ai">🎯 AI关注</button>
  <button class="navbtn" data-page="analyze">📊 分析</button>
  <button class="navbtn" data-page="cloud">☁️ 云端分析</button>
  <button class="navbtn" data-page="history">📚 历史</button>
</div>

<div class="current page active" id="page-record">
  <div class="group-name-row" id="sec-ai">
    <label>组名</label>
    <input id="groupName" type="text" placeholder="点下面选，或自己打，多个名字用逗号隔开" maxlength="20" style="flex:1;min-width:0;">
    <button id="groupNameQuery" style="padding:6px 12px;border-radius:8px;background:rgba(251,191,36,.15);color:#fbbf24;font-size:12px;font-weight:700;border:1px solid rgba(251,191,36,.35);cursor:pointer;white-space:nowrap;">查询</button>
    <div id="nameSuggest" style="display:none;position:relative;background:#1e293b;border:1px solid rgba(251,191,36,.4);border-radius:8px;margin-top:4px;max-height:210px;overflow-y:auto;z-index:20;"></div>
    <div id="aiHint" style="display:none;margin-top:4px;line-height:1.5;"></div>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
    <span style="font-size:10px;color:#888;">快捷选名</span>
    <button id="toggleNameBar" style="padding:1px 6px;border-radius:6px;background:#3a3a3a;color:#aaa;font-size:10px;border:1px solid #555;cursor:pointer;">展开 ▶</button>
  </div>
  <div id="nameBar" style="display:none;flex-wrap:wrap;gap:4px;margin-bottom:6px;max-height:150px;overflow-y:auto;"></div>
  <div class="grid" id="grid"></div>
  <div class="pick-btns">
    <button class="pbtn pbtn-hu" data-s="hu">虎</button>
    <button class="pbtn pbtn-long" data-s="long">龙</button>
    <button class="pbtn pbtn-ru" data-s="ru">入</button>
    <button class="pbtn pbtn-chu" data-s="chu">出</button>
  </div>
  <div class="action-row">
    <button class="abtn abtn-undo" id="undoBtn">撤销</button>
    <button class="abtn abtn-done" id="doneBtn">完成本组并开新组</button>
  </div>
  <div id="liveHint" style="margin-top:5px;"></div>
</div>




<div class="page" id="page-ai">
  <div style="font-size:12px;color:#fbbf24;font-weight:700;margin-bottom:6px;">🎯 AI关注 · 四门规律（从数据学习）</div>
<div style="display:flex;gap:4px;align-items:center;">
  <input id="aiNameInput" type="text" placeholder="输入人名（如 顺顺、牡丹），查看这个人的规律" maxlength="20" style="flex:1;min-width:0;padding:9px 10px;border-radius:8px;border:1px solid rgba(251,191,36,.3);background:rgba(255,255,255,.08);color:#fbbf24;font-size:14px;font-weight:700;outline:none;box-sizing:border-box;font-family:inherit;">
  <button id="aiQuery" style="padding:6px 12px;border-radius:8px;background:rgba(251,191,36,.15);color:#fbbf24;font-size:12px;font-weight:700;border:1px solid rgba(251,191,36,.35);cursor:pointer;white-space:nowrap;">查询</button>
  </div>
  <div id="aiTimeBar" style="display:flex;gap:4px;margin:6px 0;flex-wrap:wrap;">
    <button class="tbtn on" data-tf="all">全部</button>
    <button class="tbtn" data-tf="day">今天</button>
    <button class="tbtn" data-tf="week">本周</button>
    <button class="tbtn" data-tf="month">本月</button>
    <button class="tbtn" data-tf="year">今年</button>
  </div>
  <div id="rtBar" style="display:flex;align-items:center;gap:6px;margin:2px 0 6px;">
    <button id="rtBtn" onclick="toggleRT()" style="padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.4);">🔴 实时监控中</button>
    <span id="rtStatus" style="font-size:10px;color:#64748b;">自动抓云端新登记·每60秒</span>
  </div>
  <div id="aiViewBar" style="margin:6px 0 4px;"></div>
  <div id="aiNameSuggest" style="display:none;position:absolute;background:#1e293b;border:1px solid rgba(251,191,36,.4);border-radius:8px;max-height:200px;overflow-y:auto;z-index:40;min-width:160px;"></div>
  <div id="aiFocusBody" style="margin-top:6px;"></div>
  <div id="aiFocusList" style="margin-top:8px;"></div>
</div>
<div class="page" id="page-analyze">
  <div id="analyzeBody"></div>
</div>
<div class="page" id="page-cloud">
  <div id="cloudSection" style="margin-bottom:8px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:12px;color:#34d399;font-weight:700;">云端分析 · 实时热度/胜率</span>
      <div style="display:flex;gap:4px;">
        <button id="cloudRefresh" style="padding:2px 8px;border-radius:8px;background:rgba(52,211,153,.15);color:#34d399;font-size:11px;border:1px solid rgba(52,211,153,.3);cursor:pointer;">🔄 重跑AI胜率</button>
        <button id="toggleCloud" style="padding:2px 8px;border-radius:8px;background:rgba(52,211,153,.15);color:#34d399;font-size:11px;border:1px solid rgba(52,211,153,.3);cursor:pointer;">展开 ▶</button>
      </div>
    </div>
    <div id="cloudContent" style="display:none;margin-top:4px;background:rgba(16,185,129,.06);border:1px solid rgba(52,211,153,.25);border-radius:10px;padding:8px;max-height:560px;overflow-y:auto;">
  </div>
</div>
<div class="page" id="page-history">
  <div style="display:flex;gap:4px;align-items:center;margin-bottom:6px;">
    <input id="searchBox" type="text" placeholder="搜组名(输一个字跳出人名)..." style="flex:1;min-width:0;">
    <button id="searchQueryBtn" style="padding:6px 12px;border-radius:8px;background:rgba(251,191,36,.15);color:#fbbf24;font-size:12px;font-weight:700;border:1px solid rgba(251,191,36,.35);cursor:pointer;white-space:nowrap;">查询</button>
  </div>

<script>
(function(){

  var LOGIN_KEY = 'road_login_v1';
  function getLogin(){ try{ var o = JSON.parse(localStorage.getItem(LOGIN_KEY) || 'null'); return o; }catch(e){ return null; } }
  function setLogin(u){ localStorage.setItem(LOGIN_KEY, JSON.stringify(u)); }
  function maskPhone(p){ return p ? p.slice(0,3) + '****' + p.slice(7) : ''; }

    var phone = (document.getElementById('loginPhone').value || '').trim();
    var code = (document.getElementById('loginCode').value || '').trim();
    if (!/^1\d{10}$/.test(phone)){ toast('手机号格式不对（11位，1开头）'); return; }
    if (code !== '123456'){ toast('验证码错误（测试版固定 123456）'); return; }
    setLogin({ phone: phone, ts: Date.now() });
    hideLoginModal();
    updateLoginUI();
    toast('✅ 登录成功 ' + maskPhone(phone));
  }
  function logout(){
    localStorage.removeItem(LOGIN_KEY);
    updateLoginUI();

  }
  function updateLoginUI(){
    var u = getLogin();
    var st = document.getElementById('loginState');
    var btn = document.getElementById('loginBtn');
    if (u && u.phone){
      if (st) st.textContent = '已登录 ' + maskPhone(u.phone);

    } else {
      if (st) st.textContent = '未登录（数据存本机+云端）';
      if (btn){ btn.textContent = '登录'; btn.setAttribute('onclick', 'showLoginModal()'); }

  }
  // 暴露到 window（HTML onclick 需要全局访问）
  window.showLoginModal = showLoginModal;
  window.hideLoginModal = hideLoginModal;
  window.doLogin = doLogin;
  window.logout = logout;
  // PWA：注册 Service Worker（离线缓存 + 添加到主屏幕成 App）+ 新版本检测
  if ('serviceWorker' in navigator){
      startRT(); // 实时监控默认开（AI关注页自动抓云端新登记）

  navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){

          if (nw.state === 'installed' && navigator.serviceWorker.controller){
            var ub = document.getElementById('updateBar');

  }
  // 页面加载后更新登录状态

  // 密码锁：解锁后更新登录UI
  var _ol = window.onload;

  // 密码锁逻辑
  function checkLock(){
    var savedPwd = localStorage.getItem(PWD_KEY);
    var lock = document.getElementById('lockScreen');

    var msg = document.getElementById('lockMsg');

      // 第一次使用，设置密码
      tip.textContent = '首次使用，请设置密码';

      document.getElementById('lockBtn').onclick = function(){
        if (pwdInput.value === savedPwd){

  checkLock();

  const STORE_KEY = 'road_groups_v2';
  const IMPORTED_FLAG = 'imported_v1';
  const SYMBOLS = { hu:'虎', long:'龙', ru:'入', chu:'出' };

  // ===== 页面切换：5 个独立页面（记录/AI关注/分析/云端分析/历史） =====

  // AI关注页：全局平均 + 个人规律 + 关注列表
  var aiTimeFilter = 'all';
  function parseTime(ts){
    if (ts == null || ts === '') return null;
    if (typeof ts === 'number' || /^\d{10,}$/.test(String(ts).trim())){
      var dt = new Date(Number(ts));
      if (isNaN(dt.getTime())) return null;
      return {y:dt.getFullYear(), m:dt.getMonth()+1, d:dt.getDate()};
    }
    var mm = String(ts).trim().match(/^(\d{1,2})-(\d{1,2})/);
    if (mm){
      var now = new Date();
      return {y:now.getFullYear(), m:+mm[1], d:+mm[2]};
    }
    return null;
  }
  function timeFilterGroups(groups){
    if (!aiTimeFilter || aiTimeFilter === 'all') return groups || [];
    var now = new Date();
    var cy = now.getFullYear(), cm = now.getMonth()+1, cd = now.getDate();
    var wd = now.getDay(); if (wd === 0) wd = 7;
    var monday = new Date(cy, cm-1, cd - (wd-1));
    return (groups||[]).filter(function(g){
      var t = parseTime(g && g.time);
      if (!t) return false;
      if (aiTimeFilter === 'day') return t.m === cm && t.d === cd;
      if (aiTimeFilter === 'week'){
        var d0 = new Date(t.y, t.m-1, t.d);
        return d0 >= monday && d0 <= now;
      }
      if (aiTimeFilter === 'month') return t.m === cm;
      if (aiTimeFilter === 'year') return t.y === cy;
      return true;
    });
  }
    // 逗号组名拆分：一局多人各自独立统计（四门规律/框架借用共用）
  function splitNames(nm){ return String(nm).split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean); }

  // AI 关注 · 四门规律（用传入的组数据学习）
  function renderDoorPatterns(groups){
    var html = '';
    var DOOR_NAME = { hu:'虎', long:'龙', ru:'入', chu:'出' };
    var doorsArr = ['hu','long','ru','chu'];
    var doorColor = { hu:'#dc2626', long:'#2563eb', ru:'#16a34a', chu:'#64748b' };

        // 1, function(bn){ if(box) box.innerHTML = '<div style="color:#34d399;font-size:12px;padding:12px;text-align:center;">正在从云端拉取数据计算…（已拉 ' + bn + ' 批，首次约10秒）</div>'; }) 全局四门基准（从全部数据学习）
        var gTotal = {hu:0,long:0,ru:0,chu:0,all:0};
        groups.forEach(function(g){
          if (!g || !g.list) return;
          g.list.forEach(function(x){ if (gTotal[x] !== undefined){ gTotal[x]++; gTotal.all++; } });
        });
        var gp = {};
        doorsArr.forEach(function(x){ gp[x] = gTotal.all ? Math.round(gTotal[x]/gTotal.all*100) : 25; });
        // 2) 每人四门分布 + 近15手
        var ds = {};
        var near = {};
        groups.forEach(function(g){
          if (!g || !g.name || !g.list) return;
          var nms = splitNames(g.name);
          nms.forEach(function(nm){
            var s = ds[nm] || (ds[nm] = {hu:0,long:0,ru:0,chu:0,total:0,groups:0});
            s.groups++;
            g.list.forEach(function(x){ if (s[x] !== undefined) s[x]++; s.total++; });
            var arr = near[nm] || (near[nm] = []);
            g.list.forEach(function(x){ arr.push(x); });
            if (arr.length > 15) arr.splice(0, arr.length - 15);
          });
        });
        // 3) 学习规律（个人 vs 全局基准 + 专走三门 + 近期动态）
        var focus = [];
        Object.keys(ds).forEach(function(n){
          var s = ds[n];
          if (s.total < 8) return;
          var tags = [];
          var p = {};
          doorsArr.forEach(function(x){ p[x] = Math.round(s[x]/s.total*100); });
          // 专走三门：某门一次没走，其他三门都走（用户观察：一直龙虎出不走入）
          doorsArr.forEach(function(x){
            if (s[x] === 0){
              var others = doorsArr.filter(function(y){ return s[y] > 0; });
              if (others.length === 3) tags.push({t:'⚠️专走'+others.map(function(y){return DOOR_NAME[y];}).join('')+'留'+DOOR_NAME[x]+'·疑似诱单', c:'#f87171'});
              else if (gp[x] > 10) tags.push({t:'从不出'+DOOR_NAME[x]+'门', c:'#f87171'});
            }
          });
          // 四留一：某门占比极低(<全局一半 且 <12%)
          doorsArr.forEach(function(x){ if (s[x] > 0 && p[x] < 12 && p[x] < gp[x]/2) tags.push({t:DOOR_NAME[x]+'门极少'+p[x]+'%(平均'+gp[x]+'%)', c:'#fbbf24'}); });
          // 单边主导：某门比全局平均多出>=20%
          doorsArr.forEach(function(x){ if (p[x] - gp[x] >= 20) tags.push({t:DOOR_NAME[x]+'门偏多+'+ (p[x]-gp[x]) +'%(平均'+gp[x]+'%)', c:'#4ade80'}); });
          // 两门集中：主走两门>=85%
          var sp = doorsArr.slice().sort(function(a,b){ return p[b]-p[a]; });
          if (p[sp[0]]+p[sp[1]] >= 85) tags.push({t:'主走'+DOOR_NAME[sp[0]]+DOOR_NAME[sp[1]]+'门'+String(p[sp[0]]+p[sp[1]])+'%', c:'#38bdf8'});
          // 专走两门：top2>=85% 且另外两门合计<=10%（一直只跑2门）
          var sp2 = doorsArr.slice().sort(function(a,b){ return p[b]-p[a]; });
          var oth2 = doorsArr.filter(function(x){ return x!==sp2[0] && x!==sp2[1]; });
          if (s.total >= 12 && p[sp2[0]]+p[sp2[1]] >= 85 && (s[oth2[0]]+s[oth2[1]]) <= s.total*0.10){
            tags.push({t:'专走'+DOOR_NAME[sp2[0]]+DOOR_NAME[sp2[1]]+' · 从不出'+DOOR_NAME[oth2[0]]+DOOR_NAME[oth2[1]], c:'#fb923c'});
          }
          // 近15手专走两门（近期一直只跑2门）
          var arr = near[n] || [];
          if (arr.length >= 10){
            var tc = {hu:0,long:0,ru:0,chu:0};
            arr.forEach(function(x){ if (tc[x]!==undefined) tc[x]++; });
            var ttot = arr.length;
            var tp = {};
            doorsArr.forEach(function(x){ tp[x] = Math.round(tc[x]/ttot*100); });
            var tsp = doorsArr.slice().sort(function(a,b){ return tp[b]-tp[a]; });
            var toth = doorsArr.filter(function(x){ return x!==tsp[0] && x!==tsp[1]; });
            if (tp[tsp[0]]+tp[tsp[1]] >= 85 && (tc[toth[0]]+tc[toth[1]]) <= ttot*0.10){
              tags.push({t:'近15手专走'+DOOR_NAME[tsp[0]]+DOOR_NAME[tsp[1]]+' · 从不出'+DOOR_NAME[toth[0]]+DOOR_NAME[toth[1]], c:'#fb923c'});
            }
          }
          // 走过即停：某门开头走完、后半场不再出（用户观察：走了入后续不再入）
          var allLst = [];
          groups.forEach(function(g){
            if (!g || !g.list) return;
            if (splitNames(g.name).indexOf(n) < 0) return;
            allLst = allLst.concat(g.list);
          });
          if (allLst.length >= 10){
            var half = Math.ceil(allLst.length/2);
            var head = allLst.slice(0, half);
            var tail2 = allLst.slice(half);
            doorsArr.forEach(function(x){
              if (head.indexOf(x) >= 0 && tail2.indexOf(x) < 0) tags.push({t:'走过即停：'+DOOR_NAME[x]+'开头走完，后半不再出', c:'#fb923c'});
            });
            // 后半场只跑2门到结束
            if (tail2.length >= 6){
              var tc3 = {hu:0,long:0,ru:0,chu:0};
              tail2.forEach(function(x){ if (tc3[x]!==undefined) tc3[x]++; });
              var alive2 = doorsArr.filter(function(x){ return tc3[x] > 0; });
              if (alive2.length === 2) tags.push({t:'后半场只跑'+DOOR_NAME[alive2[0]]+DOOR_NAME[alive2[1]]+'到结束', c:'#fbbf24'});
            }
          }
          // 实际主走2门（放宽 top2≥65%，≥10手。用户观察：实际都是2门）
          if (s.total >= 10 && p[sp[0]]+p[sp[1]] >= 65){
            tags.push({t:'实际主走'+DOOR_NAME[sp[0]]+DOOR_NAME[sp[1]]+'两门'+String(p[sp[0]]+p[sp[1]])+'%', c:'#38bdf8'});
          }
          // 后半场收敛：去掉前4手后只跑2门到结束
          var converge = [];
          groups.forEach(function(g){
            if (!g || !g.list) return;
            if (splitNames(g.name).indexOf(n) < 0) return;
            var lst = g.list;
            if (lst.length >= 12){
              var tail = lst.slice(4);
              var cnt = {};
              tail.forEach(function(x){ cnt[x] = (cnt[x]||0)+1; });
              var have = doorsArr.filter(function(x){ return cnt[x] > 0; });
              if (have.length === 2 && tail.length >= 8) converge.push(DOOR_NAME[have[0]]+DOOR_NAME[have[1]]);
            }
          });
          if (converge.length){
            var cm = {};
            converge.forEach(function(c){ cm[c] = (cm[c]||0)+1; });
            var bestC = Object.keys(cm).sort(function(a,b){ return cm[b]-cm[a]; })[0];
            tags.push({t:'后半场收敛 · 一直跑'+bestC+'到结束('+cm[bestC]+'场)', c:'#fbbf24'});
          }
          // 组内最长连庄
          var best = 1, bestDoor = '';
          groups.forEach(function(g){
            if (!g || !g.list) return;
            if (splitNames(g.name).indexOf(n) < 0) return;
            var r = 1;
            for (var i=1;i<g.list.length;i++){
              if (g.list[i] === g.list[i-1]) { r++; if (r>best){best=r; bestDoor=g.list[i];} }
              else r = 1;
            }
          });
          if (best >= 6) tags.push({t:'最长连'+DOOR_NAME[bestDoor]+' '+best+'手', c:'#c084fc'});
          // 近15手不走某门（近期动态）
          if (arr.length >= 10){
            doorsArr.forEach(function(x){ if (arr.indexOf(x) < 0) tags.push({t:'近15手不走'+DOOR_NAME[x]+'门', c:'#fb923c'}); });
          }
          // 偏差标签（vs 全局）
          var devTags = [];
          doorsArr.forEach(function(x){
            var dev = p[x] - gp[x];
            if (dev >= 8) devTags.push(DOOR_NAME[x]+'+'+dev);
            else if (dev <= -8) devTags.push(DOOR_NAME[x]+dev);
          });
          focus.push({name:n, s:s, p:p, tags:tags, dev:devTags, score: tags.length*10 + (devTags.length*3) + s.total});
        });
        focus.sort(function(a,b){ return b.score - a.score; });
        var focusShow = focus.slice(0, 15);
        if (focusShow.length){
          html += '<div style="font-size:12px;color:#fbbf24;font-weight:700;margin:8px 0 4px;">🎯 AI 关注 · 四门规律（从数据学习 · 对比全局平均）</div>';
          html += '<div style="font-size:9px;color:#64748b;margin-bottom:4px;">全局平均：虎 '+gp.hu+'% · 龙 '+gp.long+'% · 入 '+gp.ru+'% · 出 '+gp.chu+'%</div>';
          html += '<div style="font-size:10px;color:#f87171;font-weight:700;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);border-radius:6px;padding:3px 6px;margin-bottom:4px;">⚠️ 诱单警示：专走三门、长期留一门不走 = 最典型钓鱼信号。留门越久越可能反手进门收割，盯这种人要反着防，别追着他留的门下注</div>';
          html += '<div style="font-size:9px;color:#94a3b8;background:rgba(148,163,184,.08);border-radius:6px;padding:3px 6px;margin-bottom:4px;">🤖 AI 自主研究框架（自动扫描每个人/每场/每天）：专走三门留一门 · 专走两门 · 后半场收敛 · 近15手留门 · 单边偏多 · 两门集中 · 最长连庄 · 跨人框架借用</div>';
          focusShow.forEach(function(f){
            var tagHtml = f.tags.length ? f.tags.map(function(t){ return '<span style="display:inline-block;background:rgba(251,191,36,.12);color:'+t.c+';border:1px solid '+t.c+'44;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:700;margin-right:3px;">'+t.t+'</span>'; }).join('') : '<span style="display:inline-block;background:rgba(148,163,184,.1);color:#94a3b8;border:1px solid #94a3b844;padding:1px 6px;border-radius:6px;font-size:10px;font-weight:700;">暂无异常规律</span>';
            var devHtml = f.dev.length ? '<div style="font-size:9px;color:#94a3b8;margin-top:1px;">vs平均：'+f.dev.join(' ')+'</div>' : '';
            var bar = '';
            doorsArr.forEach(function(x){ bar += '<span style="display:inline-block;width:'+f.p[x]+'%;background:'+doorColor[x]+';height:6px;"></span>'; });
            html += '<div style="background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);border-radius:8px;padding:6px 8px;margin-bottom:4px;">'
              + '<div style="display:flex;justify-content:space-between;align-items:center;"><span style="color:#fef3c7;font-weight:700;font-size:12px;">'+escapeHtml(f.name)+'</span><span style="color:#94a3b8;font-size:10px;">'+f.s.groups+'组 · '+f.s.total+'手</span></div>'
              + '<div style="display:flex;height:6px;border-radius:3px;overflow:hidden;margin:3px 0;">'+bar+'</div>'
              + '<div style="font-size:10px;color:#94a3b8;">虎 '+f.p.hu+'% · 龙 '+f.p.long+'% · 入 '+f.p.ru+'% · 出 '+f.p.chu+'%</div>'
              + devHtml
              + '<div style="margin-top:2px;">'+tagHtml+'</div>'
              + '</div>';
          });
          html += '<div style="font-size:9px;color:#64748b;margin-top:2px;">规律=个人分布对比全部数据自动学习：专走三门/从不走某门/四留一/单边/集中/连庄/近15手；≥8手即评，仅供参考无确定规律</div>';
        }
      return html;
    }

  // 当日框架借用：同一天多个人用同一框架

          var dayPat = {};
          groups.forEach(function(g){

  // ===== 单品分析：把某个组名/游戏名当单品，AI 打标签 =====
  function renderItemAnalyze(groups){
    var DRN = {hu:'虎',long:'龙',ru:'入',chu:'出'};

    var fg = timeFilterGroups(groups);

    // 快捷选名（手数最多的前8）
    var cnt = {};
    fg.forEach(function(g){ if (!g || !g.name) return; if (!cnt[g.name]) cnt[g.name] = {g:0,h:0}; cnt[g.name].g++; cnt[g.name].h += (g.list||[]).length; });
    var names = Object.keys(cnt).map(function(n){ return {n:n, g:cnt[n].g, h:cnt[n].h}; });
    names.sort(function(a,b){ return b.h - a.h; });
    var chips = names.slice(0,8).map(function(x){

    }).join('') || '<span style="font-size:10px;color:#64748b;">暂无数据</span>';
    html += '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;">'+chips+'</div>';

      document.querySelectorAll('.item-chip').forEach(function(b){

          $('aiNameInput').value = b.dataset.n;

          renderAIPage();
        });
      });

      html += '<div style="font-size:11px;color:#94a3b8;padding:8px 0;">👆 在上面输入名字，或点上面的人名，AI 给这个「单品」打标签</div>';
      return html;
    }
    var nms = q.split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean);
    nms.forEach(function(n){
      var info = calcFocusNearName(n, fg);
      if (!info){ html += '<div class="aihint-ok" style="margin-top:6px;">'+n+'：暂无数据（需≥8手）</div>'; return; }
      var gr = fg.filter(function(g){ return g.name && nmSplit(g.name).indexOf(n) >= 0; });
      var gs = gr.length; var hs = 0; gr.forEach(function(g){ hs += (g.list||[]).length; });
      // 特征标签（蓝）+ 异常标签（红/橙）
      var tags = info.tags.slice();
      var feat = [];
      var sp = drs.slice().sort(function(a,b){ return info.p[b] - info.p[a]; });
      feat.push({t:'主走'+DRN[sp[0]]+'门'+info.p[sp[0]]+'%', c:'#38bdf8'});
      var mx = info.p[sp[0]];
      if (mx >= 45) feat.push({t:'单边偏多·'+DRN[sp[0]], c:'#f97316'});
      else if (mx <= 32 && (info.p[sp[0]] - info.p[sp[3]]) <= 8) feat.push({t:'四门均衡', c:'#34d399'});
      if (info.p[sp[3]] <= 12) feat.push({t:'冷门·'+DRN[sp[3]]+'很少走', c:'#94a3b8'});
      // AI 评价等级
      var lv = tags.length >= 3 ? 'danger' : tags.length >= 1 ? 'warn' : 'ok';
      var ev = lv === 'danger' ? '⚠️ 高度异常：套路明显，别顺着TA留的门追' : lv === 'warn' ? '⚠️ 有套路：习惯明显，要反着防' : '✅ 暂无异常：四门较均衡';
      var evc = lv === 'danger' ? '#f87171' : lv === 'warn' ? '#fbbf24' : '#34d399';
      html += '<div style="background:rgba(148,163,184,.05);border:1px solid rgba(148,163,184,.15);border-radius:10px;padding:8px;margin-bottom:8px;">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;"><span style="font-size:13px;color:#fef3c7;font-weight:700;">'+n+'</span><span style="font-size:10px;color:#64748b;">'+gs+'组 · '+hs+'手</span></div>';
      var tagHtml = feat.map(function(x){ return '<span style="display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;margin:2px 2px 0 0;background:'+x.c+'22;color:'+x.c+';border:1px solid '+x.c+'55;">'+x.t+'</span>'; }).join('');
      var tagWarn = tags.map(function(x){ return '<span style="display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;margin:2px 2px 0 0;background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.35);">⚠️ '+x+'</span>'; }).join('');
      html += '<div>'+tagHtml+tagWarn+'</div>';
      var bar = '';
      drs.forEach(function(x){ bar += '<span style="display:inline-block;width:'+info.p[x]+'%;background:'+(x==='hu'?'#dc2626':x==='long'?'#2563eb':x==='ru'?'#16a34a':'#64748b')+';height:6px;border-radius:2px;"></span>'; });
      html += '<div style="height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.06);display:flex;gap:1px;margin:6px 0 3px;">'+bar+'</div>';
      html += '<div style="font-size:10px;color:#94a3b8;">虎'+info.p.hu+'% 龙'+info.p.long+'% 入'+info.p.ru+'% 出'+info.p.chu+'%</div>';
      html += '<div style="font-size:11px;font-weight:700;margin-top:5px;color:'+evc+';">'+ev+'</div>';
      html += '</div>';
    });
    return html;
  }

  function sbReq(path, opts, cb){

    xhr.timeout = (opts && opts.timeout) || 20000;
    xhr.ontimeout = function(){ fin(new Error('timeout')); };

    xhr.send((opts && opts.body) || null);

  function _nt(s){
    s = String(s || '');

    var d = parts[0].split('-');
    if (d.length === 2){
      var a = parseInt(d[0],10), b = parseInt(d[1],10);

    }
    return parts.join(' ');
  }
  // 时间解析为可比较数值（MM-DD HH:mm，容忍无前导零）
  function _tk(t){
    if (!t) return 0;
    var p = String(t).trim().split(/[\s:-]+/);
    var m = parseInt(p[0],10)||1, d = parseInt(p[1],10)||1, h = parseInt(p[2],10)||0, mi = parseInt(p[3],10)||0;

    var MAX_OFF = 20000; // 最多拉 20 批（2万组上限）
    function pull(){
      while (inFlight < 3 && nextOff <= MAX_OFF){
        var off = nextOff; nextOff += 1000; inFlight++;
        (function(off){
          sbReq(CLOUD_TBL + '?select=name,time,list&order=id.asc&limit=1000&offset=' + off, null, function(err, xhr){
            inFlight--;
            if (err){
              if (!all.length){ cb(err); return; }
            } else {
              var rows = [];
              if (xhr.status === 200){ try{ rows = JSON.parse(xhr.responseText); }catch(e){} }
              all = all.concat(rows);
              doneBatch++;
              if (onProg) onProg(doneBatch);
            }
            if (inFlight === 0){
              all.sort(function(a,b){ return _tk(a.time) - _tk(b.time) || String(a.name||'').localeCompare(String(b.name||'')); });
              cb(null, all);
            } else {

            }
          });
        })(off);
      }
    }

  }

  function $(id){ return document.getElementById(id); }

  function currentName(){

  function renderGrid(){
    const g = $('grid');
    const cur = state.current;
    const marks = state.currentMarks || [];
    const N = 12;
    let html = '';
    for (let i=0; i<N; i++){
      const s = cur[i];
      const isLast = i === cur.length - 1;
      const m = marks[i];
      let inner = '';
      if (s){
        inner = SYMBOLS[s];
        if (m === 1 || m === 0) inner += `<span class="cell-mark ${m?'ok':'bad'}">${m?'✓':'×'}</span>`;
      } else {
        inner = (i+1);
      }
      html += `<div class="cell ${s||'empty'}${isLast?' last':''}" data-idx="${i}">${inner}</div>`;
    }
    g.innerHTML = html;
    g.querySelectorAll('.cell').forEach(c => {
      c.addEventListener('click', () => {
        const idx = parseInt(c.dataset.idx);
        if (idx >= cur.length) return;
        const s = cur[idx];
        const nxt = NEXT[s];
        if (nxt) cur[idx] = nxt;
        else cur.splice(idx, 1);
        save(); render();
      });
    });
  }

  function renderStats(){
    let hu=0, long=0, ru=0, chu=0;
    const count = arr => arr.forEach(s => {
      if (s==='hu') hu++; else if (s==='long') long++;
      else if (s==='ru') ru++; else if (s==='chu') chu++;
    });
    count(state.current);
    let groups = state.groups;
    if (activeTag) groups = groups.filter(g => g.name === activeTag);
    const topQ = $('topSearch').value.trim();
    if (topQ) groups = groups.filter(g => g.name.includes(topQ));
    groups.forEach(g => count(g.list));
    $('stHu').textContent = hu;
    $('stLong').textContent = long;
    $('stRu').textContent = ru;
    $('stChu').textContent = chu;
    // 标题
    const titleEl = document.querySelector('.header .stat-title');
    if (titleEl){
      const label = activeTag || topQ;
      titleEl.textContent = label ? (label + ' 的路数') : '全部路数';
    }
  }

  function renderHistory(){
    const box = $('historyList');
    let groups = state.groups;
    if (activeTag) groups = groups.filter(g => g.name === activeTag);
    const q = searchQuery.trim();
    if (q) groups = groups.filter(g => g.name.includes(q));
    if (!groups.length){
      box.innerHTML = '<div class="empty-tip">' + (state.groups.length ? '没找到匹配的组' : '还没有完成的组') + '</div>';
      return;
    }
    let html = '';
    for (let i = groups.length-1; i >= 0; i--){
      const g = groups[i];
      const realIdx = state.groups.indexOf(g);
      html += `<div class="history-item">
        <div class="history-head">
          <span class="history-name">${escapeHtml(g.name)}<span class="history-count">${g.list.length}个${g.time?' · '+g.time:''}</span></span>
          <button class="history-del" data-i="${realIdx}">删除</button>
        </div>
        <div class="history-grid">`;
      g.list.forEach((s, gi) => {
        const gm = (g.marks || [])[gi];
        const gmHtml = (gm === 1 || gm === 0) ? `<span class="hcell-mark ${gm?'ok':'bad'}">${gm?'✓':'×'}</span>` : '';
        html += `<div class="hcell ${s}">${SYMBOLS[s]}${gmHtml}</div>`;
      });
      html += `</div>`;
      // 每组画像：四路占比条 + 特征标签
      const prof = groupProfile(g);
      const pct = k => prof.total ? Math.round(prof.c[k]/prof.total*100) : 0;
      html += `<div class="dist-bar"><span class="dist-hu" style="width:${pct('hu')}%"></span><span class="dist-long" style="width:${pct('long')}%"></span><span class="dist-ru" style="width:${pct('ru')}%"></span><span class="dist-chu" style="width:${pct('chu')}%"></span></div>`;
      html += `<div class="profile-tags">${prof.tags.map(t => `<span class="profile-tag">${t}</span>`).join('')}</div>`;
      html += `</div>`;
    }
    box.innerHTML = html;
    box.querySelectorAll('.history-del').forEach(b => {
      b.addEventListener('click', () => {
        if (!confirm('删除这一组？')) return;
        state.groups.splice(parseInt(b.dataset.i), 1);
        save(); render();
      });

  }

  function parseNames(str){
    // 支持逗号/空格/顿号分隔多个名字
    return str.split(/[,，\s、]+/).map(n => n.trim()).filter(Boolean);
  }
  function getFiltered(){

    const yestStr = (yest.getMonth()+1) + '-' + pad(yest.getDate());

  // ===== 统计学习AI大脑（第二信号源）：马尔可夫转移 + 条件概率 + 位置分布 =====
  function statBrain(curArr, filtered){
    var KEYS = ['hu','long','ru','chu'];
    var s = {hu:0,long:0,ru:0,chu:0};
    if (!filtered.length) return s;
    // 全局字符频率（用作平滑先验，避免样本少时零概率）
    var prior = {hu:0,long:0,ru:0,chu:0}, priorT = 0;
    filtered.forEach(function(g){ g.list.forEach(function(x){ prior[x]++; priorT++; }); });
    // 一阶马尔可夫：P(下一手 | 当前最后一手)，拉普拉斯平滑 + 先验混合
    if (curArr.length >= 1){
      var last = curArr[curArr.length-1];
      var tr = {hu:0,long:0,ru:0,chu:0}, trT = 0;
      filtered.forEach(function(g){
        for (var i=0;i<g.list.length-1;i++){
          if (g.list[i] === last){ tr[g.list[i+1]]++; trT++; }
        }
      });
      var a1 = 2;
      KEYS.forEach(function(k){
        s[k] += (tr[k] + a1*(prior[k]+1)/(priorT+4)) / (trT + a1);
      });
    }
    // 二阶马尔可夫：P(下一手 | 最近两手)，权重加倍
    if (curArr.length >= 2){
      var last2 = curArr.slice(-2);
      var tr2 = {hu:0,long:0,ru:0,chu:0}, tr2T = 0;
      filtered.forEach(function(g){
        for (var i=0;i<g.list.length-2;i++){
          if (g.list[i]===last2[0] && g.list[i+1]===last2[1]){ tr2[g.list[i+2]]++; tr2T++; }
        }
      });
      var a2 = 1.5;
      KEYS.forEach(function(k){
        s[k] += 2 * (tr2[k] + a2*(prior[k]+1)/(priorT+4)) / (tr2T + a2);
      });
    }
    // 位置分布：当前第 N 手位置上，历史上各符号出现频率
    var pos = curArr.length;
    var pc = {hu:0,long:0,ru:0,chu:0}, pcT = 0;
    filtered.forEach(function(g){ if (g.list.length > pos){ pc[g.list[pos]]++; pcT++; } });
    if (pcT > 0){
      KEYS.forEach(function(k){ s[k] += (pc[k] + 0.5) / (pcT + 2); });
    }
    return s;
  }

  function predictTop2(curArr, filtered){
    if (!filtered.length) return []; // 只学这个人，没数据不瞎猜
    var score = {hu:0, long:0, ru:0, chu:0};
    var now = new Date().getTime();
    function parseT(g){
      if (!g.time) return now - 7*24*3600*1000;
      var parts = g.time.split(' ');
      var d = parts[0].split('-');
      var y = 2026, mo = parseInt(d[0])-1, da = parseInt(d[1]);
      var h=0, mi=0;
      if (parts[1]){ var hm=parts[1].split(':'); h=parseInt(hm[0]); mi=parseInt(hm[1]); }
      return new Date(y,mo,da,h,mi).getTime();
    }
    var times = filtered.map(parseT);
    var maxT = Math.max.apply(null, times);
    // 时间加权（增强版）：越新的组权重越高；老数据快速衰减，避免淹没新习惯
    function w(i){
      var diffH = (maxT - times[i]) / 3600000;
      if (diffH <= 12) return 2.4 - (diffH/12)*0.8;      // 12小时内 2.4 → 1.6
      if (diffH <= 48) return 1.6 - (diffH-12)/60;        // 12-48小时 1.6 → 1.0
      return Math.max(0.12, 1.0 - (diffH-48)/100);        // 48小时后快速衰减，下限0.12
    }
    // 组内位置加权：同一条路单里越靠后的手数（越接近当前状态）权重越高
    function posW(g, pos){
      var L = g.list.length;
      if (L <= 1 || pos <= 0) return 1;
      if (pos >= L-1) return 1.5;
      return 1 + 0.5 * pos / (L-1);
    }
    function wg(g, gi, pos){ return w(gi) * posW(g, pos); }
    // 前缀匹配
    var pC = {hu:0,long:0,ru:0,chu:0};
    filtered.forEach(function(g, gi){
      var ok = true;
      for (var i=0;i<curArr.length;i++){ if(g.list[i]!==curArr[i]){ok=false;break;} }
      if (ok && g.list.length>curArr.length) pC[g.list[curArr.length]] += wg(g, gi, curArr.length);
    });
    var pT = pC.hu+pC.long+pC.ru+pC.chu;
    if (pT>=1) ['hu','long','ru','chu'].forEach(function(k){ score[k]+=pC[k]*3; });
    // 上一手（1-gram）
    if (curArr.length>=1){
      var last1 = curArr[curArr.length-1];
      var c1 = {hu:0,long:0,ru:0,chu:0};
      filtered.forEach(function(g, gi){ for(var i=0;i<g.list.length-1;i++){ if(g.list[i]===last1) c1[g.list[i+1]] += wg(g, gi, i+1); } });
      ['hu','long','ru','chu'].forEach(function(k){ score[k]+=c1[k]*1.5; });
    }
    // 位置统计
    var pos = curArr.length;
    filtered.forEach(function(g, gi){ if(g.list.length>pos) score[g.list[pos]] += wg(g, gi, pos); });
    // 连出2个后规律
    if (curArr.length>=2 && curArr[curArr.length-1]===curArr[curArr.length-2]){
      var last = curArr[curArr.length-1];
      var cont = 0, rev = {hu:0,long:0,ru:0,chu:0}, revT = 0;
      filtered.forEach(function(g, gi){
        for (var i=1;i<g.list.length-1;i++){
          if (g.list[i]===last && g.list[i-1]===last){
            if (g.list[i+1]===last) cont += wg(g, gi, i+1);
            else { rev[g.list[i+1]] += wg(g, gi, i+1); revT += wg(g, gi, i+1); }
          }
        }
      });
      if (cont + revT > 0){
        if (cont >= revT) score[last] += cont * 2;
        else ['hu','long','ru','chu'].forEach(function(k){ if(k!==last) score[k] += rev[k] * 2; });
      } else {
        ['hu','long','ru','chu'].forEach(function(k){ if(k!==last) score[k]+=0.5; });
      }
    }
    // 2-gram
    if (curArr.length>=2){
      var last2 = curArr.slice(-2);
      var c2 = {hu:0,long:0,ru:0,chu:0};
      filtered.forEach(function(g, gi){
        for(var i=0;i<g.list.length-2;i++){
          if(g.list[i]===last2[0] && g.list[i+1]===last2[1]) c2[g.list[i+2]] += wg(g, gi, i+2);
        }
      });
      var t2 = c2.hu+c2.long+c2.ru+c2.chu;
      if (t2>=1) ['hu','long','ru','chu'].forEach(function(k){ score[k]+=c2[k]*4; });
    }
    // 3-gram
    if (curArr.length>=3){
      var last3 = curArr.slice(-3);
      var c3 = {hu:0,long:0,ru:0,chu:0};
      filtered.forEach(function(g, gi){
        for(var i=0;i<g.list.length-3;i++){
          if(g.list[i]===last3[0] && g.list[i+1]===last3[1] && g.list[i+2]===last3[2]) c3[g.list[i+3]] += wg(g, gi, i+3);
        }
      });
      var t3 = c3.hu+c3.long+c3.ru+c3.chu;
      if (t3>=1) ['hu','long','ru','chu'].forEach(function(k){ score[k]+=c3[k]*6; });
    }
    // 4-gram
    if (curArr.length>=4){
      var last4 = curArr.slice(-4);
      var c4 = {hu:0,long:0,ru:0,chu:0};
      filtered.forEach(function(g, gi){
        for(var i=0;i<g.list.length-4;i++){
          if(g.list[i]===last4[0] && g.list[i+1]===last4[1] && g.list[i+2]===last4[2] && g.list[i+3]===last4[3]) c4[g.list[i+4]] += wg(g, gi, i+4);
        }
      });
      var t4 = c4.hu+c4.long+c4.ru+c4.chu;
      if (t4>=1) ['hu','long','ru','chu'].forEach(function(k){ score[k]+=c4[k]*8; });
    }
    // 冷热指数
    ['hu','long','ru','chu'].forEach(function(k){
      var lastIdx = -1;
      for(var i=curArr.length-1;i>=0;i--){ if(curArr[i]===k){ lastIdx=i; break; } }
      var gap = lastIdx === -1 ? curArr.length : (curArr.length - 1 - lastIdx);
      if (gap >= 3) score[k] += gap * 0.3;
    });
    // 物极必反
    if (curArr.length>=3){
      var last = curArr[curArr.length-1];
      var streak = 1;
      for(var i=curArr.length-2;i>=0;i--){ if(curArr[i]===last) streak++; else break; }
      if (streak >= 3){
        score[last] -= streak * 1;
        ['hu','long','ru','chu'].forEach(function(k){ if(k!==last) score[k] += streak * 0.5; });
      }
    }
    // 交替模式
    if (curArr.length>=3 && curArr[curArr.length-1]!==curArr[curArr.length-2] && curArr[curArr.length-2]===curArr[curArr.length-3]){
      var next = curArr[curArr.length-2];
      score[next] += 1.5;
    }
    // 连出3个后规律
    if (curArr.length>=3 && curArr[curArr.length-1]===curArr[curArr.length-2] && curArr[curArr.length-2]===curArr[curArr.length-3]){
      var last3s = curArr[curArr.length-1];
      var cont3 = 0, rev3 = {hu:0,long:0,ru:0,chu:0}, rev3T = 0;
      filtered.forEach(function(g, gi){
        for (var i=2;i<g.list.length-1;i++){
          if (g.list[i]===last3s && g.list[i-1]===last3s && g.list[i-2]===last3s){
            if (g.list[i+1]===last3s) cont3 += wg(g, gi, i+1);
            else { rev3[g.list[i+1]] += wg(g, gi, i+1); rev3T += wg(g, gi, i+1); }
          }
        }
      });
      if (cont3 + rev3T > 0){
        if (cont3 >= rev3T) score[last3s] += cont3 * 1.5;
        else ['hu','long','ru','chu'].forEach(function(k){ if(k!==last3s) score[k] += rev3[k] * 1.5; });
      }
    }
    // 全局频率
    var cG = {hu:0,long:0,ru:0,chu:0};
    filtered.forEach(function(g, gi){ g.list.forEach(function(s, idx){cG[s]+=wg(g, gi, idx);}); });
    var tG = cG.hu+cG.long+cG.ru+cG.chu;
    if (tG>0) ['hu','long','ru','chu'].forEach(function(k){ score[k]+=cG[k]/tG*2; });
    // 统计学习AI大脑融合（主导信号）：马尔可夫+条件概率+位置分布归一化后加权
    var sb = statBrain(curArr, filtered);
    var sbT = sb.hu + sb.long + sb.ru + sb.chu;
    if (sbT > 0){
      ['hu','long','ru','chu'].forEach(function(k){ score[k] += sb[k] / sbT * 6; });
    }
    return Object.keys(score).sort(function(a,b){return score[b]-score[a];}).slice(0,3);
  }
  function renderLiveHint(){
    const box = $('liveHint');
    const name = $('groupName').value.trim();
    if (!name){ box.innerHTML = ''; return; }

    // 时间筛选
    const now = new Date();
    const pad = x => String(x).padStart(2,'0');
    const todayStr = (now.getMonth()+1) + '-' + pad(now.getDate());
    const yest = new Date(now); yest.setDate(yest.getDate()-1);
    const yestStr = (yest.getMonth()+1) + '-' + pad(yest.getDate());

    const names = parseNames(name);
    let allMatches = state.groups.filter(g => names.indexOf(g.name) >= 0);
    // 时间筛选按钮
    let filtered = allMatches;
    if (timeFilter === 'today') filtered = allMatches.filter(g => g.time && g.time.startsWith(todayStr));
    else if (timeFilter === 'yesterday') filtered = allMatches.filter(g => g.time && g.time.startsWith(yestStr));

    // 只看这个人自己的历史，没数据就提示，不拿别人凑数
    if (!filtered.length){ box.innerHTML = "<div style=\"padding:10px;color:#888;font-size:12px;text-align:center;\">这个人暂无历史数据，记几组就开始学他了</div>"; return; }
    let hu=0, long=0, ru=0, chu=0;
    filtered.forEach(g => g.list.forEach(s => {
      if (s==='hu') hu++; else if (s==='long') long++;
      else if (s==='ru') ru++; else if (s==='chu') chu++;
    }));
    let html = `<div style="background:#2b2b2b;border-radius:6px;padding:8px 10px;font-size:12px;color:#ccc;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">

          <button class="mini-btn ${timeFilter==='today'?'on':''}" data-tf="today">今天</button>
          <button class="mini-btn ${timeFilter==='yesterday'?'on':''}" data-tf="yesterday">昨天</button>

      </div>
      <div style="display:flex;gap:8px;margin-bottom:6px;">

    // 统计AI推荐：用全部历史组学习（不只当前人名），输出 top3 三卡面板
    const cur = state.current;
    var learnPool = filtered;
    var sb2 = statBrain(cur, learnPool);
    var sbT2 = sb2.hu + sb2.long + sb2.ru + sb2.chu;
    if (sbT2 > 0){
      var pctOf = function(k){ return Math.round(sb2[k]/sbT2*100); };
      var sortedSb = Object.keys(sb2).sort(function(a,b){ return sb2[b]-sb2[a]; });
      var bestK = sortedSb[0];
      var META = { hu:['虎','#7f1d1d','#fecaca'], long:['龙','#1e3a8a','#bfdbfe'], ru:['入','#854d0e','#fef08a'], chu:['出','#14532d','#bbf7d0'] };

function cell(k, rank){
        if (!k) return '<div style="padding:6px 0;"></div>';
        var m = META[k];
        var sh = rank === 0 ? 'box-shadow:0 0 0 2px #fbbf24;' : '';
        return '<div style="padding:8px 0;border-radius:6px;text-align:center;background:'+m[1]+';color:'+m[2]+';'+sh+'">'
          + '<div style="font-size:30px;font-weight:900;line-height:1.2;">'+m[0]+'</div>'
          + '</div>';
      }
      html += '<div style="background:linear-gradient(135deg,#1a0a2e,#0f172a);border:1px solid #a855f7;border-radius:6px;padding:6px 8px;margin-bottom:6px;">'
        + '<div style="font-size:12px;color:#c084fc;font-weight:700;margin-bottom:4px;">统计AI推荐 <span style="font-size:11px;color:#888;font-weight:400;">· 学了'+learnPool.length+'组 · 仅供参考</span></div>'
        + '<div style="font-size:13px;color:#93c5fd;font-weight:700;margin:4px 0;">'+sortedSb.slice(0,3).map(function(k){ return {hu:'虎',long:'龙',ru:'入',chu:'出'}[k]+pctOf(k)+'%'; }).join(' ')+' · 主推【'+{hu:'虎',long:'龙',ru:'入',chu:'出'}[bestK]+'】</div>'
        + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;">'
        + cell(sortedSb[0],0)
        + cell(sortedSb[1],1)
        + cell(sortedSb[2],2)
        + '</div>'
        + '</div>';
    }
    // 最近12次预测对错（放在预测板外面，确保每次都更新）
    if (state.predictHistory && state.predictHistory.length){
      var histHtml = state.predictHistory.map(function(h, i){
        var color = h ? '#22c55e' : '#ef4444';
        var mark = h ? '√' : 'X';
        return '<span style="display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:'+color+';color:#fff;font-size:13px;font-weight:900;margin-right:4px;">'+mark+'</span>';
      }).join('');
      html += '<div style="background:#1a1a1a;border-radius:6px;padding:6px 8px;margin-bottom:6px;text-align:center;border:1px solid #333;">'+histHtml+'</div>';
    }
    const matches = filtered;
    function prefixScore(g){
      if (!cur.length) return 0;
      let n = 0;
      for (let i=0; i<Math.min(cur.length, g.list.length); i++){
        if (g.list[i] === cur[i]) n++; else break;
      }
      return n;
    }
    matches.sort((a,b) => {
      var sa = prefixScore(a), sb = prefixScore(b);
      if (sa !== sb) return sb - sa;
      // 相同匹配度，时间最新的排前面
      var ta = a.time || '', tb = b.time || '';
      return tb > ta ? 1 : (tb < ta ? -1 : 0);
    });
    // 每组单独一块，最新在上，用麻将牌格子显示
    for (let i = 0; i < matches.length; i++){
      const g = matches[i];
      const rows = Math.ceil(g.list.length / COLS);
      const score = prefixScore(g);
      const isMatch = cur.length && score >= cur.length;
      let gridHtml = '';
      for (let r = 0; r < rows; r++){
        const startNum = r*COLS + 1;
        const endNum = Math.min((r+1)*COLS, g.list.length);
        gridHtml += `<div style="display:grid;grid-template-columns:20px repeat(6,1fr) 20px;gap:2px;align-items:center;margin-bottom:2px;">
          <span style="font-size:10px;color:#888;text-align:center;">${startNum}</span>`;
        for (let c = 0; c < COLS; c++){
          const idx = r*COLS + c;
          if (idx < g.list.length){
            const s = g.list[idx];
            const gm = (g.marks || [])[idx];
            const gmHtml = (gm === 1 || gm === 0) ? `<span class="hcell-mark ${gm?'ok':'bad'}" style="width:9px;height:9px;font-size:6px;">${gm?'✓':'×'}</span>` : '';
            gridHtml += `<div class="hcell ${s}" style="font-size:14px;">${SYMBOLS[s]}${gmHtml}</div>`;
          } else {
            gridHtml += `<div style="aspect-ratio:1/1;"></div>`;
          }
        }
        gridHtml += `<span style="font-size:10px;color:#888;text-align:center;">${endNum}</span></div>`;
      }
      html += `<div style="border-top:1px solid ${isMatch?'#4ade80':'#444'};padding-top:4px;margin-top:4px;${isMatch?'background:#1a3a2a;border-radius:6px;padding:6px 8px;':''}">
        <div style="color:#888;font-size:11px;margin-bottom:2px;">${g.time || ''}${isMatch?' <span style="color:#4ade80;font-weight:700;">✓ 同走势</span>':''}</div>
        ${gridHtml}
      </div>`;
    }
    html += '</div>';
    box.innerHTML = html;
    bindMiniBtns();
  }

// 记录时实时AI提示：算某人的规律标签
  function nmSplit(nm){ return String(nm).split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean); }
  function calcAIForName(nm){
    var DRN = {hu:'虎',long:'龙',ru:'入',chu:'出'};
    var drs = ['hu','long','ru','chu'];
    var grps = state.groups.filter(function(g){ return g && g.name && nmSplit(g.name).indexOf(nm) >= 0; });
    if (!grps.length) return [];
    var s = {hu:0,long:0,ru:0,chu:0,total:0};
    var near = [];
    grps.forEach(function(g){
      (g.list||[]).forEach(function(x){ if (s[x] !== undefined){ s[x]++; s.total++; } });
      near = near.concat(g.list||[]);
      if (near.length > 15) near.splice(0, near.length - 15);
    });
    if (s.total < 8) return [];
    var tags = [];
    var p = {};
    drs.forEach(function(x){ p[x] = Math.round(s[x]/s.total*100); });
    drs.forEach(function(x){
      if (s[x] === 0){
        var oth = drs.filter(function(y){ return s[y] > 0; });
        if (oth.length === 3) tags.push('⚠️专走'+oth.map(function(y){return DRN[y];}).join('')+'留'+DRN[x]+'·疑似诱单');

      var tc = {}; drs.forEach(function(x){ tc[x] = 0; });
      near.forEach(function(x){ if (tc[x] !== undefined) tc[x]++; });
      var tp = {}; drs.forEach(function(x){ tp[x] = Math.round(tc[x]/near.length*100); });
      var tsp = drs.slice().sort(function(a,b){ return tp[b]-tp[a]; });
      var toth = drs.filter(function(x){ return x!==tsp[0] && x!==tsp[1]; });
      if (tp[tsp[0]]+tp[tsp[1]] >= 85 && (tc[toth[0]]+tc[toth[1]]) <= near.length*0.10) tags.push('近15手专走'+DRN[tsp[0]]+DRN[tsp[1]]+'·从不出'+DRN[toth[0]]+DRN[toth[1]]);
    }
    drs.forEach(function(x){ if (p[x] >= 60) tags.push(DRN[x]+'门'+p[x]+'%'); });
    var sp2 = drs.slice().sort(function(a,b){ return p[b]-p[a]; });
    var o2 = drs.filter(function(x){ return x!==sp2[0] && x!==sp2[1]; });
    if (s.total >= 12 && p[sp2[0]]+p[sp2[1]] >= 85 && (s[o2[0]]+s[o2[1]]) <= s.total*0.10) tags.push('专走'+DRN[sp2[0]]+DRN[sp2[1]]+'·从不出'+DRN[o2[0]]+DRN[o2[1]]);
    var best = 1;
    grps.forEach(function(g){
      var lst = g.list || []; var r = 1;
      for (var i=1;i<lst.length;i++){
        if (lst[i] === lst[i-1]){ r++; if (r>best) best = r; } else r = 1;
      }

  // AI关注（组名位置常显）：算当前人四门规律，记录时直接可见
  function calcFocusNearName(nm, srcGroups){
    var DRN = {hu:'虎',long:'龙',ru:'入',chu:'出'};
    var drs = ['hu','long','ru','chu'];
    var grps = (srcGroups || state.groups).filter(function(g){ return g && g.name && nmSplit(g.name).indexOf(nm) >= 0; });
    if (!grps.length) return null;
    var s = {hu:0,long:0,ru:0,chu:0,total:0};
    var near = [];
    grps.forEach(function(g){
      (g.list||[]).forEach(function(x){ if (s[x] !== undefined){ s[x]++; s.total++; } });
      near = near.concat(g.list||[]);
      if (near.length > 15) near.splice(0, near.length - 15);
    });
    if (s.total < 8) return null;
    var p = {};
    drs.forEach(function(x){ p[x] = Math.round(s[x]/s.total*100); });
    var tags = [];
    // 专走三门留一门（疑似诱单）
    drs.forEach(function(x){
      if (s[x] === 0){
        var oth = drs.filter(function(y){ return s[y] > 0; });
        if (oth.length === 3) tags.push('⚠️专走'+oth.map(function(y){return DRN[y];}).join('')+'留'+DRN[x]+'·疑似诱单');
        else tags.push('从不出'+DRN[x]+'门');
      }
    });
    // 近15手
    if (near.length >= 10){
      drs.forEach(function(x){ if (near.indexOf(x) < 0) tags.push('近15手不走'+DRN[x]+'门'); });
      var tc = {}; drs.forEach(function(x){ tc[x] = 0; });
      near.forEach(function(x){ if (tc[x] !== undefined) tc[x]++; });
      var tp = {}; drs.forEach(function(x){ tp[x] = Math.round(tc[x]/near.length*100); });
      var tsp = drs.slice().sort(function(a,b){ return tp[b]-tp[a]; });
      var toth = drs.filter(function(x){ return x!==tsp[0] && x!==tsp[1]; });
      if (tp[tsp[0]]+tp[tsp[1]] >= 85 && (tc[toth[0]]+tc[toth[1]]) <= near.length*0.10) tags.push('近15手专走'+DRN[tsp[0]]+DRN[tsp[1]]+'·从不出'+DRN[toth[0]]+DRN[toth[1]]);
    }
    // 走过即停：某门这组开头走完、后半场整段不再出（用户观察：走了入后续不再入）
    var allLst = [];
    grps.forEach(function(g){ allLst = allLst.concat(g.list || []); });
    if (allLst.length >= 10){
      var half = Math.ceil(allLst.length / 2);
      var head = allLst.slice(0, half);
      var tail = allLst.slice(half);
      drs.forEach(function(x){
        if (head.indexOf(x) >= 0 && tail.indexOf(x) < 0) tags.push('走过即停：'+DRN[x]+'开头走完，后半不再出');
      });
      // 后半场只跑2门到结束（后半段实际就2门）
      if (tail.length >= 6){
        var tc2 = {}; drs.forEach(function(x){ tc2[x] = 0; });
        tail.forEach(function(x){ if (tc2[x] !== undefined) tc2[x]++; });
        var alive2 = drs.filter(function(x){ return tc2[x] > 0; });
        if (alive2.length === 2) tags.push('后半场只跑'+DRN[alive2[0]]+DRN[alive2[1]]+'到结束');
      }
    }
    // 实际主走2门（放宽：top2≥65%，≥10手。用户观察：实际都是2门）
    var sp3 = drs.slice().sort(function(a,b){ return p[b]-p[a]; });
    if (s.total >= 10 && p[sp3[0]]+p[sp3[1]] >= 65){
      tags.push('实际主走'+DRN[sp3[0]]+DRN[sp3[1]]+'两门'+String(p[sp3[0]]+p[sp3[1]])+'%');
    }
    drs.forEach(function(x){ if (p[x] >= 60) tags.push(DRN[x]+'门'+p[x]+'%'); });
    var sp2 = drs.slice().sort(function(a,b){ return p[b]-p[a]; });
    var o2 = drs.filter(function(x){ return x!==sp2[0] && x!==sp2[1]; });
    if (s.total >= 12 && p[sp2[0]]+p[sp2[1]] >= 85 && (s[o2[0]]+s[o2[1]]) <= s.total*0.10) tags.push('专走'+DRN[sp2[0]]+DRN[sp2[1]]+'·从不出'+DRN[o2[0]]+DRN[o2[1]]);
    var best = 1;
    grps.forEach(function(g){
      var lst = g.list || []; var r = 1;
      for (var i=1;i<lst.length;i++){
        if (lst[i] === lst[i-1]){ r++; if (r>best) best = r; } else r = 1;
      }
    });
    if (best >= 6) tags.push('最长连 '+best+'手');
    return {p:p, tags:tags};
  }
